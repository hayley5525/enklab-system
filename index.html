function addDays(dateStr,n){if(!dateStr)return '';const d=new Date(dateStr+'T00:00:00');if(isNaN(d.getTime()))return '';d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}

function ensureState(){const d=defaultState();state.version=state.version||VERSION;state.settings={...d.settings,...(state.settings||{})};state.masters={...d.masters,...(state.masters||{})};['schedules','shipments','instructors','orgs','equipment','guideSends','guideArchive','tasks','inventoryLog','statusLog','teacherHistory','backups'].forEach(k=>state[k]=Array.isArray(state[k])?state[k]:[]);state.checklist={items:state.checklist?.items||d.checklist.items, legacy:state.checklist?.legacy||[]};state.returnStatus=state.returnStatus||{};state.schedules.forEach(s=>{s.noticeText=s.noticeText||{first:'',final:'',after:''}});state.instructors.forEach(t=>{t.scoreAdjustments=Array.isArray(t.scoreAdjustments)?t.scoreAdjustments:[]});if(Array.isArray(state.masters.companies)&&!state.masters.companies.includes('ENK LAB 본부'))state.masters.companies.unshift('ENK LAB 본부');state.settings.kakaoTemplates={...defaultTemplates(),...(state.settings.kakaoTemplates||{})};}
function detectLegacy(){return Object.values(LEGACY_KEYS).some(k=>ls(k)!==null)}
function backupLegacyDownload(){const data={createdAt:nowStamp(),keys:{}};Object.entries(LEGACY_KEYS).forEach(([name,k])=>data.keys[k]=ls(k));downloadJSON(data,'ENK_기존데이터_업데이트전백업_'+nowStamp().replace(/[-: ]/g,'')+'.json')}
function migrateLegacy(){const legacyRecords=jget(LEGACY_KEYS.records,[]);const legacyInst=jget(LEGACY_KEYS.instructors,[]);const legacyEq=jget(LEGACY_KEYS.equip,[]);const legacyAdmin=jget(LEGACY_KEYS.adminItems,[]);const legacyPrep=jget(LEGACY_KEYS.prepItems,[]);
  if(Array.isArray(legacyInst)) legacyInst.forEach(it=>{if(!it||!it.name)return;if(!state.instructors.some(x=>x.name===it.name&&x.org===(it.org||'')))state.instructors.push({id:uid('t'),org:it.org||'',name:it.name||'',phone:'',email:'',address:'',detailAddress:'',zip:'',memo:'',legacy:true})});
  if(Array.isArray(legacyEq)&&legacyEq.length){legacyEq.forEach(e=>{if(!e||!e.name)return;if(!state.equipment.some(x=>x.name===e.name))state.equipment.push({id:uid('eq'),name:e.name,category:'아트고',type:'지급용',oldPrice:e.price||0,normal:0,sample:0,bad:0,note:'기존 교구목록에서 변환'})})}
  ['grades','themes','periods','companies','programs'].forEach(k=>{const arr=jget(LEGACY_KEYS[k],[]);if(Array.isArray(arr)&&arr.length)state.masters[k]=[...new Set([...(state.masters[k]||[]),...arr])];});
  const legacyChkAll=[];if(Array.isArray(legacyAdmin))legacyChkAll.push(...legacyAdmin);if(Array.isArray(legacyPrep))legacyChkAll.push(...legacyPrep);if(legacyChkAll.length)state.checklist.items=[...new Set([...(state.checklist.items||[]),...legacyChkAll])];
  if(Array.isArray(legacyRecords)) legacyRecords.forEach(r=>{if(!r||state.schedules.some(s=>s.legacyId===r.id))return;const chk=[...new Set([...(Array.isArray(r.prep)?r.prep:[]),...(Array.isArray(r.admin)?r.admin:[])].filter(x=>typeof x==='string'))];state.schedules.push({id:uid('sch'),legacyId:r.id,legacy:true,status:'예정',date:r.date||'',region:r.region||'경북',org:r.org||'',company:r.company||'',program:r.program||'',period:r.period||'',startTime:r.startTime||'',endTime:r.endTime||'',grade:r.grade||'',roster:r.roster||'',orgInfo:{address:'',parking:'',manager:'',phone:'',waitingRoom:'',arrivalTime:'',entry:''},classes:(r.classes||[]).map((c,i)=>({label:c.label||`${i+1}반`,grade:c.grade||'',main:c.main||'',sub:c.sub||'',equip:c.equip||'',count:c.count??20,theme:c.theme||'',equipSend:c.equipSend||'',banner:!!c.banner,guide:!!c.guide,log:!!c.log})),checks:{prep:chk},noticeText:{first:'',final:'',after:''},notice:{first:'미발송',final:'미발송',after:'미발송'},guideStatus:'미발송',createdAt:r.savedAt||nowStamp(),updatedAt:nowStamp()})});
  const legacyItems=[];if(Array.isArray(legacyAdmin))legacyAdmin.forEach(x=>legacyItems.push({type:'사전 행정',text:x}));if(Array.isArray(legacyPrep))legacyPrep.forEach(x=>legacyItems.push({type:'출강 준비물',text:x}));state.checklist.legacy=legacyItems;
  const gas=ls(LEGACY_KEYS.gas); if(gas) state.settings.gasUrl=gas; const pin=ls(LEGACY_KEYS.pin); if(pin&&!state.settings.pin){state.settings.pin=pin;}
  state.migratedAt=nowStamp(); saveState(); localStorage.setItem(LEGACY_DONE_KEY,'1');}
function downloadJSON(obj,filename){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function downloadText(text,filename,type='text/plain'){const blob=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

function renderDashboard(){setTitle('대시보드',`<button class="btn btn-ghost" onclick="backupAll()">💾 전체 백업</button>`);const todayStr=today();const upcoming=state.schedules.filter(s=>s.date>=todayStr&&s.status!=='취소').sort((a,b)=>a.date.localeCompare(b.date)).slice(0,6);const unshipped=state.shipments.filter(s=>s.status==='미발송').length;const overReturns=overdueReturns();const neg=state.equipment.filter(e=>Number(e.normal||0)<0);const tasks=autoTasks();
$('app').innerHTML=`<div class="dash-grid"><div class="dash-card"><div class="label">다가오는 출강</div><div class="num">${upcoming.length}</div></div><div class="dash-card"><div class="label">미발송 교구</div><div class="num">${unshipped}</div></div><div class="dash-card"><div class="label">반납기한 초과</div><div class="num">${overReturns.length}</div></div><div class="dash-card"><div class="label">재고부족 교구</div><div class="num">${neg.length}</div></div></div>

function autoTasks(){let tasks=[...state.tasks];state.equipment.filter(e=>e.normal<0).forEach(e=>{const id='neg_'+e.id;if(!tasks.some(t=>t.id===id))tasks.push({id,type:'재고부족',text:`${e.name} ${Math.abs(e.normal)}개 추가 구매 필요`,done:false,auto:true})});overdueReturns().forEach(r=>{const id='ret_'+r.id;if(!tasks.some(t=>t.id===id))tasks.push({id,type:'반납기한 초과',text:`${r.teacher} / ${r.equip} 반납 확인 필요`,done:false,auto:true})});state.guideSends.filter(g=>g.status!=='발송완료').forEach(g=>{const id='guide_'+g.id;if(!tasks.some(t=>t.id===id))tasks.push({id,type:'교안 미발송',text:`${g.teacher} 교안 발송 확인`,done:false,auto:true})});state.tasks=tasks;return tasks.filter(t=>!t.done)}

function curMonth(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function calShift(delta){if(!calMonth)calMonth=curMonth();let [y,m]=calMonth.split('-').map(Number);m+=delta;if(m<1){m=12;y--}if(m>12){m=1;y++}calMonth=y+'-'+String(m).padStart(2,'0');calSelected=null;renderDashboard()}
function calToday(){calMonth=curMonth();calSelected=today();renderDashboard()}

function openScheduleFromCal(id){view='schedules';activeScheduleId=id;render()}
function gcalUrl(id){const s=state.schedules.find(x=>x.id===id);if(!s)return '#';const dt=(s.date||'').replace(/-/g,'');const title=encodeURIComponent(`[ENK출강] ${s.org||''} ${s.program||''}`.trim());const loc=encodeURIComponent((s.orgInfo&&s.orgInfo.address)||'');const det=encodeURIComponent(`프로그램: ${s.program||''}\n강사: ${s.roster||''}\n차시: ${s.period||''}`);const dates=dt?`&dates=${dt}/${dt}`:'';return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}${dates}&details=${det}&location=${loc}`}
function renderCalendar(){if(!calMonth)calMonth=curMonth();const [y,m]=calMonth.split('-').map(Number);const startDow=new Date(y,m-1,1).getDay();const days=new Date(y,m,0).getDate();const todayStr=today();const dow=['일','월','화','수','목','금','토'];const head=dow.map((n,i)=>`<div class="cal-dow${i===0?' sun':i===6?' sat':''}">${n}</div>`).join('');let cells=[];for(let i=0;i<startDow;i++)cells.push('<div class="cal-cell cal-empty"></div>');for(let d=1;d<=days;d++){const ds=y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');const evs=schedulesOn(ds);const chips=evs.map(s=>`<div class="cal-chip" style="background:${calStatusColor(s.status)}">${esc(s.org||'출강')}</div>`).join('');cells.push(`<div class="cal-cell${ds===todayStr?' cal-today':''}${ds===calSelected?' cal-sel':''}" onclick="calSelectDate('${ds}')"><div class="cal-d">${d}</div>${chips}</div>`)}const bar=`<div class="cal-bar"><button class="btn btn-ghost mini" onclick="calShift(-1)">‹ 이전</button><b>${y}년 ${m}월</b><button class="btn btn-ghost mini" onclick="calShift(1)">다음 ›</button><button class="btn btn-navy mini" onclick="calToday()">오늘</button><span class="muted">날짜를 클릭하면 그날 출강 상세가 아래에 표시됩니다.</span></div>`;let panel='';if(calSelected){const evs=schedulesOn(calSelected);panel=`<div class="cal-panel"><div class="grid-sub">${fmtDate(calSelected)} 출강 상세</div>${evs.length?evs.map(s=>calDetailCard(s)).join(''):'<div class="muted">이 날짜에 등록된 출강 일정이 없습니다.</div>'}</div>`}return bar+`<div class="cal-head">${head}</div><div class="cal-grid">${cells.join('')}</div>`+panel}
function calDetailCard(s){const cls=(s.classes||[]).map(c=>`${esc(c.label||'')}(${esc(c.grade||'')}) ${esc(c.main||'미정')}${c.equip?' · '+esc(c.equip):''}`).join('<br>')||'<span class="muted">반 미구성</span>';const time=[s.period,s.startTime&&s.endTime?`${s.startTime}~${s.endTime}`:''].filter(Boolean).join(' · ');const o=s.orgInfo||{};return `<div class="cal-detail"><div class="cal-detail-h"><b>${esc(s.org||'기관 미정')}</b> <span class="pill" style="background:${calStatusColor(s.status)};color:#fff;border:0">${esc(s.status)}</span></div><div class="muted">${esc(s.program||'')}${time?' · '+esc(time):''}${o.address?' · '+esc(o.address):''}${o.manager?' · 담당 '+esc(o.manager):''}</div><div style="margin:6px 0;font-size:13px">${cls}</div><div class="toolbar"><button class="btn btn-navy mini" onclick="openScheduleFromCal('${s.id}')">출강 상세 열기</button><button class="btn btn-ghost mini" onclick="window.open(gcalUrl('${s.id}'),'_blank')">구글 캘린더에 추가</button></div></div>`}

function renderScheduleForm(id){const s=state.schedules.find(x=>x.id===id);if(!s){activeScheduleId=null;return renderSchedules()}setTitle('출강관리 상세',`<button class="btn btn-ghost" onclick="activeScheduleId=null;render()">← 목록</button><button class="btn btn-navy" onclick="saveScheduleForm('${id}')">저장</button><button class="btn btn-gold" onclick="printSchedule('${id}')">인쇄/PDF</button><button class="btn btn-red" onclick="deleteSchedule('${id}')">삭제</button>`);const orgInfo=s.orgInfo||{};$('app').innerHTML=`<div class="print-head print-only"><b>[ENK LAB] ${esc(s.org||'')} 출강 체크리스트</b> · ${fmtDate(s.date)}</div><div class="card"><h3>기본 정보</h3><div class="grid g12"><div class="grid-sub">일정</div>${field('출강일',`<input type="date" id="sch_date" value="${esc(s.date)}">`,'c4')}${field('지역',selectHtml('sch_region',['경북','경남','대구','부산','울산'],s.region),'c4')}${field('상태',selectHtml('sch_status',['예정','준비중','출강완료','취소','연기'],s.status),'c4')}<div class="grid-sub">기관 · 과정</div>${field('기관명',`<input id="sch_org" list="orgList" value="${esc(s.org)}" onblur="loadOrgInfoToForm()">`,'c4')}${field('출강 업체',selectHtml('sch_company',state.masters.companies,s.company,'companies'),'c4')}${field('대상학년',selectHtml('sch_grade',state.masters.grades,s.grade,'grades'),'c4')}<div class="grid-sub">프로그램 · 시간</div>${field('프로그램명',selectHtml('sch_program',state.masters.programs,s.program,'programs'),'c4')}${field('시작시간',`<input type="time" id="sch_start" value="${esc(s.startTime)}">`,'c4')}${field('종료시간',`<input type="time" id="sch_end" value="${esc(s.endTime)}">`,'c4')}<div class="grid-sub">차시 · 강사</div>${field('차시',selectHtml('sch_period',state.masters.periods,s.period,'periods'),'c4')}${field('오늘의 투입 강사',`<input id="sch_roster" value="${esc(s.roster)}" list="teacherList" placeholder="이름을 콤마(,)로 구분">`,'c8')}</div></div>
<div class="card"><h3>기관 상세정보</h3><div class="grid g12"><div class="grid-sub">주소 · 담당자</div>${field('기관 주소',`<div class="addr-row"><input id="org_address" value="${esc(orgInfo.address||'')}" placeholder="주소/우편번호 수동 입력 가능">${mapBtn('org_address')}</div>`,'c6')}${field('담당자명',`<input id="org_manager" value="${esc(orgInfo.manager||'')}">`,'c3')}${field('담당자 연락처',`<input id="org_phone" value="${esc(orgInfo.phone||'')}">`,'c3')}<div class="grid-sub">현장 안내</div>${field('강사 대기실 위치',`<input id="org_waiting" value="${esc(orgInfo.waitingRoom||'')}">`,'c4')}${field('도착시간',`<input id="org_arrival" value="${esc(orgInfo.arrivalTime||'')}" placeholder="오전 OO:OO">`,'c4')}${field('출입 방법',`<input id="org_entry" value="${esc(orgInfo.entry||'')}">`,'c4')}${field('주차 안내',`<textarea id="org_parking">${esc(orgInfo.parking||'')}</textarea>`,'c12')}</div></div>
<div class="card"><h3>반 구성 · 강사 · 교구 배정</h3><div class="toolbar"><button class="btn btn-ghost mini" onclick="addClassRow('${id}')">＋ 반 추가</button></div><div id="classRows">${renderClassRows(s)}</div><p class="muted">※ 인원수는 학생 수입니다. 교구 발송수량과 재고 차감 기준은 교구물류에서 별도로 관리됩니다.</p></div>
<div class="card"><h3>출강 체크리스트</h3><div class="chk-grid">${state.checklist.items.map((item,ci)=>`<label class="chk-item"><input type="checkbox" ${s.checks?.prep?.includes(item)?'checked':''} onchange="toggleScheduleCheck('${id}',${ci},this.checked)"> ${esc(item)}</label>`).join('')}</div><div class="toolbar"><button class="btn btn-ghost mini" onclick="openChecklistEdit()">항목 관리</button></div></div>
<div class="card"><h3>카톡 공지 상태</h3>${noticeStatusBlock(s)}<div class="toolbar"><button class="btn btn-ghost" onclick="copyKakaoNotice('${id}','first')">💬 최초공지 복사</button><button class="btn btn-ghost" onclick="copyKakaoNotice('${id}','final')">📢 최종안내 복사</button><button class="btn btn-ghost" onclick="copyKakaoNotice('${id}','after')">✅ 출강후 안내 복사</button><button class="btn btn-navy" onclick="createShipmentFromSchedule('${id}')">📦 발송신청서 생성</button></div></div><div class="print-foot print-only">출력 일시: ${nowStamp()} · ENK LAB</div>`}
function field(label,inner,cls){return `<div class="field ${cls||''}"><label>${label}</label>${inner}</div>`}
function selectHtml(id,arr,selected,addKey){const add=!!addKey;return `<select id="${id}"${add?` onchange="liveAdd(this,'${addKey}')"`:''}>${arr.map(v=>`<option value="${esc(v)}" ${v===selected?'selected':''}>${esc(v)}</option>`).join('')}${selected&&!arr.includes(selected)?`<option value="${esc(selected)}" selected>${esc(selected)}</option>`:''}${add?'<option value="__add__">＋ 직접 입력…</option>':''}</select>`}
function liveAdd(sel,key){if(sel.value!=='__add__')return;const v=(prompt('추가할 값을 입력하세요')||'').trim();if(!v){sel.value='';return}if(key==='equipment'){if(!state.equipment.some(e=>e.name===v))state.equipment.push({id:uid('eq'),name:v,category:'기타',type:'지급용',oldPrice:0,normal:0,sample:0,bad:0,note:''})}else if(state.masters[key]&&!state.masters[key].includes(v))state.masters[key].push(v);saveState();const opt=document.createElement('option');opt.value=v;opt.textContent=v;const addOpt=sel.querySelector('option[value="__add__"]');sel.insertBefore(opt,addOpt);sel.value=v;toast('추가되었습니다')}
function renderClassRows(s){return (s.classes||[]).map((c,i)=>`<div class="class-row"><div class="class-row-head"><span class="badge">${esc(c.label||`${i+1}반`)}</span><button class="btn btn-ghost mini no-print" onclick="deleteClassRow('${s.id}',${i})">삭제</button></div><div class="grid g4">${field('반명',`<input id="cl_label_${i}" value="${esc(c.label||'')}">`)}${field('대상 학년',selectHtml(`cl_grade_${i}`,state.masters.grades,c.grade,'grades'))}${field('메인 강사',`<input id="cl_main_${i}" list="teacherList" value="${esc(c.main||'')}">`)}${field('보조 강사',`<input id="cl_sub_${i}" list="teacherList" value="${esc(c.sub||'')}">`)}${field('교구',selectHtml(`cl_equip_${i}`,state.equipment.map(e=>e.name),c.equip,'equipment'))}${field('주제',selectHtml(`cl_theme_${i}`,state.masters.themes,c.theme,'themes'))}${field('강사연구용 교구발송',selectHtml(`cl_send_${i}`,SEND_OPTIONS,c.equipSend||''))}${field('인원수',`<input type="number" id="cl_count_${i}" value="${esc(c.count??20)}">`)}</div><div class="checkline"><label><input type="checkbox" id="cl_banner_${i}" ${c.banner?'checked':''}> 반별 현수막</label><label><input type="checkbox" id="cl_guide_${i}" ${c.guide?'checked':''}> 교안 발송</label><label><input type="checkbox" id="cl_log_${i}" ${c.log?'checked':''}> 일일출강 교육일지</label></div></div>`).join('')||'<div class="muted">반을 추가해 주세요.</div>'}
function collectScheduleForm(id){const s=state.schedules.find(x=>x.id===id);s.date=$('sch_date').value;s.region=$('sch_region').value;s.org=$('sch_org').value.trim();s.status=$('sch_status').value;s.period=valueWithAdd('sch_period','periods');s.startTime=$('sch_start').value;s.endTime=$('sch_end').value;s.grade=valueWithAdd('sch_grade','grades');s.company=valueWithAdd('sch_company','companies');s.program=valueWithAdd('sch_program','programs');s.roster=$('sch_roster').value.trim();s.orgInfo={address:$('org_address').value.trim(),manager:$('org_manager').value.trim(),phone:$('org_phone').value.trim(),waitingRoom:$('org_waiting').value.trim(),arrivalTime:$('org_arrival').value.trim(),entry:$('org_entry').value.trim(),parking:$('org_parking').value.trim()};s.classes=(s.classes||[]).map((c,i)=>({label:$(`cl_label_${i}`)?.value||`${i+1}반`,grade:valueWithAdd(`cl_grade_${i}`,'grades'),main:$(`cl_main_${i}`).value.trim(),sub:$(`cl_sub_${i}`).value.trim(),count:Number($(`cl_count_${i}`).value||0),equip:valueWithAdd(`cl_equip_${i}`,'equipment'),theme:valueWithAdd(`cl_theme_${i}`,'themes'),equipSend:$(`cl_send_${i}`).value,banner:$(`cl_banner_${i}`).checked,guide:$(`cl_guide_${i}`).checked,log:($(`cl_log_${i}`)||{}).checked||false}));s.updatedAt=nowStamp();return s}
function valueWithAdd(id,key){const el=$(id);if(!el)return '';let v=el.value;if(v==='__add__'){v=prompt('추가할 값을 입력하세요')||'';if(v){if(key==='equipment'){if(!state.equipment.some(e=>e.name===v))state.equipment.push({id:uid('eq'),name:v,category:'기타',type:'지급용',oldPrice:0,normal:0,sample:0,bad:0,note:''})}else if(state.masters[key]&&!state.masters[key].includes(v))state.masters[key].push(v)} } return v}
function saveScheduleForm(id){const oldStatus=state.schedules.find(x=>x.id===id)?.status;const s=collectScheduleForm(id);saveInstitutionFromSchedule(s);if(oldStatus!==s.status){state.statusLog.unshift({id:uid('st'),at:nowStamp(),title:`${s.org} 출강상태 ${oldStatus} → ${s.status}`,memo:s.date});updateTeacherHistory(s,oldStatus)}autoCreateOrUpdateShipment(s);saveState();toast('출강일정이 저장되었습니다');render()}
function deleteSchedule(id){if(!confirm('이 출강일정을 삭제할까요? 연결된 발송신청서는 유지됩니다.'))return;state.schedules=state.schedules.filter(x=>x.id!==id);activeScheduleId=null;saveState();toast('삭제되었습니다');render()}
function saveInstitutionFromSchedule(s){if(!s.org)return;let o=orgByName(s.org);const daily={date:s.date,org:s.org,...s.orgInfo};if(!o){o={id:uid('org'),name:s.org,address:s.orgInfo.address||'',manager:s.orgInfo.manager||'',phone:s.orgInfo.phone||'',parking:s.orgInfo.parking||'',entry:s.orgInfo.entry||'',memo:'',daily:[]};state.orgs.push(o)}else{if(o.daily?.some(d=>d.date===s.date)){if(confirm('같은 날짜와 같은 기관의 기관정보가 있습니다. 기존 기관정보를 업데이트할까요?')){o.daily=o.daily.map(d=>d.date===s.date?daily:d)}}else{o.daily=o.daily||[];o.daily.push(daily)}['address','manager','phone','parking','entry'].forEach(k=>{if(s.orgInfo[k])o[k]=s.orgInfo[k]})}}
function loadOrgInfoToForm(){const name=$('sch_org').value.trim();const o=orgByName(name);if(!o)return; if(!$('org_address').value)$('org_address').value=o.address||''; if(!$('org_manager').value)$('org_manager').value=o.manager||''; if(!$('org_phone').value)$('org_phone').value=o.phone||''; if(!$('org_parking').value)$('org_parking').value=o.parking||''; if(!$('org_entry').value)$('org_entry').value=o.entry||'';}
function addClassRow(id){collectScheduleForm(id);const s=state.schedules.find(x=>x.id===id);s.classes.push({label:`${s.classes.length+1}반`,grade:s.grade||'',main:'',sub:'',equip:'',count:20,theme:'',equipSend:'',banner:false,guide:false,log:false});renderScheduleForm(id)}
function deleteClassRow(id,i){collectScheduleForm(id);const s=state.schedules.find(x=>x.id===id);s.classes.splice(i,1);renderScheduleForm(id)}
function toggleScheduleCheck(id,ci,checked){const s=state.schedules.find(x=>x.id===id);const item=state.checklist.items[ci];if(item===undefined)return;s.checks=s.checks||{prep:[]};s.checks.prep=s.checks.prep||[];if(checked&&!s.checks.prep.includes(item))s.checks.prep.push(item);if(!checked)s.checks.prep=s.checks.prep.filter(x=>x!==item);saveState()}
function openChecklistEdit(){openModal(`<h3>출강 체크리스트 항목 관리</h3><p class="muted">모든 출강일정에 공통으로 적용되는 체크리스트 항목입니다. 수정·삭제하거나 새 항목을 추가하세요.</p><div id="chkList">${checklistEditRows()}</div><div class="addr-row" style="margin-top:10px"><input id="chk_new" placeholder="새 체크 항목"><button class="btn btn-navy" onclick="addChecklistItem()">＋ 추가</button></div><div class="modal-actions"><button class="btn btn-navy" onclick="closeModal();if(activeScheduleId)renderScheduleForm(activeScheduleId)">완료</button></div>`)}
function checklistEditRows(){return state.checklist.items.map((t,i)=>`<div class="addr-row" style="margin-bottom:6px"><input value="${esc(t)}" onchange="editChecklistItem(${i},this.value)"><button class="btn btn-ghost mini" onclick="removeChecklistItem(${i})">✖</button></div>`).join('')||'<div class="muted">항목이 없습니다.</div>'}
function editChecklistItem(i,v){v=v.trim();if(!v){removeChecklistItem(i);return}state.checklist.items[i]=v;saveState()}
function removeChecklistItem(i){if(!confirm(`"${state.checklist.items[i]}" 항목을 삭제할까요?`))return;state.checklist.items.splice(i,1);saveState();$('chkList').innerHTML=checklistEditRows()}
function addChecklistItem(){const v=($('chk_new').value||'').trim();if(!v)return toast('항목을 입력하세요');if(state.checklist.items.includes(v))return toast('이미 있는 항목입니다');state.checklist.items.push(v);saveState();$('chk_new').value='';$('chkList').innerHTML=checklistEditRows();toast('추가되었습니다')}
function noticeStatusBlock(s){return ['first','final','after'].map(k=>`<span class="pill ${s.notice?.[k]==='발송완료'?'green':'yellow'}">${{first:'최초공지',final:'출강 전 최종안내',after:'출강 후 안내'}[k]} : ${s.notice?.[k]||'미발송'}</span>`).join(' ')}
function updateTeacherHistory(s,oldStatus){const names=[...new Set((s.classes||[]).flatMap(c=>[c.main,c.sub]).filter(Boolean))];names.forEach(name=>{if(s.status==='출강완료'&&oldStatus!=='출강완료'){state.teacherHistory.push({id:uid('hist'),teacher:name,date:s.date,org:s.org,program:s.program,scheduleId:s.id})}if(oldStatus==='출강완료'&&s.status!=='출강완료'){state.teacherHistory=state.teacherHistory.filter(h=>!(h.scheduleId===s.id&&h.teacher===name))}})}
function autoCreateOrUpdateShipment(s){if(!s.id||s.legacy)return;let ship=state.shipments.find(x=>x.scheduleId===s.id);if(!ship){ship=createShipmentObject(s);state.shipments.unshift(ship)}else if(['발송완료','배송완료','수령확인'].includes(ship.status)){if(confirm('이미 발송완료 이상 상태의 신청서입니다. 출강일정 수정 내용을 발송신청서에도 반영하시겠습니까?'))mergeShipmentWithSchedule(ship,s)}else mergeShipmentWithSchedule(ship,s)}
function createShipmentObject(s){return {id:uid('ship'),scheduleId:s.id,name:`${s.date}_${s.org}_교구발송`,date:s.date,org:s.org,program:s.program,status:'미발송',courier:'',invoice:'',shipDate:'',direct:{person:'',date:'',place:'',memo:''},stockApplied:false,mailNotice:'미발송',kakaoNotice:'미발송',items:shipmentItemsFromSchedule(s),createdAt:nowStamp(),updatedAt:nowStamp(),logs:[]}}
function shipmentItemsFromSchedule(s){return (s.classes||[]).filter(c=>c.main&&c.equip).map((c,i)=>{const teacher=instructorByName(c.main);return {id:uid('item'),classLabel:c.label||`${i+1}반`,teacher:c.main,equip:c.equip,shipQty:1,stockType:'normal',history:hasEquipHistory(c.main,c.equip),infoMissing:!teacher||!teacher.phone||!teacher.address||!teacher.zip,manual:false,reapproved:false,reapproveReason:''}})}
function mergeShipmentWithSchedule(ship,s){const manual=(ship.items||[]).filter(it=>it.manual);ship.date=s.date;ship.org=s.org;ship.program=s.program;const generated=shipmentItemsFromSchedule(s);ship.items=[...generated,...manual];ship.updatedAt=nowStamp()}
function hasEquipHistory(teacher,equip){return state.shipments.some(sh=>['발송완료','배송완료','수령확인'].includes(sh.status)&&sh.items?.some(it=>it.teacher===teacher&&it.equip===equip))}
function createShipmentFromSchedule(id){const s=state.schedules.find(x=>x.id===id);if(!s)return;let ship=state.shipments.find(x=>x.scheduleId===id);if(ship){mergeShipmentWithSchedule(ship,s);activeShipmentId=ship.id;view='logistics'}else{ship=createShipmentObject(s);state.shipments.unshift(ship);activeShipmentId=ship.id;view='logistics'}saveState();toast('교구발송 신청서가 생성되었습니다');render()}
function renderLogistics(){setTitle('교구물류',`<button class="btn btn-ghost" onclick="exportCSV('shipments')">엑셀/CSV</button>`);if(activeShipmentId)return renderShipmentDetail(activeShipmentId);const rows=state.shipments.map(sh=>[fmtDate(sh.date),esc(sh.org),esc(sh.name),statusPill(sh.status),guideNoticePill(sh),`<button class="btn btn-ghost mini" onclick="activeShipmentId='${sh.id}';render()">열기</button>`]);$('app').innerHTML=`<div class="card"><h3>📦 교구발송 신청서 목록</h3>${rows.length?table(['출강일','기관','신청서명','발송상태','안내상태','관리'],rows):'<div class="muted">교구발송 신청서가 없습니다.</div>'}</div>`}
function guideNoticePill(sh){return `<span class="pill ${(sh.mailNotice==='발송완료'||sh.kakaoNotice==='발송완료')?'green':'yellow'}">${(sh.mailNotice==='발송완료'||sh.kakaoNotice==='발송완료')?'발송 안내 완료':'발송 안내 미완료'}</span>`}
function renderShipmentDetail(id){const sh=state.shipments.find(x=>x.id===id);if(!sh){activeShipmentId=null;return renderLogistics()}setTitle('교구물류 상세',`<button class="btn btn-ghost" onclick="activeShipmentId=null;render()">← 목록</button><button class="btn btn-navy" onclick="saveShipmentForm('${id}')">저장</button><button class="btn btn-gold" onclick="printShipment('${id}')">A4/PDF</button>`);$('app').innerHTML=`<div class="print-head print-only"><b>[ENK LAB] 교구 발송 신청서</b> · ${esc(sh.org)} · ${fmtDate(sh.date)}</div><div class="card"><h3>발송 기본정보</h3><div class="grid g12"><div class="grid-sub">발송 정보</div>${field('신청서명',`<input id="ship_name" value="${esc(sh.name)}">`,'c6')}${field('기관명',`<input id="ship_org" value="${esc(sh.org)}">`,'c3')}${field('출강일',`<input type="date" id="ship_date" value="${esc(sh.date)}">`,'c3')}<div class="grid-sub">상태 · 배송</div>${field('상태',selectHtml('ship_status',SHIP_STATUS,sh.status),'c4')}${field('발송일',`<input type="date" id="ship_shipDate" value="${esc(sh.shipDate)}">`,'c4')}${field('택배사',selectHtml('ship_courier',state.masters.couriers,sh.courier,'couriers'),'c4')}${field('송장번호',`<input id="ship_invoice" value="${esc(sh.invoice)}">`,'c12')}</div><div id="directFields" class="grid g12" style="margin-top:12px"><div class="grid-sub">직접전달 / 현장전달 정보</div>${field('전달자',`<input id="dir_person" value="${esc(sh.direct?.person||'')}">`,'c4')}${field('전달일',`<input type="date" id="dir_date" value="${esc(sh.direct?.date||'')}">`,'c4')}${field('전달 장소',`<input id="dir_place" value="${esc(sh.direct?.place||'')}">`,'c4')}${field('비고',`<input id="dir_memo" value="${esc(sh.direct?.memo||'')}">`,'c12')}</div><p class="muted">직접전달/현장전달은 배송완료 단계를 건너뛰고 수령확인으로 변경할 수 있습니다.</p></div>
<div class="card"><h3>반별 상세표</h3>${shipmentItemsTable(sh)}<div class="toolbar"><button class="btn btn-ghost mini" onclick="addManualShipmentItem('${id}')">＋ 발송 대상 추가</button></div><p class="muted">※ 강사 연구용 교구는 <b>해당 교구 첫 수업 시 1회, 1개만</b> 지급됩니다. 이미 지급 이력이 있으면 자동으로 제외되며, 필요 시 재발송 승인으로만 추가됩니다.</p></div>
<div class="card"><h3>실제 발송 요약표</h3>${shipmentSummaryTable(sh)}</div>
<div class="card"><h3>발송 안내</h3><div class="toolbar"><button class="btn btn-ghost" onclick="prepareMailNotice('${id}')">네이버 메일 열기/본문 복사</button><button class="btn btn-ghost" onclick="prepareKakaoShipNotice('${id}')">카톡 안내 복사</button></div>${guideNoticePill(sh)} <span class="pill">메일 ${sh.mailNotice}</span> <span class="pill">카톡 ${sh.kakaoNotice}</span></div>
<div class="card"><h3>상태 변경 로그</h3>${(sh.logs||[]).map(l=>`<div class="list-item"><span>${esc(l.at)} / ${esc(l.text)}</span><span class="muted">${esc(l.memo||'')}</span></div>`).join('')||'<div class="muted">로그가 없습니다.</div>'}</div>`;toggleDirectFields()}
function shipmentItemsTable(sh){const rows=(sh.items||[]).map((it,i)=>[esc(it.classLabel),esc(it.teacher),esc(it.equip),'1',it.history&&!it.reapproved?'<span class="pill yellow">지급이력 있음</span>':(it.infoMissing?'<span class="pill red">강사정보 미완성</span>':'<span class="pill green">발송 필요</span>'),`${it.history&&!it.reapproved?`<button class="btn btn-blue mini" onclick="reapproveItem('${sh.id}',${i})">재발송 승인</button>`:''} <button class="btn btn-ghost mini" onclick="deleteShipItem('${sh.id}',${i})">삭제</button>`]);return table(['반','강사','교구','발송수량','확인','관리'],rows)}
function activeShipItems(sh){return (sh.items||[]).filter(it=>!(it.history&&!it.reapproved))}
function shipmentSummary(sh){const m={};activeShipItems(sh).forEach(it=>{const key=it.teacher+'|'+it.equip;if(!m[key])m[key]={teacher:it.teacher,equip:it.equip,qty:1,stockType:it.stockType||'normal'}});return Object.values(m)}
function shipmentSummaryTable(sh){const list=shipmentSummary(sh);return list.length?table(['강사','교구','실제 발송수량','현재재고'],list.map(x=>[esc(x.teacher),esc(x.equip),x.qty,getStock(x.equip,x.stockType)]),['l','l','r','r']):'<div class="muted">실제 발송 대상이 없습니다. (전원 지급이력 보유 또는 미배정)</div>'}
function deleteShipItem(id,i){const sh=state.shipments.find(x=>x.id===id);if(confirm('발송 대상에서 삭제할까요?')){sh.items.splice(i,1);renderShipmentDetail(id)}}
function addManualShipmentItem(id){const sh=state.shipments.find(x=>x.id===id);sh.items.push({id:uid('item'),classLabel:'수동추가',teacher:'',equip:'',shipQty:1,stockType:'normal',history:false,infoMissing:true,manual:true});renderShipmentDetail(id)}
function reapproveItem(id,i){const reason=prompt('재발송 사유를 입력하세요\n예: 분실 / 파손 / 추가 연구용 / 다른 차시 준비 / 기타')||'';const sh=state.shipments.find(x=>x.id===id);sh.items[i].reapproved=true;sh.items[i].reapproveReason=reason;sh.logs=sh.logs||[];sh.logs.unshift({at:nowStamp(),text:`${sh.items[i].teacher} / ${sh.items[i].equip} 재발송 승인`,memo:reason});saveState();renderShipmentDetail(id)}
function saveShipmentForm(id){const sh=state.shipments.find(x=>x.id===id);const old=sh.status;sh.name=$('ship_name').value;sh.date=$('ship_date').value;sh.org=$('ship_org').value;sh.courier=valueWithAdd('ship_courier','couriers');sh.invoice=$('ship_invoice').value;sh.shipDate=$('ship_shipDate').value;sh.direct={person:$('dir_person').value,date:$('dir_date').value,place:$('dir_place').value,memo:$('dir_memo').value};const next=$('ship_status').value;if(next==='발송완료'&&!sh.invoice&&!['직접전달','현장전달'].includes(sh.courier)&&!confirm('송장번호가 입력되지 않았습니다. 그래도 발송완료 처리할까요?'))return;if(next==='발송완료'&&!sh.stockApplied){const lacking=shipmentSummary(sh).filter(x=>getStock(x.equip,x.stockType)<x.qty);if(lacking.length&&!confirm('현재 재고보다 신청 수량이 많습니다. 그래도 발송완료 처리할까요?'))return;applyShipmentStock(sh,-1);sh.stockApplied=true}if(old==='발송완료'&&next==='미발송'&&sh.stockApplied){applyShipmentStock(sh,1);sh.stockApplied=false}if(old!==next){sh.logs=sh.logs||[];sh.logs.unshift({at:nowStamp(),text:`${old} → ${next}`,memo:sh.invoice?'송장번호 '+sh.invoice:''});state.statusLog.unshift({id:uid('st'),at:nowStamp(),title:`${sh.org} / ${sh.name} ${old} → ${next}`,memo:sh.invoice||''})}sh.status=next;sh.updatedAt=nowStamp();saveState();toast('발송신청서가 저장되었습니다');renderShipmentDetail(id)}
function applyShipmentStock(sh,dir){shipmentSummary(sh).forEach(x=>changeStock(x.equip,x.stockType,dir*x.qty,dir<0?'발송차감':'상태복구',{org:sh.org,teacher:x.teacher}))}
function toggleDirectFields(){const c=$('ship_courier');if(!c)return;const show=['직접전달','현장전달'].includes(c.value);$('directFields').style.display=show?'grid':'none';c.addEventListener('change',()=>{const s=['직접전달','현장전달'].includes(c.value);$('directFields').style.display=s?'grid':'none'})}
function courierLink(sh){const q=encodeURIComponent((sh.courier||'')+' '+(sh.invoice||''));return `https://search.naver.com/search.naver?query=${q}`}
function prepareMailNotice(id){const sh=state.shipments.find(x=>x.id===id);const body=shipNoticeText(sh);copyText(body);const subj=encodeURIComponent('[ENK LAB] 출강 교구 발송 안내');const mailBody=encodeURIComponent(body);window.open(`https://mail.naver.com/write/popup?subject=${subj}&body=${mailBody}`,'_blank');if(confirm('안내 문구가 준비되었습니다. 발송완료로 변경할까요?')){sh.mailNotice='발송완료';saveState();renderShipmentDetail(id)}}
function prepareKakaoShipNotice(id){const sh=state.shipments.find(x=>x.id===id);copyText(shipNoticeText(sh));if(confirm('안내 문구가 준비되었습니다. 발송완료로 변경할까요?')){sh.kakaoNotice='발송완료';saveState();renderShipmentDetail(id)}}
function shipNoticeText(sh){const items=shipmentSummary(sh).map(x=>`- ${x.equip} ${x.qty}개`).join('\n');return `안녕하세요. ENK LAB입니다.\n${fmtDate(sh.date)} ${sh.org} 출강 교구 발송 안내드립니다.\n\n택배사 : ${sh.courier||'추후 안내 예정'}\n송장번호 : ${sh.invoice||'추후 안내 예정'}\n배송조회 : ${sh.invoice?courierLink(sh):'추후 안내 예정'}\n\n교구목록\n${items}\n\n감사합니다.\nENK LAB`}
function renderEquipment(){setTitle('교구·재고관리',`<button class="btn btn-navy" onclick="addEquipmentModal()">＋ 교구 추가</button><button class="btn btn-ghost" onclick="exportCSV('equipment')">엑셀/CSV</button>`);const rows=state.equipment.map((e,i)=>[esc(e.name),esc(e.category),esc(e.type),(e.normal<0?'<span class="danger-text">'+e.normal+'</span>':e.normal),e.sample,e.bad,`<button class="btn btn-ghost mini" onclick="stockInModal('${e.id}')">입고</button> <button class="btn btn-ghost mini" onclick="editEquipmentModal('${e.id}')">수정</button>`]);$('app').innerHTML=`<div class="card"><h3>📚 교구·재고 현황</h3>${table(['교구','카테고리','유형','정상재고','샘플재고','불량재고','관리'],rows,['l','l','l','r','r','r','l'])}</div><div class="card"><h3>📥 입고 내역 (날짜별)</h3>${stockInHistory()}</div>`}
function addEquipmentModal(){openModal(`<h3>교구 추가</h3><div class="grid g2">${field('교구명','<input id="eq_name">')}${field('카테고리',selectHtml('eq_cat',['아트고','로봇','AI융합'],'아트고'))}${field('유형',selectHtml('eq_type',['지급용','회수용','샘플교구'],'지급용'))}</div><div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">취소</button><button class="btn btn-navy" onclick="saveNewEquipment()">저장</button></div>`)}
function saveNewEquipment(){const name=$('eq_name').value.trim();if(!name)return toast('교구명을 입력하세요');state.equipment.push({id:uid('eq'),name,category:$('eq_cat').value,type:$('eq_type').value,oldPrice:0,normal:0,sample:0,bad:0,note:''});closeModal();renderEquipment()}
function editEquipmentModal(id){const e=state.equipment.find(x=>x.id===id);openModal(`<h3>교구 수정</h3><div class="grid g2">${field('교구명',`<input id="eq_name" value="${esc(e.name)}">`)}${field('카테고리',selectHtml('eq_cat',['아트고','로봇','AI융합'],e.category))}${field('유형',selectHtml('eq_type',['지급용','회수용','샘플교구'],e.type))}${field('정상재고',`<input type="number" id="eq_normal" value="${e.normal}">`)}${field('샘플재고',`<input type="number" id="eq_sample" value="${e.sample}">`)}${field('불량재고',`<input type="number" id="eq_bad" value="${e.bad}">`)}</div><p class="muted">기존 정산용 단가는 내부 보존값입니다: ${e.oldPrice||0}원</p><div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">취소</button><button class="btn btn-navy" onclick="saveEquipmentEdit('${id}')">저장</button></div>`)}
function saveEquipmentEdit(id){const e=state.equipment.find(x=>x.id===id);e.name=$('eq_name').value.trim();e.category=$('eq_cat').value;e.type=$('eq_type').value;e.normal=Number($('eq_normal').value||0);e.sample=Number($('eq_sample').value||0);e.bad=Number($('eq_bad').value||0);closeModal();renderEquipment()}
function stockInModal(id){const e=state.equipment.find(x=>x.id===id);openModal(`<h3>📥 입고 처리 - ${esc(e.name)}</h3><p class="muted">택배로 정상재고와 샘플재고가 함께 들어오는 경우 두 수량을 한 번에 입력하세요. 입고일 기준으로 입고 내역에 기록됩니다.</p><div class="grid g12">${field('입고일',`<input type="date" id="stock_date" value="${today()}">`,'c4')}${field('정상재고 입고수량','<input type="number" id="stock_qty_n" min="0" value="0">','c4')}${field('샘플재고 입고수량','<input type="number" id="stock_qty_s" min="0" value="0">','c4')}${field('메모','<input id="stock_memo" value="택배 입고">','c12')}</div><div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">취소</button><button class="btn btn-navy" onclick="saveStockIn('${id}')">입고 처리</button></div>`)}
function saveStockIn(id){const e=state.equipment.find(x=>x.id===id);const date=$('stock_date').value||today();const qn=Number($('stock_qty_n').value||0);const qs=Number($('stock_qty_s').value||0);const memo=$('stock_memo').value;if(qn<=0&&qs<=0)return toast('정상 또는 샘플 수량을 1개 이상 입력하세요');if(qn>0)changeStock(e.name,'normal',qn,memo,{date,kind:'입고'});if(qs>0)changeStock(e.name,'sample',qs,memo,{date,kind:'입고'});saveState();closeModal();toast('입고 처리되었습니다');renderEquipment()}
function stockInHistory(){const logs=state.inventoryLog.filter(l=>l.kind==='입고');const byDate={};logs.forEach(l=>{const d=l.date||l.at.slice(0,10);(byDate[d]=byDate[d]||[]).push(l)});const dates=Object.keys(byDate).sort().reverse();if(!dates.length)return '<div class="muted">입고 내역이 없습니다. (입고 처리 시 날짜별로 기록됩니다)</div>';return dates.map(d=>{const rows=byDate[d].map(l=>[esc(l.equip),l.type==='sample'?'샘플':'정상','+'+l.delta,l.after,esc(l.memo||'')]);const tot=byDate[d].reduce((a,l)=>a+Number(l.delta||0),0);return `<div class="grid-sub">${fmtDate(d)} · ${byDate[d].length}건 · 총 +${tot}개</div>`+table(['교구','구분','입고수량','처리후 재고','메모'],rows,['l','c','r','r','l'])}).join('')}
function returnList(){const out=[];state.shipments.forEach(sh=>{shipmentSummary(sh).filter(x=>equipByName(x.equip)?.type==='회수용'||x.stockType==='sample').forEach(x=>{const rid=sh.id+'_'+x.teacher+'_'+x.equip;const st=state.returnStatus[rid]||{status:'반납예정',at:''};out.push({id:rid,teacher:x.teacher,equip:x.equip,org:sh.org,due:sh.date?nextWeekday(addDays(sh.date,7)):'',status:st.status,at:st.at})})});return out}
function overdueReturns(){const d=today();return returnList().filter(r=>r.due&&r.due<d&&r.status!=='반납완료')}
function setReturnStatus(rid,status){state.returnStatus[rid]={status,at:status==='반납완료'?nowStamp():''};state.tasks=state.tasks.filter(t=>t.id!=='ret_'+rid);saveState();renderReturns()}
function renderReturns(){setTitle('반납·불량관리');const rows=returnList().map(r=>[esc(r.teacher),esc(r.equip),esc(r.org),fmtDate(r.due),`<select onchange="setReturnStatus('${r.id}',this.value)">${RETURN_STATUS.map(s=>`<option value="${s}" ${s===r.status?'selected':''}>${s}</option>`).join('')}</select>`,r.at?`<span class="muted">${esc(r.at)}</span>`:'']);$('app').innerHTML=`<div class="card"><h3>🔁 반납관리</h3>${rows.length?table(['강사','교구','기관','반납기한','상태','완료시각'],rows,['l','l','l','c','l','l']):'<div class="muted">반납 대상이 없습니다. (회수용/샘플 교구 발송 시 표시됩니다)</div>'}</div><div class="card"><h3>🚫 불량재고 등록</h3><div class="grid g4">${field('교구',selectHtml('bad_equip',state.equipment.map(e=>e.name),''))}${field('수량','<input type="number" id="bad_qty" value="1">')}${field('사유',selectHtml('bad_reason',BAD_REASONS,'작동불량'))}${field('메모','<input id="bad_memo">')}</div><div class="toolbar"><button class="btn btn-red" onclick="moveBadStock()">불량재고로 이동</button><button class="btn btn-green" onclick="restoreBadStock()">정상재고로 복구</button></div></div>`}
function moveBadStock(){const eq=$('bad_equip').value,qty=Number($('bad_qty').value||0);if(!eq)return toast('교구를 선택하세요');changeStock(eq,'normal',-qty,'불량재고 이동: '+$('bad_reason').value);changeStock(eq,'bad',qty,$('bad_memo').value||'불량등록');renderReturns()}
function restoreBadStock(){const eq=$('bad_equip').value,qty=Number($('bad_qty').value||0);if(!eq)return toast('교구를 선택하세요');changeStock(eq,'bad',-qty,'정상재고 복구');changeStock(eq,'normal',qty,$('bad_memo').value||'정상재고 복구');renderReturns()}
function renderInstructors(){setTitle('강사관리',`<button class="btn btn-navy" onclick="editInstructorModal()">＋ 강사 추가</button><button class="btn btn-blue" onclick="openCardPaste()">📋 강사 카드 붙여넣기</button><button class="btn btn-ghost" onclick="exportCSV('instructors')">엑셀/CSV</button>`);const rows=state.instructors.map(t=>[esc(t.name),esc(t.org),t.phone?esc(t.phone):'<span class="danger-text">없음</span>',esc(t.email||''),`<b style="color:${instScore(t)<70?'var(--warn)':'var(--navy)'}">${instScore(t)}</b>`,instTotalDispatch(t.name)+'회',`<button class="btn btn-ghost mini" onclick="editInstructorModal('${t.id}')">수정</button> <button class="btn btn-ghost mini" onclick="openInstructorScore('${t.id}')">점수·이력</button>`]);$('app').innerHTML=`<div class="card"><h3>👩‍🏫 강사정보</h3>${table(['강사명','소속','연락처','메일','총점','출강(누적)','관리'],rows,['l','l','l','l','c','r','l'])}</div><div class="card"><h3>CSV 가져오기</h3><p class="muted">헤더 포함: 강사명,연락처,메일주소,주소,상세주소,우편번호,메모</p><input type="file" accept=".csv" onchange="importCSV(event,'instructors')"></div>`}
function editInstructorModal(id,pre){const blank={id:'',name:'',org:'',position:'강사',phone:'',homePhone:'',email:'',address:'',detailAddress:'',zip:'',resident:'',education:'',career:'',certs:'',wage:'',startDate:'',available:'',memo:'',scoreAdjustments:[]};const t=id?state.instructors.find(x=>x.id===id):Object.assign({...blank},pre||{});openModal(`<h3>${id?'강사 수정':'강사 추가'}</h3><div class="grid g12"><div class="grid-sub">기본</div>${field('강사명',`<input id="t_name" value="${esc(t.name)}">`,'c4')}${field('소속',`<input id="t_org" value="${esc(t.org)}">`,'c4')}${field('직위',`<input id="t_position" value="${esc(t.position||'강사')}">`,'c4')}<div class="grid-sub">연락처</div>${field('핸드폰',`<input id="t_phone" value="${esc(t.phone)}">`,'c4')}${field('집 전화',`<input id="t_homephone" value="${esc(t.homePhone||'')}">`,'c4')}${field('이메일',`<input id="t_email" value="${esc(t.email)}">`,'c4')}<div class="grid-sub">주소</div>${field('주소',`<div class="addr-row"><input id="t_address" value="${esc(t.address)}">${mapBtn('t_address')}</div>`,'c6')}${field('우편번호',`<input id="t_zip" value="${esc(t.zip)}">`,'c3')}${field('상세주소',`<input id="t_detail" value="${esc(t.detailAddress)}">`,'c3')}<div class="grid-sub">학력 · 경력 · 자격</div>${field('학력',`<input id="t_education" value="${esc(t.education||'')}">`,'c4')}${field('자격사항',`<input id="t_certs" value="${esc(t.certs||'')}">`,'c8')}${field('주요경력',`<textarea id="t_career">${esc(t.career||'')}</textarea>`,'c12')}<div class="grid-sub">근무 조건</div>${field('희망시급',`<input id="t_wage" value="${esc(t.wage||'')}">`,'c4')}${field('강의 가능 시작일',`<input id="t_startdate" value="${esc(t.startDate||'')}">`,'c4')}${field('출강가능여부',`<input id="t_available" value="${esc(t.available||'')}">`,'c4')}<div class="grid-sub">개인정보 · 메모</div>${field('주민등록번호',`<input id="t_resident" value="${esc(t.resident||'')}">`,'c6')}${field('메모',`<input id="t_memo" value="${esc(t.memo)}">`,'c6')}</div><p class="muted">※ 주민등록번호 등 민감정보는 이 브라우저(로컬)에만 저장되며 암호화되지 않습니다. 꼭 필요한 경우에만 입력하세요.</p><div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">취소</button><button class="btn btn-navy" onclick="saveInstructorModal('${id||''}')">저장</button></div>`)}
function saveInstructorModal(id){const g=x=>{const el=$(x);return el?el.value.trim():''};const obj={id:id||uid('t'),name:g('t_name'),org:g('t_org'),position:g('t_position')||'강사',phone:g('t_phone'),homePhone:g('t_homephone'),email:g('t_email'),address:g('t_address'),detailAddress:g('t_detail'),zip:g('t_zip'),resident:g('t_resident'),education:g('t_education'),certs:g('t_certs'),career:g('t_career'),wage:g('t_wage'),startDate:g('t_startdate'),available:g('t_available'),memo:g('t_memo')};if(!obj.name)return toast('강사명을 입력하세요');const idx=state.instructors.findIndex(x=>x.id===id);if(idx>=0){obj.scoreAdjustments=state.instructors[idx].scoreAdjustments||[];state.instructors[idx]=obj}else{const dup=state.instructors.findIndex(x=>x.name===obj.name);if(dup>=0){if(confirm(`이미 "${obj.name}" 강사가 있습니다.\n\n[확인] 기존 강사에 덮어쓰기(수정)\n[취소] 동명이인으로 새로 생성`)){obj.id=state.instructors[dup].id;obj.scoreAdjustments=state.instructors[dup].scoreAdjustments||[];state.instructors[dup]=obj}else{obj.scoreAdjustments=[];state.instructors.push(obj)}}else{obj.scoreAdjustments=[];state.instructors.push(obj)}}closeModal();renderInstructors()}
function instScore(t){return 100+((t.scoreAdjustments||[]).reduce((a,x)=>a+Number(x.delta||0),0))}
function instTotalDispatch(name){return state.teacherHistory.filter(h=>h.teacher===name).length}
function instYearCounts(name){const m={};state.teacherHistory.filter(h=>h.teacher===name).forEach(h=>{const y=(h.date||'').slice(0,4)||'미상';m[y]=(m[y]||0)+1});return m}
function addScoreAdj(id,delta,reason){const t=state.instructors.find(x=>x.id===id);if(!t)return;t.scoreAdjustments=t.scoreAdjustments||[];t.scoreAdjustments.unshift({at:nowStamp(),date:today(),delta:Number(delta),reason:reason||'',memo:''});saveState();openInstructorScore(id)}
function addScoreAdjPrompt(id){const v=prompt('점수 증감치를 입력하세요 (예: -3, +5)');if(v===null)return;const d=Number(v);if(isNaN(d)||d===0)return toast('0이 아닌 숫자를 입력하세요');const reason=prompt('사유/메모를 입력하세요')||'직접 입력';addScoreAdj(id,d,reason)}
function removeScoreAdj(id,i){const t=state.instructors.find(x=>x.id===id);if(!t)return;if(!confirm('이 점수 조정 항목을 삭제할까요?'))return;t.scoreAdjustments.splice(i,1);saveState();openInstructorScore(id)}
function openInstructorScore(id){const t=state.instructors.find(x=>x.id===id);if(!t)return;const sc=instScore(t);const yc=instYearCounts(t.name);const years=Object.keys(yc).sort().reverse();const adj=t.scoreAdjustments||[];openModal(`<h3>📊 ${esc(t.name)} · 점수 / 출강 이력</h3><div class="grid-sub">출강 점수 (기본 100점 · 누적 차감)</div><div style="font-size:22px;font-weight:900;color:${sc<70?'var(--warn)':'var(--navy)'};margin:2px 0 8px">현재 총점 ${sc}점</div><div class="toolbar"><button class="btn btn-ghost mini" onclick="addScoreAdj('${id}',-3,'지각')">-3 지각</button><button class="btn btn-ghost mini" onclick="addScoreAdj('${id}',-5,'출강 미준수')">-5 미준수</button><button class="btn btn-ghost mini" onclick="addScoreAdj('${id}',-10,'무단결근')">-10 무단결근</button><button class="btn btn-navy mini" onclick="addScoreAdjPrompt('${id}')">직접 입력</button></div>${adj.length?table(['일자','증감','사유','삭제'],adj.map((a,i)=>[esc(a.date||a.at||''),(a.delta>0?'+':'')+a.delta,esc(a.reason||''),`<button class="btn btn-ghost mini" onclick="removeScoreAdj('${id}',${i})">✖</button>`]),['l','c','l','c']):'<div class="muted">점수 조정 이력이 없습니다.</div>'}<div class="grid-sub" style="margin-top:12px">연도별 출강 (출강완료 기준) · 누적 ${instTotalDispatch(t.name)}회</div>${years.length?table(['연도','출강 횟수'],years.map(y=>[y,yc[y]+'회']),['l','r']):'<div class="muted">출강완료 이력이 없습니다. (출강 상태를 "출강완료"로 저장하면 집계됩니다)</div>'}<div class="modal-actions"><button class="btn btn-navy" onclick="closeModal()">닫기</button></div>`)}
function openCardPaste(){openModal(`<h3>📋 강사 카드 붙여넣기</h3><p class="muted">한글(HWP) 강사 카드의 표를 복사해 아래에 붙여넣고 "분석"을 누르세요. 성명·주소·연락처·이메일·학력·경력·자격사항·희망시급 등을 자동 인식해 입력창을 채웁니다. 인식 결과는 저장 전 확인·수정할 수 있습니다.</p><textarea id="cardText" style="min-height:280px" placeholder="여기에 강사 카드 내용을 붙여넣기 하세요"></textarea><div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">취소</button><button class="btn btn-navy" onclick="analyzeCard()">분석 → 입력창 채우기</button></div>`)}
function analyzeCard(){const raw=($('cardText')||{}).value||'';if(!raw.trim())return toast('내용을 붙여넣으세요');const t=parseInstructorCard(raw);closeModal();editInstructorModal('',t);toast('인식 결과를 확인하고 저장하세요')}
function parseInstructorCard(raw){const LAB=[[/^(성\s*명|이름)$/,'name'],[/^(주민등록번호|주민번호)$/,'resident'],[/^주\s*소$/,'address'],[/^집$/,'homePhone'],[/^(핸드폰|휴대폰|휴대전화|hp)$/i,'phone'],[/^직위$/,'position'],[/^(e-?mail|이메일|메일)$/i,'email'],[/^학력$/,'education'],[/^(주요\s*경력|경력)\s*\d*$/,'career'],[/^(자격\s*사항|자격증|자격)$/,'certs'],[/^(희망\s*시급|시급)$/,'wage'],[/^(강의\s*가능\s*시작일|시작일)$/,'startDate'],[/^(출강\s*가능\s*여부|출강\s*가능)$/,'available']];const SKIP=/^(사진|구분|주요\s*내용|비\s*고|연\s*락\s*처|강\s*사\s*카\s*드|enk\s*lab|ai\s*career\s*academy)$/i;const cells=raw.split(/[\t\n\r]+/).map(x=>x.trim()).filter(x=>x.length);const out={};let cur=null;const labelOf=c=>{for(const[re,f]of LAB){if(re.test(c))return f}return null};cells.forEach(c=>{const f=labelOf(c);if(f){cur=f;return}if(SKIP.test(c)){cur=null;return}if(cur){out[cur]=out[cur]?out[cur]+' '+c:c}});if(out.position&&/^강사$/.test(out.position)===false&&out.position.length>6)delete out.position;return out}
function renderOrgs(){setTitle('기관관리',`<button class="btn btn-navy" onclick="editOrgModal()">＋ 기관 추가</button><button class="btn btn-ghost" onclick="exportCSV('orgs')">엑셀/CSV</button>`);const rows=state.orgs.map(o=>[esc(o.name),esc(o.manager||''),esc(o.phone||''),esc(o.address||''),esc(o.parking||''),`<button class="btn btn-ghost mini" onclick="editOrgModal('${o.id}')">수정</button>`]);$('app').innerHTML=`<div class="card"><h3>🏫 기관정보</h3>${table(['기관명','담당자','연락처','주소','주차','관리'],rows)}</div><div class="card"><h3>CSV 가져오기</h3><p class="muted">기관명,담당자명,연락처,주소,메모</p><input type="file" accept=".csv" onchange="importCSV(event,'orgs')"></div>`}
function editOrgModal(id){const o=id?state.orgs.find(x=>x.id===id):{id:'',name:'',manager:'',phone:'',address:'',parking:'',entry:'',memo:''};openModal(`<h3>${id?'기관 수정':'기관 추가'}</h3><div class="grid g12"><div class="grid-sub">기관 · 담당자</div>${field('기관명',`<input id="o_name" value="${esc(o.name)}">`,'c4')}${field('담당자명',`<input id="o_manager" value="${esc(o.manager)}">`,'c4')}${field('연락처',`<input id="o_phone" value="${esc(o.phone)}">`,'c4')}<div class="grid-sub">주소 · 현장</div>${field('주소',`<div class="addr-row"><input id="o_address" value="${esc(o.address)}">${mapBtn('o_address')}</div>`,'c12')}${field('주차안내',`<textarea id="o_parking">${esc(o.parking)}</textarea>`,'c6')}${field('출입방법',`<textarea id="o_entry">${esc(o.entry)}</textarea>`,'c6')}</div><div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">취소</button><button class="btn btn-navy" onclick="saveOrgModal('${id||''}')">저장</button></div>`)}
function saveOrgModal(id){const obj={id:id||uid('org'),name:$('o_name').value.trim(),manager:$('o_manager').value.trim(),phone:$('o_phone').value.trim(),address:$('o_address').value.trim(),parking:$('o_parking').value.trim(),entry:$('o_entry').value.trim(),memo:''};if(!obj.name)return toast('기관명을 입력하세요');const idx=state.orgs.findIndex(x=>x.id===id);if(idx>=0)state.orgs[idx]={...state.orgs[idx],...obj};else state.orgs.push(obj);closeModal();renderOrgs()}
function renderGuides(){setTitle('교안 발송관리');syncGuideSends();const rows=state.guideSends.map(g=>[fmtDate(g.date),esc(g.org),esc(g.teacher),selectHtml(`g_status_${g.id}`,['미발송','발송완료'],g.status),selectHtml(`g_method_${g.id}`,['메일','카톡','문자','직접전달','기타'],g.method||''),`<button class="btn btn-navy mini" onclick="saveGuide('${g.id}')">저장</button>`]);$('app').innerHTML=`<div class="card"><h3>📨 강사별 교안 발송관리</h3>${rows.length?table(['출강일','기관','강사','상태','발송방법','관리'],rows):'<div class="muted">발송 대기 중인 교안이 없습니다. (반 구성에서 교안 발송 체크 시 표시되며, 발송완료 건은 아래 저장함으로 이동합니다)</div>'}</div>`+`<div class="card"><h3>🗂 교안발송 저장함 (기관별)</h3>${guideArchiveByOrg()}</div>`}
function syncGuideSends(){state.schedules.forEach(s=>{(s.classes||[]).forEach(c=>{if(c.guide&&c.main&&!state.guideSends.some(g=>g.scheduleId===s.id&&g.teacher===c.main)&&!state.guideArchive.some(g=>g.scheduleId===s.id&&g.teacher===c.main)){state.guideSends.push({id:uid('guide'),scheduleId:s.id,date:s.date,org:s.org,teacher:c.main,status:'미발송',method:'카톡',sentAt:'',memo:''})}})})}
function saveGuide(id){const g=state.guideSends.find(x=>x.id===id);if(!g)return;g.status=$(`g_status_${id}`).value;g.method=$(`g_method_${id}`).value;if(g.status==='발송완료'){if(!g.sentAt)g.sentAt=nowStamp();state.guideArchive.unshift(g);state.guideSends=state.guideSends.filter(x=>x.id!==id);saveState();toast('발송완료 → 저장함(기관별)으로 이동했습니다')}else{saveState();toast('교안 발송상태가 저장되었습니다')}renderGuides()}
function restoreGuide(id){const g=state.guideArchive.find(x=>x.id===id);if(!g)return;if(!confirm('이 건을 발송 목록으로 되돌릴까요?'))return;g.status='미발송';g.sentAt='';state.guideSends.unshift(g);state.guideArchive=state.guideArchive.filter(x=>x.id!==id);saveState();renderGuides()}
function guideArchiveByOrg(){const byOrg={};state.guideArchive.forEach(g=>{const o=g.org||'기관 미상';(byOrg[o]=byOrg[o]||[]).push(g)});const orgs=Object.keys(byOrg).sort();if(!orgs.length)return '<div class="muted">저장된 발송완료 내역이 없습니다.</div>';return orgs.map(o=>{const rows=byOrg[o].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(g=>[fmtDate(g.date),esc(g.teacher),'<span class="pill green">발송완료</span>',esc(g.method||''),esc(g.sentAt||''),`<button class="btn btn-ghost mini" onclick="restoreGuide('${g.id}')">↺ 되돌리기</button>`]);return `<div class="grid-sub">🏫 ${esc(o)} · ${byOrg[o].length}건</div>`+table(['출강일','강사','상태','발송방법','발송일시','관리'],rows)}).join('')}
function renderKakao(){setTitle('카톡 공지관리');const rows=state.schedules.map(s=>[fmtDate(s.date),esc(s.org),noticeStatusBlock(s),`<button class="btn btn-ghost mini" onclick="copyKakaoNotice('${s.id}','first')">최초</button> <button class="btn btn-ghost mini" onclick="copyKakaoNotice('${s.id}','final')">최종</button> <button class="btn btn-ghost mini" onclick="copyKakaoNotice('${s.id}','after')">출강후</button>`]);$('app').innerHTML=`<div class="card"><h3>💬 출강별 카톡공지</h3>${rows.length?table(['출강일','기관','공지상태','복사'],rows):'<div class="muted">출강일정이 없습니다.</div>'}</div><div class="card"><h3>템플릿 관리</h3><div class="grid g3">${field('강사 단톡방 최초공지',`<textarea id="tpl_first">${esc(state.settings.kakaoTemplates.first)}</textarea>`)}${field('출강 전 최종안내',`<textarea id="tpl_final">${esc(state.settings.kakaoTemplates.final)}</textarea>`)}${field('출강 후 안내',`<textarea id="tpl_after">${esc(state.settings.kakaoTemplates.after)}</textarea>`)}</div><div class="toolbar"><button class="btn btn-navy" onclick="saveTemplates()">템플릿 저장</button><button class="btn btn-ghost" onclick="restoreTemplates()">기본 템플릿으로 복원</button></div><p class="muted">사용 가능 변수: {출강일}, {기관명}, {프로그램명}, {수업시간}, {강사명단}, {반별배정}, {교구목록}, {대기실도착시간}, {대기실장소}, {기관주소}, {주차안내}, {담당자명}, {담당자연락처}, {출입방법}, {교육일지마감}, {강사료청구서마감}</p><p class="muted">※ 공지에는 학생 인원·강사 배정·교구명만 포함되며, 교구 단가·정산 금액 등 재무정보는 포함되지 않습니다.</p></div>`}
function saveTemplates(){state.settings.kakaoTemplates.first=$('tpl_first').value;state.settings.kakaoTemplates.final=$('tpl_final').value;state.settings.kakaoTemplates.after=$('tpl_after').value;saveState();toast('템플릿이 저장되었습니다')}

function copyKakaoNotice(id,type){openNoticePreview(id,type)}
function noticeTypeLabel(type){return {first:'강사 단톡방 최초공지',final:'출강 전 최종안내',after:'출강 후 안내'}[type]||type}
function noticeCurrentText(s,type){return (s.noticeText&&s.noticeText[type])?s.noticeText[type]:applyTemplate(state.settings.kakaoTemplates[type],s)}
function openNoticePreview(id,type){const s=state.schedules.find(x=>x.id===id);if(!s)return;const text=noticeCurrentText(s,type);const saved=!!(s.noticeText&&s.noticeText[type]);openModal(`<h3>💬 ${esc(noticeTypeLabel(type))} · 미리보기 / 수정</h3><p class="muted">${esc(s.org||'기관 미정')} · ${fmtDate(s.date)||'날짜 미정'} · 현재상태 ${s.notice?.[type]||'미발송'} · ${saved?'<b>저장된 수정본</b> 표시 중':'템플릿 자동 생성'}</p><textarea id="noticePreview" style="min-height:340px;font-size:13.5px">${esc(text)}</textarea><div class="toolbar"><button class="btn btn-ghost" onclick="resetNoticeToTemplate('${id}','${type}')">↺ 템플릿에서 새로 생성</button><button class="btn btn-navy" onclick="saveNoticeEdit('${id}','${type}')">💾 수정 저장</button></div><div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">닫기</button><button class="btn btn-blue" onclick="copyNoticeFromModal('${id}','${type}',false)">복사(저장)</button><button class="btn btn-green" onclick="copyNoticeFromModal('${id}','${type}',true)">복사 후 발송완료</button></div>`)}
function resetNoticeToTemplate(id,type){const s=state.schedules.find(x=>x.id===id);if($('noticePreview'))$('noticePreview').value=applyTemplate(state.settings.kakaoTemplates[type],s);toast('템플릿으로 새로 생성했습니다')}
function saveNoticeEdit(id,type){const s=state.schedules.find(x=>x.id===id);s.noticeText=s.noticeText||{first:'',final:'',after:''};s.noticeText[type]=$('noticePreview').value;saveState();toast('수정본이 저장되었습니다')}
function copyNoticeFromModal(id,type,markSent){const s=state.schedules.find(x=>x.id===id);const text=$('noticePreview').value;s.noticeText=s.noticeText||{first:'',final:'',after:''};s.noticeText[type]=text;copyText(text);if(markSent){s.notice=s.notice||{first:'미발송',final:'미발송',after:'미발송'};s.notice[type]='발송완료'}saveState();closeModal();render()}
function applyTemplate(t,s){const classes=(s.classes||[]).map(c=>`${c.label}(${c.grade||''}) - 메인 ${c.main||'미정'}${c.sub?` / 보조 ${c.sub}`:''}${c.equip?` / 교구 ${c.equip}`:''}`).join('\n')||'OOO';const equips=[...new Set((s.classes||[]).map(c=>c.equip).filter(Boolean))].join(', ')||'OOO';const time=[s.period,s.startTime&&s.endTime?`${s.startTime}~${s.endTime}`:''].filter(Boolean).join(' · ')||'OOO';const org=s.orgInfo||{};const journal=s.date?nextWeekday(addDays(s.date,3)):'';const fee=s.date?nextWeekday(monthEnd(s.date)):'';const vars={'{출강일}':fmtDate(s.date)||'O월 O일','{기관명}':s.org||'OOO','{프로그램명}':s.program||'OOO','{수업시간}':time,'{강사명단}':s.roster||'OOO','{반별배정}':classes,'{교구목록}':equips,'{대기실도착시간}':org.arrivalTime||'오전 OO:OO','{대기실장소}':org.waitingRoom||'OOOO / 강사 대기실','{기관주소}':org.address||'OOO','{주차안내}':org.parking||'OOO','{담당자명}':org.manager||'OOO','{담당자연락처}':org.phone||'OOO','{출입방법}':org.entry||'OOO','{교육일지마감}':fmtDate(journal),'{강사료청구서마감}':fmtDate(fee)};let out=t;Object.entries(vars).forEach(([k,v])=>out=out.split(k).join(v));return out}
function copyText(text){if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(text).then(()=>toast('복사되었습니다')).catch(()=>fallbackCopy(text));else fallbackCopy(text)}
function fallbackCopy(text){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('복사되었습니다')}catch(e){prompt('아래 내용을 복사하세요',text)}ta.remove()}
function renderHistory(){setTitle('이력·구글시트 전송',`<button class="btn btn-ghost" onclick="exportCSV('history')">이력 CSV</button>`);$('app').innerHTML=`<div class="card"><h3>강사 출강이력</h3>${table(['강사','출강일','기관','프로그램'],state.teacherHistory.map(h=>[esc(h.teacher),fmtDate(h.date),esc(h.org),esc(h.program)]))}</div><div class="card"><h3>재고변동 로그</h3>${table(['일시','교구','구분','수량','처리후','메모'],state.inventoryLog.slice(0,200).map(l=>[esc(l.at),esc(l.equip),esc(l.type),l.delta,l.after,esc(l.memo)]),['l','l','l','r','r','l'])}</div><div class="card"><h3>구글시트 탭별 전송</h3><div class="checkline">${['출강일정','교구발송','재고현황','강사정보','강사출강이력'].map(x=>`<label><input type="checkbox" class="gsTab" value="${x}" checked> ${x}</label>`).join('')}</div><div class="toolbar"><button class="btn btn-navy" onclick="sendSelectedToSheet()">선택 탭 전송</button><button class="btn btn-ghost" onclick="showAppsScript()">Apps Script 코드 보기</button></div><p class="muted">전송 시 날짜_시간_탭명 형식으로 새 시트가 생성됩니다.</p></div>`}
function sendSelectedToSheet(){const url=state.settings.gasUrl;if(!url)return alert('설정에서 Google Apps Script URL을 입력해 주세요.');const tabs=[...document.querySelectorAll('.gsTab:checked')].map(x=>x.value);const payload={pin:state.settings.gasPin||state.settings.pin,createdAt:nowStamp(),tabs:{}};tabs.forEach(t=>payload.tabs[t]=sheetData(t));fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}).then(()=>toast('구글시트 전송 요청이 완료되었습니다')).catch(e=>alert('전송 실패: '+e))}
function sheetData(tab){if(tab==='출강일정')return state.schedules;if(tab==='교구발송')return state.shipments;if(tab==='재고현황')return state.equipment;if(tab==='강사정보')return state.instructors;if(tab==='강사출강이력')return state.teacherHistory;return []}
function masterEditor(key,label){const items=state.masters[key]||[];return `<div class="field"><label>${esc(label)}</label><div class="mchips" id="mp_${key}">${items.map((v,i)=>`<span class="mchip">${esc(v)}<button onclick="removeMaster('${key}',${i})" title="삭제">✖</button></span>`).join('')||'<span class="muted">없음</span>'}</div><div class="addr-row"><input id="madd_${key}" placeholder="추가할 ${esc(label)}" onkeydown="if(event.key==='Enter')addMaster('${key}')"><button class="btn btn-navy mini" onclick="addMaster('${key}')">＋ 추가</button></div></div>`}
function addMaster(key){const el=$('madd_'+key);const v=(el?el.value:'').trim();if(!v)return toast('값을 입력하세요');state.masters[key]=state.masters[key]||[];if(state.masters[key].includes(v))return toast('이미 있는 항목입니다');state.masters[key].push(v);saveState();renderSettings();toast('추가되었습니다')}
function removeMaster(key,i){if(!confirm(`"${state.masters[key][i]}" 항목을 삭제할까요?`))return;state.masters[key].splice(i,1);saveState();renderSettings()}
function renderSettings(){setTitle('설정',`<button class="btn btn-ghost" onclick="backupAll()">전체 백업</button>`);$('app').innerHTML=`<div class="card"><h3>보안 · 연동 설정</h3><div class="grid g2">${field('관리자 PIN',`<input id="set_pin" value="${esc(state.settings.pin)}">`)}${field('Google Apps Script URL',`<input id="set_gas" value="${esc(state.settings.gasUrl)}">`)}${field('Google 전송 PIN',`<input id="set_gaspin" value="${esc(state.settings.gasPin)}">`)}</div><div class="toolbar"><button class="btn btn-navy" onclick="saveSettings()">설정 저장</button><button class="btn btn-ghost" onclick="showAppsScript()">Apps Script 코드 보기</button></div></div><div class="card"><h3>데이터 관리</h3><div class="toolbar"><button class="btn btn-ghost" onclick="backupAll()">전체 백업 다운로드</button><label class="btn btn-ghost">데이터 가져오기<input type="file" accept=".json" style="display:none" onchange="importBackup(event)"></label><button class="btn btn-ghost" onclick="backupLegacyDownload()">기존 데이터 백업 다운로드</button><button class="btn btn-gold" onclick="reMigrate()">기존 데이터 다시 변환</button><button class="btn btn-red" onclick="deleteLegacyKeys()">기존 키 삭제</button><button class="btn btn-red" onclick="resetAllData()">전체 초기화</button></div><p class="muted">※ "기존 데이터 다시 변환"은 재고 수량을 초기화하지 않고, 누락된 기존 항목만 안전하게 추가 병합합니다.</p></div><div class="card"><h3>목록 관리 (직접 추가·삭제)</h3><p class="muted">여기서 추가한 항목은 출강관리·물류 화면의 드롭다운에 바로 나타납니다. 드롭다운의 "＋ 직접 입력…"으로도 추가할 수 있습니다.</p><div class="grid g3">${masterEditor('grades','대상학년')}${masterEditor('themes','주제')}${masterEditor('periods','차시')}${masterEditor('companies','출강 업체')}${masterEditor('programs','프로그램명')}${masterEditor('couriers','택배사')}</div></div><div class="card"><h3>기존 체크리스트 보관함</h3>${state.checklist.legacy.length?table(['구분','항목'],state.checklist.legacy.map(x=>[esc(x.type),esc(x.text)])):'<div class="muted">보관된 기존 체크리스트가 없습니다. (활성 체크리스트에 병합됨)</div>'}</div>`}
function reMigrate(){if(!confirm('기존(구버전) 데이터를 다시 병합할까요?\n재고 수량은 유지되며, 누락된 강사·교구·학년·기록만 추가됩니다.'))return;migrateLegacy();toast('기존 데이터 병합 완료');render()}
function saveSettings(){state.settings.pin=$('set_pin').value.trim();state.settings.gasUrl=$('set_gas').value.trim();state.settings.gasPin=$('set_gaspin').value.trim();saveState();toast('설정이 저장되었습니다')}
function backupAll(){downloadJSON(state,'ENK_운영관리_백업_'+nowStamp().replace(/[-: ]/g,'')+'.json')}
function deleteLegacyKeys(){if(!confirm('기존(구버전) 데이터 키를 모두 삭제할까요?\n※ 되돌릴 수 없습니다. 먼저 전체/기존 백업을 권장합니다.'))return;Object.values(LEGACY_KEYS).forEach(k=>localStorage.removeItem(k));localStorage.removeItem(LEGACY_DONE_KEY);toast('기존 데이터 키를 삭제했습니다');render()}
function importBackup(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const obj=JSON.parse(r.result);if(confirm('현재 데이터를 가져온 백업으로 교체할까요?')){state=obj;ensureState();saveState();render()}}catch(err){alert('JSON 파일을 확인해 주세요.')}};r.readAsText(f)}
function resetAllData(){const text=prompt('전체 초기화를 실행하려면 "초기화"를 입력하세요.');if(text==='초기화'){state=defaultState();saveState();render();toast('초기화되었습니다')}}
function showAppsScript(){openModal(`<h3>Google Apps Script 코드</h3><p class="muted">아래 코드를 Apps Script에 붙여넣고 웹앱으로 배포한 뒤 URL을 설정에 입력하세요.</p><textarea style="min-height:360px" id="gasCode">${esc(APPS_SCRIPT_CODE)}</textarea><div class="modal-actions"><button class="btn btn-ghost" onclick="copyText(document.getElementById('gasCode').value)">코드 복사</button><button class="btn btn-navy" onclick="closeModal()">닫기</button></div>`)}
function exportCSV(type){const rows={schedules:state.schedules,shipments:state.shipments,equipment:state.equipment,instructors:state.instructors,orgs:state.orgs,history:state.teacherHistory}[type]||[];const text=jsonToCSV(rows);downloadText('\ufeff'+text,`ENK_${type}_${today()}.csv`,'text/csv;charset=utf-8')}
function jsonToCSV(rows){if(!rows.length)return '';const flat=rows.map(r=>flatten(r));const keys=[...new Set(flat.flatMap(o=>Object.keys(o)))];return keys.join(',')+'\n'+flat.map(o=>keys.map(k=>`"${String(o[k]??'').replace(/"/g,'""')}"`).join(',')).join('\n')}
function flatten(obj,prefix='',out={}){Object.entries(obj||{}).forEach(([k,v])=>{const key=prefix?prefix+'.'+k:k;if(v&&typeof v==='object'&&!Array.isArray(v))flatten(v,key,out);else out[key]=Array.isArray(v)?JSON.stringify(v):v});return out}
function parseCSVLine(line){const out=[];let cur='',q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(q){if(ch==='"'){if(line[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}else{if(ch==='"')q=true;else if(ch===',')  {out.push(cur);cur=''}else cur+=ch}}out.push(cur);return out.map(x=>x.trim())}
function importCSV(event,type){const f=event.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{let content=r.result;if(content.charCodeAt(0)===0xFEFF)content=content.slice(1);const lines=content.split(/\r?\n/).filter(l=>l.trim().length);if(!lines.length)return;const head=parseCSVLine(lines.shift());lines.forEach(line=>{const vals=parseCSVLine(line);const o={};head.forEach((h,i)=>o[h]=vals[i]||'');if(type==='instructors'){const obj={id:uid('t'),name:o['강사명']||'',phone:o['연락처']||'',email:o['메일주소']||'',address:o['주소']||'',detailAddress:o['상세주소']||'',zip:o['우편번호']||'',memo:o['메모']||'',org:o['소속']||''};if(obj.name)handleDuplicate(state.instructors,obj,'name')}if(type==='orgs'){const obj={id:uid('org'),name:o['기관명']||'',manager:o['담당자명']||'',phone:o['연락처']||'',address:o['주소']||'',memo:o['메모']||'',parking:'',entry:'',daily:[]};if(obj.name)handleDuplicate(state.orgs,obj,'name')}});saveState();render();toast('CSV 가져오기가 완료되었습니다')};r.readAsText(f,'utf-8')}
function handleDuplicate(arr,obj,key){const idx=arr.findIndex(x=>x[key]===obj[key]);if(idx<0)arr.push(obj);else{const sel=prompt(`${obj[key]} 중복 항목이 있습니다. 1=덮어쓰기, 2=건너뛰기, 3=새 항목 추가`,'2');if(sel==='1')arr[idx]={...arr[idx],...obj,id:arr[idx].id};if(sel==='3')arr.push(obj)}}
function doPrint(html){$('printArea').innerHTML=html;document.body.classList.add('printing');const done=()=>{document.body.classList.remove('printing');$('printArea').innerHTML=''};window.onafterprint=done;setTimeout(()=>{window.print();setTimeout(done,800)},60)}
function pkv(pairs){return `<table class="p-kv">${pairs.map(([k,v])=>`<tr><td class="k">${esc(k)}</td><td>${esc(v||'-')}</td></tr>`).join('')}</table>`}
function printSchedule(id){collectScheduleForm(id);const s=state.schedules.find(x=>x.id===id);if(!s)return;const o=s.orgInfo||{};const time=[s.period,s.startTime&&s.endTime?`${s.startTime}~${s.endTime}`:''].filter(Boolean).join(' · ');const clsRows=(s.classes||[]).map((c,i)=>`<tr><td>${esc(c.label||(i+1)+'반')}</td><td>${esc(c.grade)}</td><td>${esc(c.main)}</td><td>${esc(c.sub)}</td><td>${esc(c.equip)}</td><td>${esc(c.theme)}</td><td>${esc(c.equipSend)}</td><td>${c.banner?'○':''}</td><td>${c.guide?'○':''}</td><td>${c.log?'○':''}</td><td>${esc(c.count)}</td></tr>`).join('')||'<tr><td colspan="10">반 없음</td></tr>';const chk=state.checklist.items.map(it=>`<span>${(s.checks?.prep?.includes(it))?'☑':'☐'} ${esc(it)}</span>`).join('');const html=`<div class="p-doc"><div class="p-head"><div class="p-title">[ENK LAB] 출강 상세 체크리스트</div><div class="p-meta">${esc(s.org||'기관 미정')} · ${fmtDate(s.date)||'날짜 미정'} · ${esc(s.program||'')} · 상태 ${esc(s.status||'')}</div></div>
<div class="p-sec">기본 정보</div>${pkv([['지역',s.region],['차시',s.period],['수업시간',time],['대상학년',s.grade],['출강 업체',s.company],['투입 강사',s.roster]])}
<div class="p-sec">기관 상세</div>${pkv([['기관 주소',o.address],['담당자',`${o.manager||''} ${o.phone||''}`],['대기실',o.waitingRoom],['도착시간',o.arrivalTime],['출입 방법',o.entry],['주차 안내',o.parking]])}
<div class="p-sec">반 구성 · 강사 · 교구 배정</div><table class="p-tbl"><thead><tr><th>반</th><th>학년</th><th>메인</th><th>보조</th><th>교구</th><th>주제</th><th>연구용발송</th><th>현수막</th><th>교안</th><th>교육일지</th><th>인원</th></tr></thead><tbody>${clsRows}</tbody></table>
<div class="p-sec">출강 체크리스트</div><div class="p-chk">${chk}</div>
<div class="p-foot">출력: ${nowStamp()} · ENK LAB 운영관리 시스템</div></div>`;doPrint(html)}
function printShipment(id){collectShipmentBasic(id);const sh=state.shipments.find(x=>x.id===id);if(!sh)return;const itemRows=(sh.items||[]).map(it=>`<tr><td>${esc(it.classLabel)}</td><td>${esc(it.teacher)}</td><td>${esc(it.equip)}</td><td>1</td><td>${it.history&&!it.reapproved?'지급이력 있음':(it.infoMissing?'강사정보 미완성':'발송 필요')}</td></tr>`).join('')||'<tr><td colspan="5">항목 없음</td></tr>';const sum=shipmentSummary(sh);const sumRows=sum.length?sum.map(x=>`<tr><td>${esc(x.teacher)}</td><td>${esc(x.equip)}</td><td>${x.qty}</td><td>${getStock(x.equip,x.stockType)}</td></tr>`).join(''):'<tr><td colspan="4">실제 발송 대상 없음</td></tr>';const direct=['직접전달','현장전달'].includes(sh.courier);const basic=[['신청서명',sh.name],['택배사',sh.courier],['송장번호',sh.invoice],['발송일',fmtDate(sh.shipDate)]];if(direct)basic.push(['전달자/장소',`${sh.direct?.person||''} / ${sh.direct?.place||''}`],['전달일',fmtDate(sh.direct?.date||'')]);const html=`<div class="p-doc"><div class="p-head"><div class="p-title">[ENK LAB] 교구 발송 신청서</div><div class="p-meta">${esc(sh.org||'')} · ${fmtDate(sh.date)||'날짜 미정'} · 상태 ${esc(sh.status||'')}</div></div>
<div class="p-sec">발송 기본정보</div>${pkv(basic)}

const APPS_SCRIPT_CODE = `function doPost(e){\n  var payload = JSON.parse(e.postData.contents || '{}');\n  var ss = SpreadsheetApp.getActiveSpreadsheet();\n  var now = new Date();\n  var stamp = Utilities.formatDate(now, Session.getScriptTimeZone(), 'yyyy-MM-dd_HHmm');\n  Object.keys(payload.tabs || {}).forEach(function(tab){\n    var sheetName = stamp + '_' + tab;\n    var sheet = ss.insertSheet(sheetName);\n    var rows = payload.tabs[tab] || [];\n    if(!rows.length){ sheet.getRange(1,1).setValue('데이터 없음'); return; }\n    var flat = rows.map(flatten);\n    var keys = [];\n    flat.forEach(function(o){ Object.keys(o).forEach(function(k){ if(keys.indexOf(k)<0) keys.push(k); }); });\n    sheet.getRange(1,1,1,keys.length).setValues([keys]);\n    sheet.getRange(2,1,flat.length,keys.length).setValues(flat.map(function(o){ return keys.map(function(k){ return o[k] || ''; }); }));\n  });\n  return ContentService.createTextOutput(JSON.stringify({ok:true})).setMimeType(ContentService.MimeType.JSON);\n}\nfunction flatten(obj,prefix,out){\n  out = out || {}; prefix = prefix || '';\n  Object.keys(obj || {}).forEach(function(k){\n    var v = obj[k]; var key = prefix ? prefix + '.' + k : k;\n    if(v && typeof v === 'object' && !Array.isArray(v)){ flatten(v,key,out); }\n    else { out[key] = Array.isArray(v) ? JSON.stringify(v) : v; }\n  });\n  return out;\n}`;

function completeFirstSetup(){const p=$('first_pin').value.trim();if(!p)return toast('비밀번호를 입력하세요');state.settings.pin=p;saveState();closeModal();if(detectLegacy()&&!localStorage.getItem(LEGACY_DONE_KEY)){openModal(`<h3>기존 데이터가 발견되었습니다</h3><p class="muted">업데이트 전 자동 백업 후 새 시스템으로 변환합니다. 기존 localStorage 키는 삭제하지 않고 그대로 보존됩니다.</p><div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal();render()">나중에 하기</button><button class="btn btn-navy" onclick="backupLegacyDownload();migrateLegacy();closeModal();render()">백업 후 변환 시작</button></div>`)}else render()}
