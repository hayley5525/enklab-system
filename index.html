function schedTabs(){return `<div class="toolbar" style="margin-top:0"><button class="btn ${schedTab==='dispatch'?'btn-navy':'btn-ghost'}" onclick="schedTab='dispatch';activeEduId=null;render()">🚌 출강일정</button><button class="btn ${schedTab==='tt'?'btn-navy':'btn-ghost'}" onclick="schedTab='tt';activeEduId=null;activeScheduleId=null;render()">🗓 시간표 공지</button><button class="btn ${schedTab==='center'?'btn-navy':'btn-ghost'}" onclick="schedTab='center';activeEduId=null;activeScheduleId=null;render()">🏫 센터일정</button><button class="btn ${schedTab==='edu'?'btn-navy':'btn-ghost'}" onclick="schedTab='edu';activeScheduleId=null;render()">📚 교육일정</button></div>`}
function newEdu(){const e={id:uid('edu'),status:'예정',date:'',region:'경북',org:'',target:'',program:'',startTime:'',endTime:'',hourlyFee:0,subHourlyFee:0,sessionCount:1,orgInfo:{address:'',manager:'',phone:'',place:'',meal:'미제공',transport:'미제공',parking:'',memo:''},sessions:[{sid:uid('ss'),no:1,date:'',startTime:'',endTime:'',count:20,hours:0,main:'',subYn:'아니요',sub:'',equip:'',extra:'',content:'',done:false,dedSnap:null}],checks:{prep:[]},noticeText:{eduFirst:'',eduBefore:'',eduAfter:''},notice:{eduFirst:'미발송',eduBefore:'미발송',eduAfter:'미발송'},stockDeducted:false,stockSnapshot:[],createdAt:nowStamp(),updatedAt:nowStamp()};state.eduSchedules.unshift(e);activeEduId=e.id;saveState();render()}
function eduById(id){return state.eduSchedules.find(x=>x.id===id)}
function eduHoursOf(st,en){if(!st||!en)return 0;const [a,b]=st.split(':').map(Number),[c,d]=en.split(':').map(Number);const m=(c*60+d)-(a*60+b);if(m<=0)return 0;const h=Math.floor(m/60),r=m%60;return r>=40?h+1:h+r/60}
function eduSessTimes(e,s){const both=s.startTime&&s.endTime;return [both?s.startTime:e.startTime,both?s.endTime:e.endTime]}
function eduSessHours(e,s){if(Number(s.hours||0)>0)return Number(s.hours);const[st,en]=eduSessTimes(e,s);return eduHoursOf(st,en)}
function eduSessFee(e,s){return Math.round(Number(e.hourlyFee||0)*eduSessHours(e,s))}
function eduSubFee(e,s){return Math.round(Number(e.subHourlyFee||0)*eduSessHours(e,s))}
function eduPeriodStr(e){const ds=(e.sessions||[]).map(s=>s.date).filter(Boolean).sort();if(!ds.length)return fmtDate(e.date)||'-';return fmtDate(ds[0])+(ds.length>1?' ~ '+fmtDate(ds[ds.length-1]):'')}
function eduNextSession(e){const t=today();return (e.sessions||[]).filter(s=>s.date&&s.date>=t).sort((a,b)=>a.date.localeCompare(b.date))[0]||null}
function renderEduList(){setTitle('출강관리 · 교육일정',`<button class="btn btn-navy" onclick="newEdu()">＋ 교육일정 등록</button>`);const rows=state.eduSchedules.map(e=>[eduPeriodStr(e),esc(e.org||'-'),esc(e.program||'-'),esc([...new Set((e.sessions||[]).flatMap(x=>[x.main,x.subYn==='네'?x.sub:''].filter(Boolean)))].join(', ')||'-'),(e.sessions||[]).length+'회 · '+((e.sessions||[]).reduce((a,x)=>a+Number(x.count||0),0))+'명',`<span class="pill" style="background:${calStatusColor(e.status)};color:#fff;border:0">${esc(e.status)}</span>`,`<button class="btn btn-ghost mini" onclick="activeEduId='${e.id}';render()">상세</button> <button class="btn btn-ghost mini" onclick="deleteEdu('${e.id}')">삭제</button>`]);$('app').innerHTML=schedTabs()+`<div class="card"><h3>📚 교육일정 목록</h3>${rows.length?table(['기간','기관명','프로그램명','강사','회차·인원','상태','관리'],rows,['l','l','l','c','c','l']):'<div class="muted">등록된 교육일정이 없습니다. ＋ 교육일정 등록으로 시작하세요.</div>'}</div>`}
function deleteEdu(id){const e=eduById(id);if(!e)return;if(!confirm(`"${e.org||'교육일정'}" 을 삭제할까요?${e.stockDeducted?'\n※ 차감된 재고는 자동 복구됩니다.':''}`))return;if(e.stockDeducted)restoreEduStock(e);state.eduSchedules=state.eduSchedules.filter(x=>x.id!==id);if(activeEduId===id)activeEduId=null;saveState();render()}
function eduSessionCommonSync(e){e.sessions.forEach(s=>{if(!s.startTime)s.startTime=e.startTime;if(!s.endTime)s.endTime=e.endTime})}
function resizeEduSessions(e,n){n=Math.max(1,Math.floor(n||1));if(n>30&&!confirm(n+'회차는 30회를 초과합니다. 계속 생성할까요?'))return false;if(n<e.sessions.length){const cut=e.sessions.slice(n).some(s=>s.date||s.main||s.equip||s.content);if(cut&&!confirm('줄어드는 회차에 입력된 내용이 있습니다. 삭제할까요?'))return false;e.sessions=e.sessions.slice(0,n)}else{for(let i=e.sessions.length;i<n;i++)e.sessions.push({no:i+1,date:'',startTime:e.startTime,endTime:e.endTime,count:20,main:'',subYn:'아니요',sub:'',equip:'',extra:'',content:''})}e.sessions.forEach((s,i)=>s.no=i+1);e.sessionCount=n;return true}
function renderEduForm(id){const e=eduById(id);if(!e){activeEduId=null;return renderEduList()}setTitle('교육일정 상세',`<button class="btn btn-ghost" onclick="activeEduId=null;render()">← 목록</button><button class="btn btn-blue" onclick="saveEdu('${id}')">저장</button><button class="btn btn-gold" onclick="printEdu('${id}')">인쇄/PDF</button>`);const oi=e.orgInfo||{};const sessRows=e.sessions.map((s,i)=>{const fee=eduSessFee(e,s);const neg=(s.startTime||e.startTime)&&(s.endTime||e.endTime)&&eduHoursOf(s.startTime||e.startTime,s.endTime||e.endTime)===0;return `<div class="grid g12" style="margin-bottom:8px;border:1px solid var(--line);border-radius:10px;padding:10px 10px 4px"><div class="grid-sub" style="margin-top:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap">${s.no}회차 · 강사료(자동) <b style="color:var(--navy)">${won(fee)}</b>${s.subYn==='네'?` · 보조 <b>${won(eduSubFee(e,s))}</b>`:''}${neg?' <span class="danger-text">⚠ 종료시간이 시작보다 빠릅니다</span>':''}${!s.date?' <span class="danger-text">⚠ 날짜 미입력(자동완료 보류)</span>':''}<label style="display:flex;gap:5px;align-items:center;font-weight:800;color:${s.done?'var(--ok)':'var(--muted)'}"><input type="checkbox" ${s.done?'checked':''} onchange="toggleSessDone('${id}','${s.sid}',this.checked)"> 완료${s.done?'됨':''}</label><button class="btn btn-red mini no-print" onclick="eduDelSess('${id}','${s.sid}')" style="margin-left:auto">회차 삭제</button></div>${field('날짜',`<input type="date" id="es_date_${i}" value="${esc(s.date||'')}">`,'c3')}${field('시작',`<input type="time" id="es_st_${i}" value="${esc(s.startTime||e.startTime||'')}">`,'c2')}${field('종료',`<input type="time" id="es_en_${i}" value="${esc(s.endTime||e.endTime||'')}">`,'c2')}${field('인원수',`<input type="number" id="es_cnt_${i}" min="0" value="${s.count??20}">`,'c2')}${field('교육시간(h)',`<input type="number" step="0.5" id="es_hours_${i}" min="0" value="${s.hours||''}" placeholder="${eduSessHours(e,s)||''}">`,'c2')}${field('메인 강사',`<input id="es_main_${i}" value="${esc(s.main||'')}" list="teacherList">`,'c3')}${field('보조강사 여부',`<select id="es_subyn_${i}" onchange="collectEduForm('${id}');saveState();render()"><option${s.subYn!=='네'?' selected':''}>아니요</option><option${s.subYn==='네'?' selected':''}>네</option></select>`,'c2')}${s.subYn==='네'?field('보조강사 이름',`<input id="es_sub_${i}" value="${esc(s.sub||'')}" list="teacherList">`,'c3'):''}${field('사용교구(재고 연동)',selectHtml('es_equip_'+i,['교구사용없음'].concat(state.equipment.map(x=>x.name)),s.equip),'c4')}${field('추가교구·교재',selectHtml('es_extra_'+i,state.masters.extras,s.extra,'extras'),'c3')}${field('프로그램 내용 (300자 발췌 자동입력)',`<textarea id="es_ct_${i}" placeholder="직접 입력하거나, txt 업로드 / 붙여넣기로 발췌">${esc(s.content||'')}</textarea><div class="toolbar" style="margin:4px 0 6px"><input type="file" accept=".txt" style="max-width:220px" onchange="eduFileExtract(event,${i})"><button class="btn btn-ghost mini" onclick="eduPasteExtract(${i})">📋 붙여넣기로 발췌</button></div>`,'c12')}</div>`}).join('');$('app').innerHTML=schedTabs()+`<input type="hidden" id="edu_form_id" value="${id}"><div class="card"><h3>기본 정보</h3><div class="grid g12"><div class="grid-sub sub-g">📗 기본정보 · 일정</div>${field('교육출강일(=1회차)',`<input type="date" id="edu_date" value="${esc(e.date)}" onchange="if(document.getElementById('es_date_0'))document.getElementById('es_date_0').value=this.value">`,'c4')}${field('지역',selectHtml('edu_region',['경북','경남','대구','부산','울산'],e.region),'c4')}${field('상태',selectHtml('edu_status',['예정','준비중','출강완료','취소','연기'],e.status),'c4')}<div class="grid-sub sub-g">📗 기본정보 · 기관/과정</div>${field('기관명',`<input id="edu_org" value="${esc(e.org)}" list="orgList">`,'c4')}${field('대상',`<input id="edu_target" value="${esc(e.target||'')}" placeholder="예: 초5~6, 성인">`,'c4')}${field('프로그램명',selectHtml('edu_program',state.masters.programs,e.program,'programs'),'c4')}<div class="grid-sub sub-g">📗 기본정보 · 시간/강사료</div>${field('시작시간(공통)',`<input type="time" id="edu_start" value="${esc(e.startTime)}">`,'c2')}${field('종료시간(공통)',`<input type="time" id="edu_end" value="${esc(e.endTime)}">`,'c2')}${field('시간당 강사료(원)',`<input type="number" id="edu_hourly" min="0" value="${e.hourlyFee||0}">`,'c2')}${field('시간당 보조강사료(원)',`<input type="number" id="edu_subhourly" min="0" value="${e.subHourlyFee||0}">`,'c2')}${field('회차 관리',`<div class="toolbar" style="margin:0"><button class="btn btn-navy mini" onclick="eduAddSess('${id}')">＋ 회차 추가</button> <span style="font-weight:900;color:var(--navy);margin-left:8px">총 인원 ${(e.sessions||[]).reduce((a,x)=>a+Number(x.count||0),0)}명</span><button class="btn btn-ghost mini" onclick="eduCopySess('${id}')">⧉ 마지막 회차 복사</button><span class="muted">현재 ${e.sessions.length}회차</span></div>`,'c4')}</div></div><div class="card"><h3>기관 상세정보</h3><div class="grid g12"><div class="grid-sub sub-y">📒 기관 상세 · 주소/담당자</div>${field('주소',`<div class="addr-row"><input id="edu_addr" value="${esc(oi.address||'')}">${mapBtn('edu_addr')}</div>`,'c6')}${field('담당자명',`<input id="edu_mgr" value="${esc(oi.manager||'')}">`,'c3')}${field('담당자 연락처',`<input id="edu_phone" value="${esc(oi.phone||'')}">`,'c3')}<div class="grid-sub sub-y">📒 기관 상세 · 현장/제공</div>${field('교육장소',`<input id="edu_place" value="${esc(oi.place||'')}" placeholder="예: 3층 강의실">`,'c4')}${field('식사제공여부',selectHtml('edu_meal',['미제공','제공'],oi.meal||'미제공'),'c2')}${field('교통비제공여부',selectHtml('edu_transport',['미제공','제공'],oi.transport||'미제공'),'c2')}${field('주차 안내',`<input id="edu_parking" value="${esc(oi.parking||'')}">`,'c4')}${field('메모',`<textarea id="edu_memo">${esc(oi.memo||'')}</textarea>`,'c12')}</div></div><div class="card"><h3>프로그램 구성 (회차별)</h3>${sessRows}<div class="toolbar"><button class="btn btn-ghost mini" onclick="addEduSession('${id}')">＋ 회차 추가</button><button class="btn btn-ghost mini" onclick="copyEduSession('${id}')">⧉ 마지막 회차 복사(날짜만 비움)</button></div><p class="muted">사용교구는 상태를 <b>출강완료</b>로 저장할 때 회차 인원수만큼 재고에서 차감되고, 상태를 되돌리면 자동 복구됩니다.</p></div><div class="card"><h3>교육 체크리스트</h3><div class="chk-grid">${state.eduChecklist.items.map((item,ci)=>`<label class="chk-item"><input type="checkbox" ${e.checks?.prep?.includes(item)?'checked':''} onchange="toggleEduCheck('${id}','${escAttr(item)}',this.checked)"> ${esc(item)}</label>`).join('')}</div><div class="toolbar"><button class="btn btn-ghost mini" onclick="openEduChecklistEdit()">항목 관리</button></div></div><div class="card"><h3>💬 카톡 공지 (미리보기·수정·복사)</h3><div class="toolbar"><button class="btn btn-blue" onclick="openEduNotice('${id}','eduFirst')">최초공지 ${e.notice.eduFirst==='발송완료'?'✅':''}</button><button class="btn btn-blue" onclick="openEduNotice('${id}','eduBefore')">교육일정 전 안내 ${e.notice.eduBefore==='발송완료'?'✅':''}</button><button class="btn btn-blue" onclick="openEduNotice('${id}','eduAfter')">교육 끝난 후 안내 ${e.notice.eduAfter==='발송완료'?'✅':''}</button></div></div>`}
function eduAddSess(id){const e=eduById(id);if(!e)return;collectEduForm(id);e.sessions.push({sid:uid('ss'),no:e.sessions.length+1,date:'',startTime:'',endTime:'',count:20,hours:0,main:'',subYn:'아니요',sub:'',equip:'',extra:'',content:'',done:false,dedSnap:null});saveState();render()}
function eduCopySess(id){const e=eduById(id);if(!e)return;collectEduForm(id);const L=e.sessions[e.sessions.length-1]||{};e.sessions.push({sid:uid('ss'),no:e.sessions.length+1,date:'',startTime:L.startTime||'',endTime:L.endTime||'',count:L.count??20,hours:L.hours||0,main:L.main||'',subYn:L.subYn||'아니요',sub:L.sub||'',equip:L.equip||'',extra:L.extra||'',content:L.content||'',done:false,dedSnap:null});saveState();toast('마지막 회차를 복사했습니다 (날짜만 새로 입력)');render()}
function eduDelSess(id,sid){const e=eduById(id);if(!e)return;collectEduForm(id);const i=e.sessions.findIndex(x=>x.sid===sid);if(i<0)return;const sx=e.sessions[i];const hasFee=(state.fees||[]).some(f=>f.eduId===e.id&&(f.sessionSid?f.sessionSid===sid:f.sessionNo===sx.no));if(!confirm(`${sx.no}회차를 삭제할까요?${hasFee?'\n※ 이 회차에 등록된 강사료가 있습니다(정산 기록은 유지됩니다).':''}${sx.done&&sx.dedSnap?'\n※ 완료 차감된 재고는 복구됩니다.':''}`))return;if(sx.done)sessUndo(e,sx,false);e.sessions.splice(i,1);e.sessions.forEach((x,k)=>x.no=k+1);saveState();render()}
function sessComplete(e,s){if(s.done)return;s.done=true;if(s.equip&&Number(s.count||0)>0&&equipByName(s.equip)){changeStock(s.equip,'normal',-Number(s.count),`교육 사용(${e.org} ${s.no}회차)`,{kind:'교육차감'});s.dedSnap={equip:s.equip,qty:Number(s.count)}}}
function sessUndo(e,s,skip){if(!s.done)return;s.done=false;if(s.dedSnap&&equipByName(s.dedSnap.equip)){changeStock(s.dedSnap.equip,'normal',s.dedSnap.qty,`교육 차감 복구(${e.org} ${s.no}회차)`,{kind:'교육복구'})}s.dedSnap=null;if(skip!==false)s.autoSkip=true}
function copyEduSession(id){const e=eduById(id);if(!e)return;collectEduForm(id);const last=e.sessions[e.sessions.length-1]||{};const n={...JSON.parse(JSON.stringify(last)),sid:uid('ss'),no:e.sessions.length+1,date:'',done:false,dedSnap:null,autoSkip:false};e.sessions.push(n);saveState();render()}
function toggleSessDone(id,sid,on){const e=eduById(id);if(!e)return;collectEduForm(id);const s=e.sessions.find(x=>x.sid===sid);if(!s)return;if(on)sessComplete(e,s);else sessUndo(e,s,true);saveState();render()}
function upsertOrg(name,info){if(!name)return;info=info||{};let o=state.orgs.find(x=>x.name===name);if(!o){o={id:uid('org'),name,manager:'',phone:'',address:'',parking:'',entry:''};state.orgs.push(o)}['manager','phone','address','parking','entry'].forEach(k=>{if(!o[k]&&info[k])o[k]=info[k]})}
function autoCompleteSweep(){const t=today();let n=0,ded=0;state.autoLog=state.autoLog||[];state.schedules.forEach(s=>{if(s.date&&s.date<t&&(s.status==='예정'||s.status==='준비중')&&!s.autoSkip){const old=s.status;s.status='출강완료';s.autoDone=true;updateTeacherHistory(s,old);upsertOrg(s.org,s.orgInfo);n++;state.autoLog.unshift({at:nowStamp(),date:s.date,label:'출강 자동완료',detail:(s.org||'기관미정')})}});(state.eduSchedules||[]).forEach(e=>{if(e.status==='취소'||e.status==='연기'||e.autoSkip)return;let c=0;(e.sessions||[]).forEach(x=>{if(x.date&&x.date<t&&!x.done&&!x.autoSkip){sessComplete(e,x);c++;ded++;state.autoLog.unshift({at:nowStamp(),date:x.date,label:'교육 회차 자동완료(재고 차감)',detail:`${e.org||'기관미정'} ${x.no}회차`})}});if(c)n+=0;const all=(e.sessions||[]).length&&e.sessions.every(x=>x.date)&&e.sessions.every(x=>x.done);if(all&&e.status!=='출강완료'){e.status='출강완료';upsertOrg(e.org,e.orgInfo);state.autoLog.unshift({at:nowStamp(),date:t,label:'교육일정 자동완료',detail:(e.org||'기관미정')});n++}});state.autoLog=state.autoLog.slice(0,100);if(n||ded){saveState();toast(`지난 일정 자동 처리: ${n}건${ded?` · 회차 차감 ${ded}건`:''}`)}}
function clearAutoLog(){if(!confirm('자동 처리 목록을 지울까요?'))return;state.autoLog=[];saveState();renderDashboard()}
function applyEduCount(id){const e=eduById(id);if(!e)return;collectEduForm(id);const n=Number(($('edu_cnt')||{}).value||1);if(resizeEduSessions(e,n)){eduSessionCommonSync(e);saveState();render()}}
function addEduSession(id){const e=eduById(id);if(!e)return;collectEduForm(id);if(resizeEduSessions(e,e.sessions.length+1)){saveState();render()}}
function collectEduForm(id){const e=eduById(id);if(!e)return;const mk=$('edu_form_id');if(!mk||mk.value!==id)return;const g=x=>{const el=$(x);return el?el.value:''};e.date=g('edu_date');e.region=g('edu_region')||e.region;e.status=g('edu_status')||e.status;e.org=g('edu_org').trim();e.target=g('edu_target').trim();e.program=g('edu_program');e.startTime=g('edu_start');e.endTime=g('edu_end');e.hourlyFee=Number(g('edu_hourly')||0);e.subHourlyFee=Number(g('edu_subhourly')||0);e.orgInfo={address:g('edu_addr').trim(),manager:g('edu_mgr').trim(),phone:g('edu_phone').trim(),place:g('edu_place').trim(),meal:g('edu_meal')||'미제공',transport:g('edu_transport')||'미제공',parking:g('edu_parking').trim(),memo:g('edu_memo')};e.sessions.forEach((s,i)=>{if($('es_date_'+i)){s.date=g('es_date_'+i);s.startTime=g('es_st_'+i);s.endTime=g('es_en_'+i);s.count=Number(g('es_cnt_'+i)||0);s.hours=Number(g('es_hours_'+i)||0);s.main=g('es_main_'+i).trim();s.subYn=g('es_subyn_'+i)||'아니요';s.sub=s.subYn==='네'?g('es_sub_'+i).trim():'';s.equip=g('es_equip_'+i)||'';s.extra=g('es_extra_'+i)||'';s.content=g('es_ct_'+i)}});if(e.date&&e.sessions[0]&&!e.sessions[0].date)e.sessions[0].date=e.date;if(e.sessions[0]&&e.sessions[0].date)e.date=e.sessions[0].date;e.updatedAt=nowStamp()}
function saveEdu(id){const e=eduById(id);if(!e)return;const prev=e.status;collectEduForm(id);const now=e.status;if(prev!=='출강완료'&&now==='출강완료'&&!e.stockDeducted)deductEduStock(e);else if(prev==='출강완료'&&now!=='출강완료'){if(e.stockDeducted)restoreEduStock(e);e.sessions.forEach(x=>sessUndo(e,x,false));e.autoSkip=true}saveState();toast('교육일정이 저장되었습니다');render()}
function deductEduStock(e){const snap=[];e.sessions.forEach(s=>{if(s.equip&&Number(s.count||0)>0&&equipByName(s.equip)){changeStock(s.equip,'normal',-Number(s.count),`교육 사용(${e.org} ${s.no}회차)`,{kind:'교육차감'});snap.push({equip:s.equip,qty:Number(s.count)})}});e.stockDeducted=true;e.stockSnapshot=snap;if(snap.length)toast('교육 사용 교구가 재고에서 차감되었습니다')}

function openEduNotice(id,type){const e=eduById(id);if(!e)return;if($('edu_org'))collectEduForm(id);const labels={eduFirst:'최초공지',eduBefore:'교육일정 전 안내',eduAfter:'교육 끝난 후 안내'};const saved=!!(e.noticeText&&e.noticeText[type]);openModal(`<h3>💬 ${labels[type]} · 미리보기 / 수정</h3><p class="muted">${esc(e.org||'기관 미정')} · ${eduPeriodStr(e)} · 현재상태 ${e.notice[type]||'미발송'} · ${saved?'<b>저장된 수정본</b>':'템플릿 자동 생성'}</p><textarea id="eduNoticePv" style="min-height:320px;font-size:13.5px">${esc(eduNoticeText(e,type))}</textarea><div class="toolbar"><button class="btn btn-ghost" onclick="eduNoticeReset('${id}','${type}')">↺ 템플릿에서 새로 생성</button><button class="btn btn-navy" onclick="eduNoticeSave('${id}','${type}')">💾 수정 저장</button></div><div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">닫기</button><button class="btn btn-blue" onclick="eduNoticeCopy('${id}','${type}',false)">복사(저장)</button><button class="btn btn-green" onclick="eduNoticeCopy('${id}','${type}',true)">복사 후 발송완료</button></div>`)}

function escAttr(s){return String(s??'').replace(/'/g,'&#039;').replace(/"/g,'&quot;')}
function jget(k,def=null){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){return def}}

function today(){const d=new Date();return d.toISOString().slice(0,10)}
function fmtDate(d){if(!d)return '';return String(d).replaceAll('-','.')}
function addDays(dateStr,n){if(!dateStr)return '';const d=new Date(dateStr+'T00:00:00');if(isNaN(d.getTime()))return '';d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function nextWeekday(dateStr){if(!dateStr)return '';let d=new Date(dateStr+'T00:00:00');if(isNaN(d.getTime()))return '';while(d.getDay()==0||d.getDay()==6)d.setDate(d.getDate()+1);return d.toISOString().slice(0,10)}
function monthEnd(dateStr){if(!dateStr)return '';const d=new Date(dateStr+'T00:00:00');if(isNaN(d.getTime()))return '';return new Date(d.getFullYear(),d.getMonth()+1,0).toISOString().slice(0,10)}

function field(label,inner,cls){return `<div class="field ${cls||''}"><label>${label}</label>${inner}</div>`}
function selectHtml(id,arr,selected,addKey){const add=!!addKey;arr=[...arr].sort((a,b)=>String(a).localeCompare(String(b),'ko'));return `<select id="${id}"${add?` onchange="liveAdd(this,'${addKey}')"`:''}>${arr.map(v=>`<option value="${esc(v)}" ${v===selected?'selected':''}>${esc(v)}</option>`).join('')}${selected&&!arr.includes(selected)?`<option value="${esc(selected)}" selected>${esc(selected)}</option>`:''}${add?'<option value="__add__">＋ 직접 입력…</option>':''}</select>`}
function liveAdd(sel,key){if(sel.value!=='__add__')return;const v=(prompt('추가할 값을 입력하세요')||'').trim();if(!v){sel.value='';return}if(key==='equipment'){if(!state.equipment.some(e=>e.name===v))state.equipment.push({id:uid('eq'),name:v,category:'기타',type:'지급용',oldPrice:0,normal:0,sample:0,bad:0,note:''})}else if(state.masters[key]&&!state.masters[key].includes(v))state.masters[key].push(v);saveState();const opt=document.createElement('option');opt.value=v;opt.textContent=v;const addOpt=sel.querySelector('option[value="__add__"]');sel.insertBefore(opt,addOpt);sel.value=v;toast('추가되었습니다')}
function renderClassRows(s){return (s.classes||[]).map((c,i)=>`<div class="class-row"><div class="class-row-head"><span class="badge">${esc(c.label||`${i+1}반`)}</span><button class="btn btn-ghost mini no-print" onclick="deleteClassRow('${s.id}',${i})">삭제</button></div><div class="grid g4" style="border:2px solid #A9BBCC;border-radius:10px;padding:10px 10px 4px;margin-bottom:12px;background:#FBFDFF">${field('반명',`<input id="cl_label_${i}" value="${esc(c.label||'')}">`)}${field('대상 학년',selectHtml(`cl_grade_${i}`,state.masters.grades,c.grade,'grades'))}${field('메인 강사',`<input id="cl_main_${i}" list="teacherList" value="${esc(c.main||'')}">`)}${field('보조 강사',`<input id="cl_sub_${i}" list="teacherList" value="${esc(c.sub||'')}">`)}${field('교구',selectHtml(`cl_equip_${i}`,state.equipment.map(e=>e.name),c.equip,'equipment'))}${field('주제',selectHtml(`cl_theme_${i}`,state.masters.themes,c.theme,'themes'))}${field('강사연구용 교구발송',selectHtml(`cl_send_${i}`,SEND_OPTIONS,c.equipSend||''))}${field('인원수',`<input type="number" id="cl_count_${i}" oninput="updClsTotal()" value="${esc(c.count??20)}">`)}</div><div class="checkline"><label><input type="checkbox" id="cl_banner_${i}" ${c.banner?'checked':''}> 반별 현수막</label><label><input type="checkbox" id="cl_guide_${i}" ${c.guide?'checked':''}> 교안 발송</label><label><input type="checkbox" id="cl_log_${i}" ${c.log?'checked':''}> 일일출강 교육일지</label></div></div>`).join('')||'<div class="muted">반을 추가해 주세요.</div>'}
function collectScheduleForm(id){const s=state.schedules.find(x=>x.id===id);s.date=$('sch_date').value;s.region=$('sch_region').value;s.org=$('sch_org').value.trim();s.status=$('sch_status').value;s.period=valueWithAdd('sch_period','periods');s.startTime=$('sch_start').value;s.endTime=$('sch_end').value;s.grade=valueWithAdd('sch_grade','grades');s.company=valueWithAdd('sch_company','companies');s.program=valueWithAdd('sch_program','programs');s.roster=$('sch_roster').value.trim();s.baseFee=Number(($('sch_fee')||{}).value||0);s.orgInfo={address:$('org_address').value.trim(),manager:$('org_manager').value.trim(),phone:$('org_phone').value.trim(),waitingRoom:$('org_waiting').value.trim(),arrivalTime:$('org_arrival').value.trim(),entry:$('org_entry').value.trim(),parking:$('org_parking').value.trim()};s.classes=(s.classes||[]).map((c,i)=>({label:$(`cl_label_${i}`)?.value||`${i+1}반`,grade:valueWithAdd(`cl_grade_${i}`,'grades'),main:$(`cl_main_${i}`).value.trim(),sub:$(`cl_sub_${i}`).value.trim(),count:Number($(`cl_count_${i}`).value||0),equip:valueWithAdd(`cl_equip_${i}`,'equipment'),theme:valueWithAdd(`cl_theme_${i}`,'themes'),equipSend:$(`cl_send_${i}`).value,banner:$(`cl_banner_${i}`).checked,guide:$(`cl_guide_${i}`).checked,log:($(`cl_log_${i}`)||{}).checked||false}));s.updatedAt=nowStamp();return s}
function valueWithAdd(id,key){const el=$(id);if(!el)return '';let v=el.value;if(v==='__add__'){v=prompt('추가할 값을 입력하세요')||'';if(v){if(key==='equipment'){if(!state.equipment.some(e=>e.name===v))state.equipment.push({id:uid('eq'),name:v,category:'기타',type:'지급용',oldPrice:0,normal:0,sample:0,bad:0,note:''})}else if(state.masters[key]&&!state.masters[key].includes(v))state.masters[key].push(v)} } return v}
function saveScheduleForm(id){const _b4=state.schedules.find(x=>x.id===id);const oldStatus=_b4?.status;const oldDate=_b4?.date;const s=collectScheduleForm(id);if(s.date&&s.date!==oldDate){const dup=[...state.schedules.filter(x=>x.id!==id&&x.date===s.date&&x.status!=='취소').map(x=>'출강 · '+(x.org||'기관미정')),...(state.eduSchedules||[]).flatMap(e=>(e.sessions||[]).filter(x=>x.date===s.date).map(x=>'교육 · '+(e.org||'')+' '+x.no+'회차'))];if(dup.length&&!confirm(`⚠ ${fmtDate(s.date)}에 이미 일정이 있습니다:\n· ${dup.join('\n· ')}\n\n[확인] = 이대로 추가 등록\n[취소] = 저장 취소`))return}saveInstitutionFromSchedule(s);if(oldStatus!==s.status){state.statusLog.unshift({id:uid('st'),at:nowStamp(),title:`${s.org} 출강상태 ${oldStatus} → ${s.status}`,memo:s.date});updateTeacherHistory(s,oldStatus);if(oldStatus==='출강완료'&&s.autoDone){s.autoSkip=true;s.autoDone=false}}autoCreateOrUpdateShipment(s);saveState();toast('출강일정이 저장되었습니다');render()}
function deleteSchedule(id){if(!confirm('이 출강일정을 삭제할까요? 연결된 발송신청서는 유지됩니다.'))return;state.schedules=state.schedules.filter(x=>x.id!==id);activeScheduleId=null;saveState();toast('삭제되었습니다');render()}
function saveInstitutionFromSchedule(s){if(!s.org)return;let o=orgByName(s.org);const daily={date:s.date,org:s.org,...s.orgInfo};if(!o){o={id:uid('org'),name:s.org,address:s.orgInfo.address||'',manager:s.orgInfo.manager||'',phone:s.orgInfo.phone||'',parking:s.orgInfo.parking||'',entry:s.orgInfo.entry||'',memo:'',daily:[]};state.orgs.push(o)}else{if(o.daily?.some(d=>d.date===s.date)){if(confirm('같은 날짜와 같은 기관의 기관정보가 있습니다. 기존 기관정보를 업데이트할까요?')){o.daily=o.daily.map(d=>d.date===s.date?daily:d)}}else{o.daily=o.daily||[];o.daily.push(daily)}['address','manager','phone','parking','entry'].forEach(k=>{if(s.orgInfo[k])o[k]=s.orgInfo[k]})}}
function loadOrgInfoToForm(){const name=$('sch_org').value.trim();const o=orgByName(name);if(!o)return; if(!$('org_address').value)$('org_address').value=o.address||''; if(!$('org_manager').value)$('org_manager').value=o.manager||''; if(!$('org_phone').value)$('org_phone').value=o.phone||''; if(!$('org_parking').value)$('org_parking').value=o.parking||''; if(!$('org_entry').value)$('org_entry').value=o.entry||'';}
function addClassRow(id){collectScheduleForm(id);const s=state.schedules.find(x=>x.id===id);s.classes.push({label:`${s.classes.length+1}반`,grade:s.grade||'',main:'',sub:'',equip:'',count:20,theme:'',equipSend:'',banner:false,guide:false,log:false});renderScheduleForm(id)}
function deleteClassRow(id,i){collectScheduleForm(id);const s=state.schedules.find(x=>x.id===id);s.classes.splice(i,1);renderScheduleForm(id)}
function toggleScheduleCheck(id,ci,checked){const s=state.schedules.find(x=>x.id===id);const item=state.checklist.items[ci];if(item===undefined)return;s.checks=s.checks||{prep:[]};s.checks.prep=s.checks.prep||[];if(checked&&!s.checks.prep.includes(item))s.checks.prep.push(item);if(!checked)s.checks.prep=s.checks.prep.filter(x=>x!==item);saveState()}
function openChecklistEdit(){openModal(`<h3>출강 체크리스트 항목 관리</h3><p class="muted">모든 출강일정에 공통으로 적용되는 체크리스트 항목입니다. 수정·삭제하거나 새 항목을 추가하세요.</p><div id="chkList">${checklistEditRows()}</div><div class="addr-row" style="margin-top:10px"><input id="chk_new" placeholder="새 체크 항목"><button class="btn btn-navy" onclick="addChecklistItem()">＋ 추가</button></div><div class="modal-actions"><button class="btn btn-navy" onclick="closeModal();if(activeScheduleId)renderScheduleForm(activeScheduleId)">완료</button></div>`)}
function checklistEditRows(){return state.checklist.items.map((t,i)=>`<div class="addr-row" style="margin-bottom:6px"><input value="${esc(t)}" onchange="editChecklistItem(${i},this.value)"><button class="btn btn-ghost mini" onclick="removeChecklistItem(${i})">✖</button></div>`).join('')||'<div class="muted">항목이 없습니다.</div>'}
function editChecklistItem(i,v){v=v.trim();if(!v){removeChecklistItem(i);return}state.checklist.items[i]=v;saveState()}
function removeChecklistItem(i){if(!confirm(`"${state.checklist.items[i]}" 항목을 삭제할까요?`))return;state.checklist.items.splice(i,1);saveState();$('chkList').innerHTML=checklistEditRows()}
function addChecklistItem(){const v=($('chk_new').value||'').trim();if(!v)return toast('항목을 입력하세요');if(state.checklist.items.includes(v))return toast('이미 있는 항목입니다');state.checklist.items.push(v);saveState();$('chk_new').value='';$('chkList').innerHTML=checklistEditRows();toast('추가되었습니다')}
function resetAutoSkip(kind,id){if(kind==='sch'){const s=state.schedules.find(x=>x.id===id);if(s){s.autoSkip=false;toast('자동완료 대상으로 되돌렸습니다')}}else{const e=eduById(id);if(e){e.autoSkip=false;e.sessions.forEach(x=>x.autoSkip=false);toast('자동완료 대상으로 되돌렸습니다')}}saveState();render()}
function delInstructor(id){const t=state.instructors.find(x=>x.id===id);if(!t)return;const h=state.teacherHistory.filter(x=>x.teacher===t.name).length;const f=(state.fees||[]).filter(x=>x.teacher===t.name).length;if(!confirm(`"${t.name}" 강사를 삭제할까요?\n${h||f?`출강이력 ${h}건 · 강사료 ${f}건은 이름으로 보존됩니다.`:'연결된 기록이 없습니다.'}`))return;state.instructors=state.instructors.filter(x=>x.id!==id);saveState();toast('강사가 삭제되었습니다');renderInstructors()}
function noticeStatusBlock(s){return ['first','final','after'].map(k=>`<span class="pill ${s.notice?.[k]==='발송완료'?'green':'yellow'}" style="cursor:pointer" onclick="openNoticePreview('${s.id}','${k}')" title="클릭하면 미리보기·복사">${{first:'최초공지',final:'출강 전 최종안내',after:'출강 후 안내'}[k]} : ${s.notice?.[k]||'미발송'}</span>`).join(' ')}
function updateTeacherHistory(s,oldStatus){const names=[...new Set((s.classes||[]).flatMap(c=>[c.main,c.sub]).filter(Boolean))];names.forEach(name=>{if(s.status==='출강완료'&&oldStatus!=='출강완료'){state.teacherHistory.push({id:uid('hist'),teacher:name,date:s.date,org:s.org,program:s.program,scheduleId:s.id})}if(oldStatus==='출강완료'&&s.status!=='출강완료'){state.teacherHistory=state.teacherHistory.filter(h=>!(h.scheduleId===s.id&&h.teacher===name))}})}
function autoCreateOrUpdateShipment(s){if(!s.id||s.legacy)return;let ship=state.shipments.find(x=>x.scheduleId===s.id);if(!ship){ship=createShipmentObject(s);state.shipments.unshift(ship)}else if(['발송완료','배송완료','수령확인'].includes(ship.status)){if(confirm('이미 발송완료 이상 상태의 신청서입니다. 출강일정 수정 내용을 발송신청서에도 반영하시겠습니까?'))mergeShipmentWithSchedule(ship,s)}else mergeShipmentWithSchedule(ship,s)}
function createShipmentObject(s){return {id:uid('ship'),scheduleId:s.id,name:`${s.date}_${s.org}_교구발송`,date:s.date,org:s.org,program:s.program,status:'미발송',courier:'',invoice:'',shipDate:'',direct:{person:'',date:'',place:'',memo:''},stockApplied:false,mailNotice:'미발송',kakaoNotice:'미발송',items:shipmentItemsFromSchedule(s),createdAt:nowStamp(),updatedAt:nowStamp(),logs:[]}}
function shipmentItemsFromSchedule(s){return (s.classes||[]).filter(c=>c.main&&c.equip).map((c,i)=>{const teacher=instructorByName(c.main);return {id:uid('item'),classLabel:c.label||`${i+1}반`,teacher:c.main,equip:c.equip,shipQty:1,stockType:'normal',history:hasEquipHistory(c.main,c.equip),infoMissing:!teacher||!teacher.phone||!teacher.address||!teacher.zip,manual:false,reapproved:false,reapproveReason:''}})}
function mergeShipmentWithSchedule(ship,s){const manual=(ship.items||[]).filter(it=>it.manual);ship.date=s.date;ship.org=s.org;ship.program=s.program;const generated=shipmentItemsFromSchedule(s);ship.items=[...generated,...manual];ship.updatedAt=nowStamp()}
function hasEquipHistory(teacher,equip){return state.shipments.some(sh=>['발송완료','배송완료','수령확인'].includes(sh.status)&&sh.items?.some(it=>it.teacher===teacher&&it.equip===equip))}
function createShipmentFromSchedule(id){const s=state.schedules.find(x=>x.id===id);if(!s)return;let ship=state.shipments.find(x=>x.scheduleId===id);if(ship){mergeShipmentWithSchedule(ship,s);activeShipmentId=ship.id;view='logistics'}else{ship=createShipmentObject(s);state.shipments.unshift(ship);activeShipmentId=ship.id;view='logistics'}saveState();toast('교구발송 신청서가 생성되었습니다');render()}
function renderLogistics(){setTitle('교구물류',`<button class="btn btn-ghost" onclick="exportCSV('shipments')">엑셀/CSV</button>`);if(activeShipmentId)return renderShipmentDetail(activeShipmentId);const rows=state.shipments.map(sh=>[fmtDate(sh.date),esc(sh.org),esc(sh.name),statusPill(sh.status),guideNoticePill(sh),`<button class="btn btn-ghost mini" onclick="activeShipmentId='${sh.id}';render()">열기</button>`]);$('app').innerHTML=`<div class="card"><h3>📦 교구발송 신청서 목록</h3>${rows.length?table(['출강일','기관','신청서명','발송상태','안내상태','관리'],rows):'<div class="muted">교구발송 신청서가 없습니다.</div>'}</div>`}
function guideNoticePill(sh){if(sh.status==='발송불필요')return `<span class="pill">발송불필요</span>`;return `<span class="pill ${(sh.mailNotice==='발송완료'||sh.kakaoNotice==='발송완료')?'green':'yellow'}">${(sh.mailNotice==='발송완료'||sh.kakaoNotice==='발송완료')?'발송 안내 완료':'발송 안내 미완료'}</span>`}
function renderShipmentDetail(id){const sh=state.shipments.find(x=>x.id===id);if(!sh){activeShipmentId=null;return renderLogistics()}setTitle('교구물류 상세',`<button class="btn btn-ghost" onclick="activeShipmentId=null;render()">← 목록</button><button class="btn btn-navy" onclick="saveShipmentForm('${id}')">저장</button><button class="btn btn-gold" onclick="printShipment('${id}')">A4/PDF</button>`);$('app').innerHTML=`<div class="print-head print-only"><b>[ENK LAB] 교구 발송 신청서</b> · ${esc(sh.org)} · ${fmtDate(sh.date)}</div><div class="card"><h3>발송 기본정보</h3><div class="grid g12"><div class="grid-sub">발송 정보</div>${field('신청서명',`<input id="ship_name" value="${esc(sh.name)}">`,'c6')}${field('기관명',`<input id="ship_org" value="${esc(sh.org)}">`,'c3')}${field('출강일',`<input type="date" id="ship_date" value="${esc(sh.date)}">`,'c3')}<div class="grid-sub">상태 · 배송</div>${field('상태',selectHtml('ship_status',SHIP_STATUS,sh.status),'c4')}${field('발송일',`<input type="date" id="ship_shipDate" value="${esc(sh.shipDate)}">`,'c4')}${field('택배사',selectHtml('ship_courier',state.masters.couriers,sh.courier,'couriers'),'c4')}${field('송장번호',`<input id="ship_invoice" value="${esc(sh.invoice)}">`,'c12')}</div><div id="directFields" class="grid g12" style="margin-top:12px"><div class="grid-sub">직접전달 / 현장전달 정보</div>${field('전달자',`<input id="dir_person" value="${esc(sh.direct?.person||'')}">`,'c4')}${field('전달일',`<input type="date" id="dir_date" value="${esc(sh.direct?.date||'')}">`,'c4')}${field('전달 장소',`<input id="dir_place" value="${esc(sh.direct?.place||'')}">`,'c4')}${field('비고',`<input id="dir_memo" value="${esc(sh.direct?.memo||'')}">`,'c12')}</div><p class="muted">직접전달/현장전달은 배송완료 단계를 건너뛰고 수령확인으로 변경할 수 있습니다.</p></div>
<div class="card"><h3>반별 상세표</h3>${shipmentItemsTable(sh)}<div class="toolbar"><button class="btn btn-ghost mini" onclick="addManualShipmentItem('${id}')">＋ 발송 대상 추가</button></div><p class="muted">※ 강사 연구용 교구는 <b>해당 교구 첫 수업 시 1회, 1개만</b> 지급됩니다. 이미 지급 이력이 있으면 자동으로 제외되며, 필요 시 재발송 승인으로만 추가됩니다.</p></div>
<div class="card"><h3>실제 발송 요약표</h3>${shipmentSummaryTable(sh)}</div>
<div class="card"><h3>발송 안내</h3><div class="toolbar"><button class="btn btn-ghost" onclick="prepareMailNotice('${id}')">네이버 메일 열기/본문 복사</button><button class="btn btn-ghost" onclick="prepareKakaoShipNotice('${id}')">카톡 안내 복사</button></div>${guideNoticePill(sh)} <span class="pill">메일 ${sh.mailNotice}</span> <span class="pill">카톡 ${sh.kakaoNotice}</span></div>
<div class="card"><h3>상태 변경 로그</h3>${(sh.logs||[]).map(l=>`<div class="list-item"><span>${esc(l.at)} / ${esc(l.text)}</span><span class="muted">${esc(l.memo||'')}</span></div>`).join('')||'<div class="muted">로그가 없습니다.</div>'}</div>`;toggleDirectFields()}
function shipmentItemsTable(sh){const rows=(sh.items||[]).map((it,i)=>[esc(it.classLabel),esc(it.teacher),esc(it.equip),'1',it.history&&!it.reapproved?'<span class="pill yellow">지급이력 있음</span>':(it.infoMissing?'<span class="pill red">강사정보 미완성</span>':'<span class="pill green">발송 필요</span>'),`${it.history&&!it.reapproved?`<button class="btn btn-blue mini" onclick="reapproveItem('${sh.id}',${i})">재발송 승인</button>`:''} <button class="btn btn-ghost mini" onclick="deleteShipItem('${sh.id}',${i})">삭제</button>`]);return table(['반','강사','교구','발송수량','확인','관리'],rows)}
function activeShipItems(sh){return (sh.items||[]).filter(it=>!(it.history&&!it.reapproved))}
function shipmentSummary(sh){const m={};activeShipItems(sh).forEach(it=>{const key=it.teacher+'|'+it.equip;if(!m[key])m[key]={teacher:it.teacher,equip:it.equip,qty:1,stockType:it.stockType||'normal'}});return Object.values(m)}
function shipmentSummaryTable(sh){const list=shipmentSummary(sh);return list.length?table(['강사','교구','실제 발송수량','현재재고'],list.map(x=>[esc(x.teacher),esc(x.equip),x.qty,getStock(x.equip,x.stockType)]),['l','l','r','r']):'<div class="muted">실제 발송 대상이 없습니다. (전원 지급이력 보유 또는 미배정)</div>'}
function deleteShipItem(id,i){const sh=state.shipments.find(x=>x.id===id);if(confirm('발송 대상에서 삭제할까요?')){sh.items.splice(i,1);renderShipmentDetail(id)}}
function addManualShipmentItem(id){const sh=state.shipments.find(x=>x.id===id);sh.items.push({id:uid('item'),classLabel:'수동추가',teacher:'',equip:'',shipQty:1,stockType:'normal',history:false,infoMissing:true,manual:true});renderShipmentDetail(id)}
function reapproveItem(id,i){const reason=prompt('재발송 사유를 입력하세요\n예: 분실 / 파손 / 추가 연구용 / 다른 차시 준비 / 기타')||'';const sh=state.shipments.find(x=>x.id===id);sh.items[i].reapproved=true;sh.items[i].reapproveReason=reason;sh.logs=sh.logs||[];sh.logs.unshift({at:nowStamp(),text:`${sh.items[i].teacher} / ${sh.items[i].equip} 재발송 승인`,memo:reason});saveState();renderShipmentDetail(id)}
function saveShipmentForm(id){const sh=state.shipments.find(x=>x.id===id);const old=sh.status;sh.name=$('ship_name').value;sh.date=$('ship_date').value;sh.org=$('ship_org').value;sh.courier=valueWithAdd('ship_courier','couriers');sh.invoice=$('ship_invoice').value;sh.shipDate=$('ship_shipDate').value;sh.direct={person:$('dir_person').value,date:$('dir_date').value,place:$('dir_place').value,memo:$('dir_memo').value};const next=$('ship_status').value;if(next==='발송완료'&&!sh.invoice&&!['직접전달','현장전달'].includes(sh.courier)&&!confirm('송장번호가 입력되지 않았습니다. 그래도 발송완료 처리할까요?'))return;if(next==='발송완료'&&!sh.stockApplied){const lacking=shipmentSummary(sh).filter(x=>getStock(x.equip,x.stockType)<x.qty);if(lacking.length&&!confirm('현재 재고보다 신청 수량이 많습니다. 그래도 발송완료 처리할까요?'))return;applyShipmentStock(sh,-1);sh.stockApplied=true}if(old==='발송완료'&&next==='미발송'&&sh.stockApplied){applyShipmentStock(sh,1);sh.stockApplied=false}if(old!==next){sh.logs=sh.logs||[];sh.logs.unshift({at:nowStamp(),text:`${old} → ${next}`,memo:sh.invoice?'송장번호 '+sh.invoice:''});state.statusLog.unshift({id:uid('st'),at:nowStamp(),title:`${sh.org} / ${sh.name} ${old} → ${next}`,memo:sh.invoice||''})}sh.status=next;const _cnt=activeShipItems(sh).length;if(_cnt===0&&['미발송','발송불필요'].includes(sh.status)){if(sh.status!=='발송불필요'){sh.status='발송불필요';toast('발송 내역이 없어 상태가 \'발송불필요\'로 변경되었습니다')}}else if(sh.status==='발송불필요'&&_cnt>0){sh.status='미발송';toast('발송 내역이 생겨 상태가 \'미발송\'으로 변경되었습니다')}sh.updatedAt=nowStamp();saveState();renderShipmentDetail(id)}
function applyShipmentStock(sh,dir){shipmentSummary(sh).forEach(x=>changeStock(x.equip,x.stockType,dir*x.qty,dir<0?'발송차감':'상태복구',{org:sh.org,teacher:x.teacher}))}
function toggleDirectFields(){const c=$('ship_courier');if(!c)return;const show=['직접전달','현장전달'].includes(c.value);$('directFields').style.display=show?'grid':'none';c.addEventListener('change',()=>{const s=['직접전달','현장전달'].includes(c.value);$('directFields').style.display=s?'grid':'none'})}
function courierLink(sh){const q=encodeURIComponent((sh.courier||'')+' '+(sh.invoice||''));return `https://search.naver.com/search.naver?query=${q}`}
function prepareMailNotice(id){const sh=state.shipments.find(x=>x.id===id);const body=shipNoticeText(sh);copyText(body);const subj=encodeURIComponent('[ENK LAB] 출강 교구 발송 안내');const mailBody=encodeURIComponent(body);window.open(`https://mail.naver.com/write/popup?subject=${subj}&body=${mailBody}`,'_blank');if(confirm('안내 문구가 준비되었습니다. 발송완료로 변경할까요?')){sh.mailNotice='발송완료';saveState();renderShipmentDetail(id)}}
function prepareKakaoShipNotice(id){const sh=state.shipments.find(x=>x.id===id);copyText(shipNoticeText(sh));if(confirm('안내 문구가 준비되었습니다. 발송완료로 변경할까요?')){sh.kakaoNotice='발송완료';saveState();renderShipmentDetail(id)}}
function shipNoticeText(sh){const items=shipmentSummary(sh).map(x=>`- ${x.equip} ${x.qty}개`).join('\n');return `안녕하세요. ENK LAB입니다.\n${fmtDate(sh.date)} ${sh.org} 출강 교구 발송 안내드립니다.\n\n택배사 : ${sh.courier||'추후 안내 예정'}\n송장번호 : ${sh.invoice||'추후 안내 예정'}\n배송조회 : ${sh.invoice?courierLink(sh):'추후 안내 예정'}\n\n교구목록\n${items}\n\n감사합니다.\nENK LAB`}
function renderEquipment(){setTitle('교구·재고관리',`<button class="btn btn-navy" onclick="addEquipmentModal()">＋ 교구 추가</button><button class="btn btn-ghost" onclick="exportCSV('equipment')">엑셀/CSV</button>`);const rows=state.equipment.slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'ko')).map((e,i)=>[esc(e.name),esc(e.category),esc(e.type),won(finalCost(e.oldPrice)),(e.normal<0?'<span class="danger-text">'+e.normal+'</span>':e.normal),e.sample,e.bad,`<button class="btn btn-ghost mini" onclick="editEquipmentModal('${e.id}')">수정</button>`]);$('app').innerHTML=`<div class="card"><h3>📚 교구·재고 현황</h3><div class="toolbar"><button class="btn btn-blue" onclick="openBatchStockIn()">📥 일괄 입고 (한 날짜 · 여러 교구)</button></div>${table(['교구','카테고리','유형','원가(지사가)','정상재고','샘플재고','불량재고','관리'],rows,['l','l','l','r','r','r','r','l'])}</div><div class="card"><h3>📥 입고 내역 (날짜별)</h3>${stockInHistory()}</div>`}
function addEquipmentModal(){openModal(`<h3>교구 추가</h3><div class="grid g2">${field('교구명','<input id="eq_name">')}${field('카테고리',selectHtml('eq_cat',['아트고','로봇','AI융합'],'아트고'))}${field('유형',selectHtml('eq_type',['지급용','회수용','샘플교구'],'지급용'))}</div><div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">취소</button><button class="btn btn-navy" onclick="saveNewEquipment()">저장</button></div>`)}
function saveNewEquipment(){const name=$('eq_name').value.trim();if(!name)return toast('교구명을 입력하세요');state.equipment.push({id:uid('eq'),name,category:$('eq_cat').value,type:$('eq_type').value,oldPrice:0,normal:0,sample:0,bad:0,note:''});closeModal();renderEquipment()}
function editEquipmentModal(id){const e=state.equipment.find(x=>x.id===id);openModal(`<h3>교구 수정</h3><div class="grid g2">${field('교구명',`<input id="eq_name" value="${esc(e.name)}">`)}${field('카테고리',selectHtml('eq_cat',['아트고','로봇','AI융합'],e.category))}${field('유형',selectHtml('eq_type',['지급용','회수용','샘플교구'],e.type))}${field('정상재고',`<input type="number" id="eq_normal" value="${e.normal}">`)}${field('샘플재고',`<input type="number" id="eq_sample" value="${e.sample}">`)}${field('불량재고',`<input type="number" id="eq_bad" value="${e.bad}">`)}${field('지사가(원가)',`<input type="number" id="eq_price" min="0" value="${e.oldPrice||0}" oninput="document.getElementById('eq_final').textContent=won(finalCost(this.value))">`)}${field('정산 단가(지사가와 동일)',`<div style="padding:9px 10px;font-weight:900;color:var(--navy)" id="eq_final">${won(finalCost(e.oldPrice))}</div>`)}</div><p class="muted">정산은 지사가(원가) 기준으로 계산됩니다. 샘플재고는 무료입니다.</p><div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">취소</button><button class="btn btn-navy" onclick="saveEquipmentEdit('${id}')">저장</button></div>`)}
function saveEquipmentEdit(id){const e=state.equipment.find(x=>x.id===id);e.name=$('eq_name').value.trim();e.category=$('eq_cat').value;e.type=$('eq_type').value;e.normal=Number($('eq_normal').value||0);e.sample=Number($('eq_sample').value||0);e.bad=Number($('eq_bad').value||0);e.oldPrice=Number($('eq_price').value||0);closeModal();renderEquipment()}
function finalCost(p){return Number(p||0)}
function transportFee(km){km=Number(km||0);if(km<=100)return 0;return 15000*Math.ceil((km-100)/100)}
function won(n){return Number(n||0).toLocaleString('ko-KR')+'원'}
function feeNet(gross){return Math.floor(Number(gross||0)*0.967/10)*10}
function isTax10(name){const t=(state.instructors||[]).find(x=>x.name===name);return !!(t&&t.tax10)}
function feeNetF(f){const r=isTax10(f.teacher)?0.9:0.967;return Math.floor(Number(f.gross||0)*r/10)*10}
function feeTaxF(f){return Number(f.gross||0)-feeNetF(f)}
const FEE_CYCLE_START='2026-06';
function feeSplit(n){const cm=curMonth();const _d=new Date(cm+'-01T00:00:00');_d.setMonth(_d.getMonth()-1);const prevYm=_d.toISOString().slice(0,7);const fees=(state.fees||[]).filter(f=>f.teacher===n);const pays=(state.feePayments||[]).filter(p=>p.teacher===n);const g=fees.reduce((a,f)=>a+feeNetF(f),0);const p=pays.reduce((a,x)=>a+Number(x.amount||0),0);const fy={},py={};fees.forEach(f=>{const ym=(f.centerMonth||(f.date||'').slice(0,7));if(ym>=FEE_CYCLE_START)fy[ym]=(fy[ym]||0)+feeNetF(f)});pays.forEach(x=>{if(x.forMonth)py[x.forMonth]=(py[x.forMonth]||0)+Number(x.amount||0)});const due=ym=>Math.max((fy[ym]||0)-(py[ym]||0),0);const prevDue=prevYm>=FEE_CYCLE_START?due(prevYm):0;const curPend=due(cm);let late=0;Object.keys(fy).forEach(ym=>{if(ym>=FEE_CYCLE_START&&ym<prevYm)late+=due(ym)});return {g,p,prevDue,late,dueNow:prevDue+late,curPend}}
function albaNet(x){const a=Number(x.amount||0);if(x.kind!=='t')return a;const r=isTax10(x.name)?0.9:0.967;return Math.floor(a*r/10)*10}
function albaTax(x){return Number(x.amount||0)-albaNet(x)}
function feeTax(gross){return Number(gross||0)-feeNet(gross)}
function accountSelect(id,selected){const arr=state.masters.accounts||[];return `<select id="${id}" onchange="liveAdd(this,'accounts')"><option value=""${!selected?' selected':''}>통장 선택</option>${arr.map(v=>`<option value="${esc(v)}"${v===selected?' selected':''}>${esc(v)}</option>`).join('')}${selected&&!arr.includes(selected)?`<option value="${esc(selected)}" selected>${esc(selected)}</option>`:''}<option value="__add__">＋ 직접 입력…</option></select>`}
function csvQ(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
function stockInLogs(){return state.inventoryLog.filter(l=>l.kind==='입고')}
function eqInTotal(){return stockInLogs().reduce((a,l)=>a+Number(l.amount||0),0)}
function eqPayTotal(){return (state.eqPayments||[]).reduce((a,p)=>a+Number(p.amount||0),0)}
function renderEqSettle(){setTitle('교구 정산',`<button class="btn btn-blue" onclick="openBatchStockIn()">📥 일괄 입고</button><button class="btn btn-gold" onclick="openChargeModal()">📦 소모품(박스비) 청구</button><button class="btn btn-ghost" onclick="exportEqSettleCSV()">엑셀/CSV</button>`);const chg=(state.eqCharges||[]).reduce((a,x)=>a+Number(x.amount||0),0);const tin=eqInTotal()+chg,tpay=eqPayTotal(),bal=tin-tpay;$('app').innerHTML=`<div class="dash-grid"><div class="dash-card"><div class="label">총 입고금액 (원가+소모품 청구)</div><div class="num">${won(tin)}</div></div><div class="dash-card"><div class="label">총 입금액</div><div class="num">${won(tpay)}</div></div><div class="dash-card"><div class="label">미지급 잔액</div><div class="num" style="color:${bal>0?'var(--warn)':'var(--ok)'}">${won(bal)}</div></div><div class="dash-card"><div class="label">입고 건수</div><div class="num">${stockInLogs().length}</div></div></div><div class="card"><h3>💳 입금 내역 (교구협회 입금)</h3><div class="toolbar"><button class="btn btn-navy" onclick="openEqPayModal()">＋ 입금 등록</button></div>${eqPayTable()}</div><div class="card"><h3>📥 날짜별 입고 내역 (샘플 무료 · 정상재고만 정산 반영)</h3>${stockInHistory()}</div>`}
function eqPayTable(){const rows=(state.eqPayments||[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(p=>[fmtDate(p.date),won(p.amount),esc(p.account||''),esc(p.memo||''),`<button class="btn btn-ghost mini" onclick="delEqPay('${p.id}')">삭제</button>`]);return rows.length?table(['입금일','입금액','통장','메모','관리'],rows,['l','r','l','l','c']):'<div class="muted">입금 내역이 없습니다.</div>'}
function openEqPayModal(){openModal(`<h3>＋ 교구비 입금 등록</h3><div class="grid g12">${field('입금일',`<input type="date" id="ep_date" value="${today()}">`,'c4')}${field('입금액(원)','<input type="number" id="ep_amount" min="0" value="0">','c4')}${field('이체 통장',accountSelect('ep_acc',''),'c4')}${field('메모','<input id="ep_memo" placeholder="예: OO은행 사업자통장에서 이체">','c12')}</div><div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">취소</button><button class="btn btn-navy" onclick="saveEqPay()">입금 등록</button></div>`)}

).slice(0,7);const mcell=_ym&&_ym!==_pm?(_pm=_ym,_po='',`<b>${Number(_ym.slice(5,7))}월</b><div class="muted" style="font-size:10.5px">${_ym.slice(0,4)}</div>`):'';const _ok2=(f.date||'')+'|'+(f.org||'')+'|'+(f.centerMonth||f.eduId||'s');const _newOrg=_ok2!==_po;_po=_ok2;const brk=(f.base!=null)?`<div class="muted" style="font-size:11px;white-space:nowrap">기본 ${won(f.base)}${f.transport?` · 교통 ${won(f.transport)}(${f.km}km)`:''}${f.incentive?` · 인센 ${won(f.incentive)}`:''}${f.extraPay?` · 추가 ${won(f.extraPay)}`:''}</div>`:'';return [mcell,_newOrg?fmtDate(f.date):'',_newOrg?((f.centerMonth?'<span class="pill" style="background:#0E7490;color:#fff;border:0">센터</span> ':f.eduId?'<span class="pill" style="background:#7C3AED;color:#fff;border:0">교육'+(f.sessionNo?' '+f.sessionNo+'회차':'')+'</span> ':'')+esc(f.org)):'<span class="muted" style="font-size:11px">〃</span>',esc(f.teacher)+(isTax10(f.teacher)?'<div style="color:var(--warn);font-weight:900;font-size:11px">⚠ 10% 차감 대상 (소득신고 미대상)</div>':''),won(f.gross)+brk,won(feeTaxF(f)),`<b>${won(feeNetF(f))}</b>`,`<input type="checkbox" ${f.journal?'checked':''} onchange="toggleFeeDoc('${f.id}','journal',this.checked)">`,`<input type="checkbox" ${f.invoice?'checked':''} onchange="toggleFeeDoc('${f.id}','invoice',this.checked)">`,ok?'<span class="pill green">지급가능</span>':'<span class="pill yellow">서류대기</span>',`<button class="btn btn-ghost mini" onclick="openFeeEditModal('${f.id}')">수정</button> <button class="btn btn-ghost mini" onclick="delFee('${f.id}')">삭제</button>`]});const pRows=(state.feePayments||[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(p=>[fmtDate(p.date),esc(p.teacher),won(p.amount),esc(p.account||''),esc(p.memo||''),`<button class="btn btn-ghost mini" onclick="delFeePay('${p.id}')">삭제</button>`]);const _agg=teachers.reduce((a,n)=>{const sp=feeSplit(n);a.due+=sp.dueNow;a.cur+=sp.curPend;return a},{due:0,cur:0});$('app').innerHTML=feeTabs()+`<div class="dash-grid" style="grid-template-columns:repe const s=state.schedules.find(x=>x.id===sid);const names=feeTeachersOf(s);if(!names.length){box.innerHTML='<div class="muted">이 출강에 배정된 강사가 없습니다. 반 구성에서 강사를 먼저 입력하세요.</div>';return}const base=Number(s.baseFee||0),km0=0;box.innerHTML=`<div class="grid-sub">기본 강사료 자동 로드 · 왕복km는 강사가 제출한 거리 캡처 확인 후 강사별 입력 (미제출·미지급은 0)</div>`+names.map((n,i)=>`<div class="grid g12 feerow" style="margin-bottom:8px"><div class="field c2"><label>강사</label><input value="${esc(n)}" id="fee_t_${i}" readonly></div><div class="field c2"><label>기본 강사료</label><input type="number" id="fee_a_${i}" min="0" value="${base}" oninput="feeRowCalc(${i})"></div><div class="field c2"><label>왕복km</label><input type="number" id="fee_km_${i}" min="0" value="0" oninput="feeRowCalc(${i})"></div><div class="field c2"><label>인센티브</label><input type="number" id="fee_inc_${i}" min="0" value="0" oninput="feeRowCalc(${i})"></div><div class="field c2"><label>당일추가수당</label><input type="number" id="fee_ex_${i}" min="0" value="0" oninput="feeRowCalc(${i})"></div><div class="field c2"><label>교통비/합계</label><div style="padding:8px 0;font-size:13px;font-weight:900;color:var(--navy);white-space:nowrap" id="fee_sum_${i}">${won(transportFee(km0))} / ${won(base+transportFee(km0))}</div></div></div>`).join('')}
function feeRowCalc(i){const base=Number(($('fee_a_'+i)||{}).value||0),km=Number(($('fee_km_'+i)||{}).value||0),inc=Number(($('fee_inc_'+i)||{}).value||0),ex=Number(($('fee_ex_'+i)||{}).value||0);const tr=transportFee(km);const el=$('fee_sum_'+i);if(el)el.innerHTML=won(tr)+' / '+won(base+tr+inc+ex)}
function saveFeeAdd(){const sid=($('fee_sched')||{}).value;if(!sid)return toast('출강일정을 선택하세요');
if(sid.indexOf('edu:')===0){const e=eduById(sid.slice(4));if(!e)return;const cands=eduFeeCandidates(e);const lock=((e.orgInfo&&e.orgInfo.transport)||'미제공')!=='제공';let added=0;cands.forEach((c,i)=>{if(eduFeeRegistered(e,c))return;const el=$('fee_a_'+i);const base=el&&el.value!==''?Number(el.value):c.base;const km=lock?0:Number(($('fee_km_'+i)||{}).value||0);const inc=Number(($('fee_inc_'+i)||{}).value||0);const tr=transportFee(km);const gross=Number(base||0)+tr+inc;if(gross>0){state.fees.unshift({id:uid('fee'),eduId:e.id,sessionNo:c.no,scheduleId:'',date:c.date,org:e.org||'',teacher:c.teacher,base:Number(base||0),km,transport:tr,incentive:inc,gross,journal:false,invoice:false,createdAt:nowStamp()});added++}});if(!added)return toast('등록할 회차/강사가 없습니다 (이미 등록되었거나 금액 0)');saveState();closeModal();toast(added+'건 교육 강사료가 등록되었습니다');renderFeeSettle();return}
const s=state.schedules.find(x=>x.id===sid);const names=feeTeachersOf(s);const exist=state.fees.filter(f=>f.scheduleId===sid&&!f.eduId&&!f.centerMonth);let feeMode='new';if(exist.length)feeMode=confirm('이미 이 출강의 강사료가 등록되어 있습니다.\n\n[확인] = 기존 건 덮어쓰기 (금액만 갱신 · 일지/청구서 체크 유지)\n[취소] = 새 건으로 추가 등록')?'over':'new';let added=0;names.forEach((n,i)=>{const base=Number(($('fee_a_'+i)||{}).value||0);const km=Number(($('fee_km_'+i)||{}).value||0);const inc=Number(($('fee_inc_'+i)||{}).value||0);const ex=Number(($('fee_ex_'+i)||{}).value||0);const tr=transportFee(km);const gross=base+tr+inc+ex;if(gross>0&&feeMode==='over'){const f0=exist.find(x=>x.teacher===n);if(f0){f0.base=base;f0.km=km;f0.transport=tr;f0.incentive=inc;f0.extraPay=ex;f0.gross=gross;added++;return}}
if(gross>0){state.fees.unshift({id:uid('fee'),scheduleId:sid,date:s.date||'',org:s.org||'',teacher:n,base,km,transport:tr,incentive:inc,extraPay:ex,gross,journal:false,invoice:false,createdAt:nowStamp()});added++}});if(!added)return toast('금액을 1명 이상 입력하세요');saveState();closeModal();toast(added+'건 강사료가 등록되었습니다');renderFeeSettle()}
function bankOf(name){const t=(state.instructors||[]).find(x=>x.name===name);if(t&&(t.bank||t.account))return {bank:t.bank||'',account:t.account||''};const c=(state.contractors||[]).find(x=>x.name===name);return c?{bank:c.bank||'',account:c.account||''}:{bank:'',account:''}}
function fpRecalc(){const sp=window._fpSplit||{prevDue:0,curPend:0};const inc=(($('fp_incCur')||{}).checked);const el=$('fp_amount');if(el)el.value=Math.max(sp.dueNow,0)+(inc?Math.max(sp.curPend,0):0);const fm=$('fp_month');if(fm&&!inc)fm.value=window._fpPrevYm||fm.value}

veFeePay('${escAttr(teacher)}')">지급 등록</button></div>`)}
function saveFeePay(teacher){const amt=Number(($('fp_amount')||{}).value||0);if(amt<=0)return toast('지급액을 입력하세요');const acc0=($('fp_acc')||{}).value||'';const acc=acc0==='__add__'?'':acc0;const dt=($('fp_date')||{}).value||today();const memo=($('fp_memo')||{}).value||'';const sp=window._fpSplit||{prevDue:0,curPend:0};const inc=(($('fp_incCur')||{}).checked);if(inc&&amt===Math.max(sp.dueNow,0)+Math.max(sp.curPend,0)&&sp.curPend>0){if(sp.dueNow>0)state.feePayments.unshift({id:uid('fp'),teacher,date:dt,forMonth:window._fpPrevYm||'',amount:sp.dueNow,account:acc,memo});state.feePayments.unshift({id:uid('fp'),teacher,date:dt,forMonth:curMonth(),amount:sp.curPend,account:acc,memo:memo?memo+' (당월분)':'당월 발생분'});saveState();closeModal();toast('전월분·당월분 지급이 각각 등록되었습니다');renderFeeSettle();return}state.feePayments.unshift({id:uid('fp'),teacher,date:dt,forMonth:($('fp_month')||{}).value||'',amount:amt,account:acc,memo});saveState();closeModal();toast('지급이 등록되었습니다');renderFeeSettle()}
function renderAlba(){setTitle('강사료 정산 · 센터 알바비',`<button class="btn btn-navy" onclick="openAlbaAddModal()">＋ 알바비 등록</button><button class="btn btn-gold" onclick="openAcctModal()">🧾 회계처리 엑셀</button><button class="btn btn-ghost" onclick="exportAlbaCSV()">엑셀/CSV</button>`);const list=state.partTime||[];const tot=list.reduce((a,x)=>a+albaNet(x),0);const paid=list.filter(x=>x.status==='지급완료').reduce((a,x)=>a+albaNet(x),0);const un=tot-paid;const rows=list.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(x=>[fmtDate(x.date),esc(x.name)+(x.kind==='t'&&isTax10(x.name)?'<div style="color:var(--warn);font-weight:900;font-size:11px">⚠ 10% 차감</div>':''),x.kind==='t'?'<span class="pill" style="background:#0F2A44;color:#fff;border:0">강사</span>':x.kind==='c'?'<span class="pill" style="background:#0E7490;color:#fff;border:0">계약</span>':'<span class="pill">-</span>',esc(x.work||''),won(x.amount),won(albaTax(x)),`<b>${won(albaNet(x))}</b>`,x.status==='지급완료'?'<span class="pill green">지급완료</span>':'<span class="pill yellow">미지급</span>',x.payDate?fmtDate(x.payDate)+(x.account?' · '+esc(x.account):''):'',`${x.status!=='지급완료'?`<button class="btn btn-navy mini" onclick="openAlbaPayModal('${x.id}')">지급 처리</button> `:''}<button class="btn btn-ghost mini" onclick="delAlba('${x.id}')">삭제</button>`]);$('app').innerHTML=feeTabs()+`<div class="dash-grid"><div class="dash-card"><div class="label">총 발생</div><div class="num">${won(tot)}</div></div><div class="dash-card"><div class="label">지급 완료</div><div class="num">${won(paid)}</div></div><div class="dash-card"><div class="label">미지급</div><div class="num" style="color:${un>0?'var(--warn)':'var(--ok)'}">${won(un)}</div></div><div class="dash-card"><div class="label">등록 건수</div><div class="num">${list.length}</div></div></div><div class="card"><h3>🧑‍🔧 센터 일일고용 알바비 내역</h3>${rows.length?table(['근무일','이름','구분','업무 내용','금액(세전)','공제','실지급','상태','지급정보','관리'],rows,['l','l','l','r','c','l','c']):'<div class="muted">등록된 알바비가 없습니다. ＋ 알바비 등록으로 추가하세요.</div>'}<p class="muted">※ 금액은 입력한 일당 그대로 정산됩니다(자동 공제 없음).</p></div>`}

function openAcctModal(){const ym=curMonth();openModal(`<h3>🧾 회계처리 엑셀 (회계사무소 제출용)</h3><p class="muted">선택한 달에 <b>지급완료</b>된 알바비를 이름·주민번호·지급일자·지급액·소득세·주민세로 정리해 내려받습니다. 주민번호는 강사관리(강사·계약직)에 입력된 값을 불러옵니다.</p><div class="grid g12">${field('지급 월',`<input type="month" id="acct_ym" value="${ym}" onchange="acctPreview()">`,'c4')}</div><div id="acct_prev"></div><div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">닫기</button><button class="btn btn-navy" onclick="exportAcctExcel()">📥 엑셀 다운로드</button></div>`,true);acctPreview()}
function acctPreview(){const ym=($('acct_ym')||{}).value||curMonth();const rows=acctRows(ym);const miss=rows.filter(r=>!r.rrn).length;const el=$('acct_prev');if(el)el.innerHTML=rows.length?table(['이름','주민번호','지급일자','지급액','소득세','주민세'],rows.map(r=>[esc(r.name),r.rrn?esc(r.rrn):'<span style="color:var(--warn);font-weight:800">미입력</span>',fmtDate(r.payDate),won(r.net),won(r.it),won(r.lt)]))+(miss?`<p class="muted" style="color:var(--warn)">⚠ 주민번호 미입력 ${miss}명 — 강사관리에서 입력 후 다시 내려받으세요.</p>`:''):'<div class="muted">이 달에 지급완료된 알바비가 없습니다.</div>'}
function exportAcctExcel(){const ym=($('acct_ym')||{}).value||curMonth();const rows=acctRows(ym);if(!rows.length)return toast('이 달에 지급완료된 건이 없습니다');const X=t=>String(t??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');const C=(v,st)=>`<Cell${st?` ss:StyleID="${st}"`:''}><Data ss:Type="${typeof v==='number'?'Number':'String'}">${typeof v==='number'?v:X(v)}</Data></Cell>`;const ROW=c=>`<Row>${c}</Row>`;const body=ROW(['이름','주민번호','지급일자','지급액','소득세','주민세'].map(x=>C(x,'h')).join(''))+rows.map(r=>ROW(C(r.name,'w')+C(r.rrn,'w')+C(r.payDate,'w')+C(r.net,'w')+C(r.it,'w')+C(r.lt,'w'))).join('')+ROW(C('합계','k')+C('','w')+C('','w')+C(rows.reduce((a,r)=>a+r.net,0),'k')+C(rows.reduce((a,r)=>a+r.it,0),'k')+C(rows.reduce((a,r)=>a+r.lt,0),'k'));const xml=`<?xml version="1.0"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Styles><Style ss:ID="h"><Interior ss:Color="#0F2A44" ss:Pattern="Solid"/><Font ss:Color="#FFFFFF" ss:Bold="1"/></Style><Style ss:ID="k"><Interior ss:Color="#EEF3F8" ss:Pattern="Solid"/><Font ss:Bold="1"/></Style><Style ss:ID="w"><Alignment ss:Vertical="Top"/></Style></Styles><Worksheet ss:Name="회계처리_${ym}"><Table>${body}</Table></Worksheet></Workbook>`;downloadText('\ufeff'+xml,`[ENK LAB] 회계처리_${ym}.xls`,'application/vnd.ms-excel;charset=utf-8')}
function openAlbaAddModal(){openModal(`<h3>＋ 센터 알바비 등록</h3><datalist id="ctList">${(state.contractors||[]).map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist><div class="grid g12">${field('구분',`<label style="font-weight:800;margin-right:14px"><input type="radio" name="al_kind" id="al_kind_t" checked onchange="albaKindHint()"> 강사 알바 (3.3%·10%대상은 10% 공제)</label><label style="font-weight:800"><input type="radio" name="al_kind" id="al_kind_c" onchange="albaKindHint()"> 계약 알바 (공제 없음)</label><div class="muted" id="al_kind_hint" style="margin-top:4px"></div>`,'c12')}${field('근무일',`<input type="date" id="al_date" value="${today()}">`,'c4')}${field('이름',`<input id="al_name" placeholder="예: 김알바" list="teacherList">`,'c4')}${field('금액(일당·세전)',`<input type="number" id="al_amount" min="0" value="0">`,'c4')}<div class="field c8" id="al_wagebox" style="display:none"><label>⏱ 시급 자동계산 (계약 알바 · 최저시급)</label><div style="display:flex;gap:6px;align-items:center"><input type="number" step="0.5" id="al_hours" min="0" placeholder="시간" style="max-width:100px" oninput="albaCalc()"> 시간 × <input type="number" id="al_wage" min="0" value="${state.settings.minWage||10320}" style="max-width:110px" oninput="albaCalc()"> 원 = <b id="al_calc" style="color:var(--navy)">0원</b></div></div>${field('업무 내용',`<input id="al_work" placeholder="예: 교구 포장 보조">`,'c12')}</div><div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">취소</button><button class="btn btn-navy" onclick="saveAlbaAdd()">등록</button></div>`)}
function albaKindHint(){const c=($('al_kind_c')||{}).checked;const n=$('al_name');if(n)n.setAttribute&&n.setAttribute('list',c?'ctList':'teacherList');const el=$('al_kind_hint');if(el)el.textContent=c?'계약직 명단(강사관리 → 계약직 탭)에서 이름을 선택하거나 직접 입력하세요.':'강사 명단에서 선택하세요. 10% 차감 대상 강사는 자동으로 10% 공제됩니다.';const wb=$('al_wagebox');if(wb)wb.style.display=c?'block':'none'}
function albaCalc(){const hrs=Number(($('al_hours')||{}).value||0);const w=Number(($('al_wage')||{}).value||0);const amt=Math.round(hrs*w);const c=$('al_calc');if(c)c.textContent=won(amt);const a=$('al_amount');if(a&&amt>0)a.value=amt;if(w>0){state.settings.minWage=w}}
function saveAlbaAdd(){const name=(($('al_name')||{}).value||'').trim();const amt=Number(($('al_amount')||{}).value||0);if(!name)return toast('이름을 입력하세요');if(amt<=0)return toast('금액을 입력하세요');const kind=($('al_kind_c')||{}).checked?'c':'t';if(Number(($('al_wage')||{}).value||0)>0)state.settings.minWage=Number($('al_wage').value);state.partTime.unshift({id:uid('al'),kind,hours:Number(($('al_hours')||{}).value||0)||undefined,date:($('al_date')||{}).value||today(),name,work:($('al_work')||{}).value||'',amount:amt,status:'미지급',payDate:'',account:'',memo:''});saveState();closeModal();toast('알바비가 등록되었습니다');render()}
function openAlbaPayModal(id){const x=state.partTime.find(v=>v.id===id);if(!x)return;openModal(`<h3>💸 알바비 지급 처리 - ${esc(x.name)}</h3><div class="grid g12">${field('지급일',`<input type="date" id="alp_date" value="${today()}">`,'c4')}${field('지급액(공제 후)',`<div style="padding:9px 10px;font-weight:900;color:var(--navy)">${won(albaNet(x))}${albaTax(x)?`<div class="muted" style="font-size:11px;font-weight:400">세전 ${won(x.amount)} · 공제 ${won(albaTax(x))}</div>`:''}</div>`,'c4')}${field('이체 통장',accountSelect('alp_acc',''),'c4')}${field('메모','<input id="alp_memo" placeholder="예: OO은행에서 이체">','c12')}</div><div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">취소</button><button class="btn btn-navy" onclick="saveAlbaPay('${id}')">지급 완료 처리</button></div>`)}
function saveAlbaPay(id){const x=state.partTime.find(v=>v.id===id);if(!x)return;const acc=($('alp_acc')||{}).value||'';x.status='지급완료';x.payDate=($('alp_date')||{}).value||today();x.account=acc==='__add__'?'':acc;x.memo=($('alp_memo')||{}).value||'';saveState();closeModal();toast('지급 완료 처리되었습니다');render()}
function delAlba(id){if(!confirm('이 알바비 건을 삭제할까요?'))return;state.partTime=state.partTime.filter(v=>v.id!==id);saveState();render()}
function exportAlbaCSV(){const L=[];L.push('[센터 알바비 내역]');L.push('근무일,이름,구분,업무내용,금액(세전),공제,실지급,상태,지급일,통장,메모');(state.partTime||[]).forEach(x=>L.push([x.date,csvQ(x.name),x.kind==='t'?'강사':x.kind==='c'?'계약':'-',csvQ(x.work||''),x.amount,albaTax(x),albaNet(x),x.status,x.payDate||'',csvQ(x.account||''),csvQ(x.memo||'')].join(',')));const tot=(state.partTime||[]).reduce((a,x)=>a+albaNet(x),0);const paid=(state.partTime||[]).filter(x=>x.status==='지급완료').reduce((a,x)=>a+albaNet(x),0);L.push('');L.push('[요약]');L.push('총 발생,지급 완료,미지급');L.push([tot,paid,tot-paid].join(','));downloadText('\ufeff'+L.join('\n'),`ENK_센터알바비_${today()}.csv`,'text/csv;charset=utf-8')}
function exportFeeCSV(){const L=[];L.push('[강사료 발생 내역]');L.push('출강일,기관,강사,기본강사료,왕복km,교통비,인센티브,당일추가수당,총액,공제,실지급액,일지,청구서,상태');(state.fees||[]).forEach(f=>L.push([f.date,csvQ(f.org),csvQ(f.teacher),f.base||0,f.km||0,f.transport||0,f.incentive||0,f.extraPay||0,f.gross,feeTaxF(f),feeNetF(f),f.journal?'O':'X',f.invoice?'O':'X',feeDocsOk(f)?'지급가능':'서류대기'].join(',')));L.push('');L.push('[지급 내역]');L.push('지급일,강사,지급액,통장,메모');(state.feePayments||[]).forEach(p=>L.push([p.date,csvQ(p.teacher),p.amount,csvQ(p.account||''),csvQ(p.memo||'')].join(',')));L.push('');L.push('[강사별 요약]');L.push('강사,발생(실지급),지급,미지급 잔액');[...new Set([...(state.fees||[]).map(f=>f.teacher),...(state.feePayments||[]).map(p=>p.teacher)])].filter(Boolean).sort().forEach(n=>L.push([csvQ(n),teacherFeeNet(n),teacherFeePaid(n),teacherFeeNet(n)-teacherFeePaid(n)].join(',')));L.push('');L.push('[요약]');L.push('총 발생(실지급),총 지급,미지급 잔액');L.push([feeTotalNet(),feePayTotal(),feeTotalNet()-feePayTotal()].join(','));downloadText('\ufeff'+L.join('\n'),`ENK_강사료정산_${today()}.csv`,'text/csv;charset=utf-8')}
let batchRows=[];
function openBatchStockIn(){batchRows=[{eq:'',n:0,s:0}];openModal(batchStockHtml())}
function batchStockHtml(){return `<h3>📥 일괄 입고 (한 날짜 · 여러 교구)</h3><p class="muted">같은 날 택배로 여러 교구가 함께 들어올 때 사용하세요. 교구별로 정상/샘플 수량을 입력하고, 필요한 만큼 행을 추가하면 됩니다. 정산 금액은 지사가(원가) × 정상 수량으로 자동 계산되며, 샘플은 무료입니다.</p><div class="grid g12">${field('입고일',`<input type="date" id="bs_date" value="${today()}">`,'c6')}${field('메모(공통)',`<input id="bs_memo" value="택배 입고">`,'c6')}</div><div class="grid-sub" style="margin-top:10px">교구별 수량</div><div id="bsRows">${batchRowsHtml()}</div><div class="toolbar"><button class="btn btn-ghost mini" onclick="addBatchRow()">＋ 교구 행 추가</button></div><div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">취소</button><button class="btn btn-navy" onclick="saveBatchStockIn()">일괄 입고 처리</button></div>`}
function batchRowsHtml(){const opts=(sel)=>`<option value=""${!sel?' selected':''}>교구 선택</option>`+state.equipment.map(e=>`<option value="${esc(e.name)}"${e.name===sel?' selected':''}>${esc(e.name)}</option>`).join('');return batchRows.map((r,i)=>`<div class="grid g12" style="margin-bottom:6px"><div class="field c6"><label>교구 ${i+1}</label><select id="bs_eq_${i}">${opts(r.eq)}</select></div><div class="field c3"><label>정상</label><input type="number" id="bs_n_${i}" min="0" value="${r.n||0}"></div><div class="field c2"><label>샘플</label><input type="number" id="bs_s_${i}" min="0" value="${r.s||0}"></div><div class="field c1" style="grid-column:span 1"><label>&nbsp;</label><button class="btn btn-ghost mini" onclick="removeBatchRow(${i})" title="행 삭제">✖</button></div></div>`).join('')}
function collectBatchRows(){batchRows=batchRows.map((r,i)=>({eq:($('bs_eq_'+i)||{}).value||'',n:Number(($('bs_n_'+i)||{}).value||0),s:Number(($('bs_s_'+i)||{}).value||0)}))}
function addBatchRow(){collectBatchRows();batchRows.push({eq:'',n:0,s:0});$('bsRows').innerHTML=batchRowsHtml()}
function removeBatchRow(i){collectBatchRows();if(batchRows.length<=1)return toast('최소 1행은 필요합니다');batchRows.splice(i,1);$('bsRows').innerHTML=batchRowsHtml()}
function saveBatchStockIn(){collectBatchRows();const date=($('bs_date')||{}).value||today();const memo=($('bs_memo')||{}).value||'입고';const valid=batchRows.filter(r=>r.eq&&(r.n>0||r.s>0));if(!valid.length)return toast('교구를 선택하고 수량을 1개 이상 입력하세요');let total=0;valid.forEach(r=>{const up=finalCost((equipByName(r.eq)||{}).oldPrice||0);if(r.n>0){changeStock(r.eq,'normal',r.n,memo,{date,kind:'입고',unitPrice:up});total+=up*r.n}if(r.s>0)changeStock(r.eq,'sample',r.s,memo,{date,kind:'입고',unitPrice:0})});saveState();closeModal();toast(valid.length+'종 입고 처리 · 정산 합계 '+won(total));render()}
function stockInHistory(){const logs=stockInLogs();const byDate={};logs.forEach(l=>{const d=l.date||l.at.slice(0,10);(byDate[d]=byDate[d]||[]).push(l)});(state.eqCharges||[]).forEach(c=>{const d=c.date||'';(byDate[d]=byDate[d]||[]).push({_charge:true,id:c.id,equip:c.name,type:'charge',delta:'',unitPrice:'',amount:c.amount,memo:c.memo||''})});const dates=Object.keys(byDate).sort().reverse();if(!dates.length)return '<div class="muted">입고 내역이 없습니다. (일괄 입고 처리 시 날짜별로 기록됩니다)</div>';return dates.map(d=>{const rows=byDate[d].map(l=>l._charge?[esc(l.equip)+' <span class="pill" style="background:#B8860B;color:#fff;border:0">소모품청구</span>','청구','-','-',won(l.amount||0),esc(l.memo||''),`<button class="btn btn-ghost mini no-print" onclick="openChargeModal('${l.id}')">수정</button>`]:[esc(l.equip),l.type==='sample'?'샘플':'정상','+'+l.delta,l.type==='sample'?'무료':won(l.unitPrice||0),l.type==='sample'?'-':won(l.amount||0),esc(l.memo||''),`<button class="btn btn-ghost mini no-print" onclick="editStockLog('${l.id}')">수정</button>`]);const cnt=byDate[d].reduce((a,l)=>a+Number(l.delta||0),0);const amt=byDate[d].reduce((a,l)=>a+Number(l.amount||0),0);return `<div class="grid-sub" style="display:flex;align-items:center;gap:10px">${fmtDate(d)} · ${byDate[d].length}건 · 총 +${cnt}개 · 합계 <b>${won(amt)}</b> <button class="btn btn-red mini no-print" onclick="deleteStockDate('${d}')">이 날짜 입고 삭제</button></div>`+table(['교구','구분','입고수량','단가(원가)','금액','메모','관리'],rows,['l','c','r','r','r','l','c'])}).join('')}
function editStockLog(id){const l=state.inventoryLog.find(x=>x.id===id&&x.kind==='입고');if(!l)return;const isSample=l.type==='sample';openModal(`<h3>✏ 입고 건 수정 - ${esc(l.equip)} (${isSample?'샘플':'정상'})</h3><p class="muted">수량을 바꾸면 재고가 자동으로 함께 조정되고, 정산 금액도 다시 계산됩니다.</p><div class="grid g12">${field('입고일',`<input type="date" id="sl_date" value="${esc(l.date||l.at.slice(0,10))}">`,'c4')}${field('입고수량',`<input type="number" id="sl_qty" min="1" value="${l.delta}">`,'c4')}${isSample?field('단가',`<div style="padding:9px 10px;font-weight:900;color:var(--muted)">무료 (샘플)</div>`,'c4'):field('단가(원가)',`<input type="number" id="sl_price" min="0" value="${l.unitPrice||0}">`,'c4')}${field('메모',`<input id="sl_memo" value="${esc(l.memo||'')}">`,'c12')}</div><div class="modal-actions"><button class="btn btn-red" onclick="deleteStockLog('${id}')">이 건 삭제</button><button class="btn btn-ghost" onclick="closeModal()">취소</button><button class="btn btn-navy" onclick="saveStockLogEdit('${id}')">저장</button></div>`)}
function saveStockLogEdit(id){const l=state.inventoryLog.find(x=>x.id===id&&x.kind==='입고');if(!l)return;const q=Number(($('sl_qty')||{}).value||0);if(q<=0)return toast('수량은 1 이상이어야 합니다');const date=($('sl_date')||{}).value||l.date;const price=l.type==='sample'?0:Number(($('sl_price')||{}).value||0);const diff=q-Number(l.delta||0);const e=equipByName(l.equip);if(e)e[l.type]=Number(e[l.type]||0)+diff;l.delta=q;l.date=date;l.unitPrice=price;l.amount=price*q;l.memo=($('sl_memo')||{}).value||'';if(e)l.after=e[l.type];state.statusLog.unshift({id:uid('st'),at:nowStamp(),title:`${l.equip} 입고 건 수정 (${fmtDate(date)})`,memo:`수량 ${q} · 금액 ${won(l.amount)}`});saveState();closeModal();toast('입고 건이 수정되고 재고가 조정되었습니다');render()}
function deleteStockLog(id){const l=state.inventoryLog.find(x=>x.id===id&&x.kind==='입고');if(!l)return;if(!confirm(`${l.equip} ${l.type==='sample'?'샘플':'정상'} +${l.delta} 입고 건을 삭제하고 재고를 되돌릴까요?`))return;const e=equipByName(l.equip);if(e)e[l.type]=Number(e[l.type]||0)-Number(l.delta||0);state.inventoryLog=state.inventoryLog.filter(x=>x.id!==id);state.statusLog.unshift({id:uid('st'),at:nowStamp(),title:`${l.equip} 입고 건 삭제(재고 복구)`,memo:fmtDate(l.date||'')});saveState();closeModal();toast('입고 건이 삭제되고 재고가 복구되었습니다');render()}
function returnList(){const out=[];state.shipments.forEach(sh=>{shipmentSummary(sh).filter(x=>equipByName(x.equip)?.type==='회수용'||x.stockType==='sample').forEach(x=>{const rid=sh.id+'_'+x.teacher+'_'+x.equip;const st=state.returnStatus[rid]||{status:'반납예정',at:''};out.push({id:rid,teacher:x.teacher,equip:x.equip,org:sh.org,due:sh.date?nextWeekday(addDays(sh.date,7)):'',status:st.status,at:st.at})})});return out}
function overdueReturns(){const d=today();return returnList().filter(r=>r.due&&r.due<d&&r.status!=='반납완료')}
function setReturnStatus(rid,status){state.returnStatus[rid]={status,at:status==='반납완료'?nowStamp():''};state.tasks=state.tasks.filter(t=>t.id!=='ret_'+rid);saveState();renderReturns()}
function renderReturns(){setTitle('반납·불량관리');const rows=returnList().map(r=>[esc(r.teacher),esc(r.equip),esc(r.org),fmtDate(r.due),`<select onchange="setReturnStatus('${r.id}',this.value)">${RETURN_STATUS.map(s=>`<option value="${s}" ${s===r.status?'selected':''}>${s}</option>`).join('')}</select>`,r.at?`<span class="muted">${esc(r.at)}</span>`:'']);$('app').innerHTML=`<div class="card"><h3>🔁 반납관리</h3>${rows.length?table(['강사','교구','기관','반납기한','상태','완료시각'],rows,['l','l','l','c','l','l']):'<div class="muted">반납 대상이 없습니다. (회수용/샘플 교구 발송 시 표시됩니다)</div>'}</div><div class="card"><h3>🚫 불량재고 등록</h3><div class="grid g4">${field('교구',selectHtml('bad_equip',state.equipment.map(e=>e.name),''))}${field('수량','<input type="number" id="bad_qty" value="1">')}${field('사유',selectHtml('bad_reason',BAD_REASONS,'작동불량'))}${field('메모','<input id="bad_memo">')}</div><div class="toolbar"><button class="btn btn-red" onclick="moveBadStock()">불량재고로 이동</button><button class="btn btn-green" onclick="restoreBadStock()">정상재고로 복구</button></div></div>`}
function moveBadStock(){const eq=$('bad_equip').value,qty=Number($('bad_qty').value||0);if(!eq)return toast('교구를 선택하세요');changeStock(eq,'normal',-qty,'불량재고 이동: '+$('bad_reason').value);changeStock(eq,'bad',qty,$('bad_memo').value||'불량등록');renderReturns()}
