function renderContractors(){setTitle('강사관리 · 계약직',`<button class="btn btn-navy" onclick="openContractorModal()">＋ 계약직 등록</button>`);const rows=(state.contractors||[]).slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'ko')).map(c=>[esc(c.name),esc(c.phone||''),esc(c.memo||''),`<button class="btn btn-ghost mini" onclick="openContractorModal('${c.id}')">수정</button> <button class="btn btn-ghost mini" style="color:var(--warn)" onclick="delContractor('${c.id}')">삭제</button>`]);$('app').innerHTML=instTabs()+`<div class="card"><h3>📄 계약직 (일반 알바) 명단</h3>${rows.length?table(['이름','연락처','메모','관리'],rows):'<div class="muted">＋ 계약직 등록으로 추가하세요. 알바비 등록에서 \'계약 알바\'로 선택하면 공제 없이 정산됩니다.'+'</div>'}</div>`}
function openContractorModal(id){const c=id?(state.contractors||[]).find(x=>x.id===id):{name:'',phone:'',memo:''};if(!c)return;openModal(`<h3>${id?'계약직 수정':'＋ 계약직 등록'}</h3><div class="grid g12">${field('이름',`<input id="ct_name" value="${esc(c.name)}">`,'c4')}${field('연락처',`<input id="ct_phone" value="${esc(c.phone||'')}">`,'c4')}${field('주민등록번호(회계용)',`<input id="ct_rrn" value="${esc(c.rrn||'')}" placeholder="000000-0000000">`,'c4')}${field('은행',`<input id="ct_bank" value="${esc(c.bank||'')}">`,'c4')}${field('계좌번호',`<input id="ct_account" value="${esc(c.account||'')}">`,'c4')}${field('메모',`<input id="ct_memo" value="${esc(c.memo||'')}">`,'c4')}</div><div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">취소</button><button class="btn btn-navy" onclick="saveContractor('${id||''}')">저장</button></div>`)}
function saveContractor(id){const name=(($('ct_name')||{}).value||'').trim();if(!name)return toast('이름을 입력하세요');const obj={id:id||uid('ct'),name,phone:($('ct_phone')||{}).value||'',rrn:($('ct_rrn')||{}).value||'',bank:($('ct_bank')||{}).value||'',account:($('ct_account')||{}).value||'',memo:($('ct_memo')||{}).value||''};const i=(state.contractors||[]).findIndex(x=>x.id===obj.id);if(i>=0)state.contractors[i]=obj;else state.contractors.unshift(obj);saveState();closeModal();toast('계약직이 저장되었습니다');render()}
function delContractor(id){const c=state.contractors.find(x=>x.id===id);if(!c)return;const n=(state.partTime||[]).filter(x=>x.name===c.name).length;if(!confirm(`"${c.name}" 계약직을 삭제할까요?${n?`\n알바비 ${n}건은 이름으로 보존됩니다.`:''}`))return;state.contractors=state.contractors.filter(x=>x.id!==id);saveState();render()}
function renderInstructors(){if(instTab==='c')return renderContractors();setTitle('강사관리',`<button class="btn btn-navy" onclick="editInstructorModal()">＋ 강사 추가</button><button class="btn btn-blue" onclick="openCardPaste()">📋 강사 카드 붙여넣기</button><button class="btn btn-ghost" onclick="exportCSV('instructors')">엑셀/CSV</button>`);const rows=state.instructors.slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'ko')).map(t=>[esc(t.name),esc(t.org),t.phone?esc(t.phone):'<span class="danger-text">없음</span>',esc(t.email||''),`<b style="color:${instScore(t)<70?'var(--warn)':'var(--navy)'}">${instScore(t)}</b>`,instTotalDispatch(t.name)+'회',`<button class="btn btn-ghost mini" onclick="editInstructorModal('${t.id}')">수정</button> <button class="btn btn-ghost mini" onclick="openInstructorScore('${t.id}')">점수·이력</button> <button class="btn btn-ghost mini" style="color:var(--warn)" onclick="delInstructor('${t.id}')">삭제</button>`]);$('app').innerHTML=instTabs()+`<div class="card"><h3>👩‍🏫 강사정보</h3>${table(['강사명','소속','연락처','메일','총점','출강(누적)','관리'],rows,['l','l','l','l','c','r','l'])}</div><div class="card"><h3>CSV 가져오기</h3><p class="muted">헤더 포함: 강사명,연락처,메일주소,주소,상세주소,우편번호,메모</p><input type="file" accept=".csv" onchange="importCSV(event,'instructors')"></div>`}
function editInstructorModal(id,pre){const blank={id:'',name:'',org:'',position:'강사',phone:'',homePhone:'',email:'',address:'',detailAddress:'',zip:'',resident:'',education:'',career:'',certs:'',wage:'',startDate:'',available:'',memo:'',scoreAdjustments:[]};const t=id?state.instructors.find(x=>x.id===id):Object.assign({...blank},pre||{});openModal(`<h3>${id?'강사 수정':'강사 추가'}</h3><div class="grid g12"><div class="grid-sub">기본</div>${field('강사명',`<input id="t_name" value="${esc(t.name)}">`,'c4')}${field('소속',`<input id="t_org" value="${esc(t.org)}">`,'c4')}${field('직위',`<input id="t_position" value="${esc(t.position||'강사')}">`,'c4')}<div class="grid-sub">센터 수업 단가</div>${field('첫 타임(1.5T) 단가',`<input type="number" id="t_cfirst" min="0" value="${t.centerFirst||0}" placeholder="예: 45000">`,'c4')}${field('추가 시간당 단가',`<input type="number" id="t_cextra" min="0" value="${t.centerExtra||0}" placeholder="예: 30000">`,'c4')}${field('세금 구분',`<label style="font-weight:800;color:var(--warn)"><input type="checkbox" id="t_tax10" ${t.tax10?'checked':''}> 소득신고 미대상 (10% 차감)</label>`,'c4')}${field('주민등록번호(회계용)',`<input id="t_rrn" value="${esc(t.rrn||'')}" placeholder="000000-0000000">`,'c4')}${field('은행',`<input id="t_bank" value="${esc(t.bank||'')}" placeholder="예: 국민은행">`,'c4')}${field('계좌번호',`<input id="t_account" value="${esc(t.account||'')}" placeholder="000-0000-0000">`,'c4')}<div class="grid-sub">연락처</div>${field('핸드폰',`<input id="t_phone" value="${esc(t.phone)}">`,'c4')}${field('집 전화',`<input id="t_homephone" value="${esc(t.homePhone||'')}">`,'c4')}${field('이메일',`<input id="t_email" value="${esc(t.email)}">`,'c4')}<div class="grid-sub">주소</div>${field('주소',`<div class="addr-row"><input id="t_address" value="${esc(t.address)}">${mapBtn('t_address')}</div>`,'c6')}${field('우편번호',`<input id="t_zip" value="${esc(t.zip)}">`,'c3')}${field('상세주소',`<input id="t_detail" value="${esc(t.detailAddress)}">`,'c3')}<div class="grid-sub">학력 · 경력 · 자격</div>${field('학력',`<input id="t_education" value="${esc(t.education||'')}">`,'c4')}${field('자격사항',`<input id="t_certs" value="${esc(t.certs||'')}">`,'c8')}${field('주요경력',`<textarea id="t_career">${esc(t.career||'')}</textarea>`,'c12')}<div class="grid-sub">근무 조건</div>${field('희망시급',`<input id="t_wage" value="${esc(t.wage||'')}">`,'c4')}${field('강의 가능 시작일',`<input id="t_startdate" value="${esc(t.startDate||'')}">`,'c4')}${field('출강가능여부',`<input id="t_available" value="${esc(t.available||'')}">`,'c4')}<div class="grid-sub">개인정보 · 메모</div>${field('주민등록번호',`<input id="t_resident" value="${esc(t.resident||'')}">`,'c6')}${field('메모',`<input id="t_memo" value="${esc(t.memo)}">`,'c6')}</div><p class="muted">※ 주민등록번호 등 민감정보는 이 브라우저(로컬)에만 저장되며 암호화되지 않습니다. 꼭 필요한 경우에만 입력하세요.</p><div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">취소</button><button class="btn btn-navy" onclick="saveInstructorModal('${id||''}')">저장</button></div>`)}
function saveInstructorModal(id){const g=x=>{const el=$(x);return el?el.value.trim():''};const obj={id:id||uid('t'),name:g('t_name'),org:g('t_org'),position:g('t_position')||'강사',phone:g('t_phone'),homePhone:g('t_homephone'),centerFirst:Number(g('t_cfirst')||0),centerExtra:Number(g('t_cextra')||0),tax10:!!(($('t_tax10')||{}).checked),rrn:g('t_rrn')||'',bank:g('t_bank')||'',account:g('t_account')||'',email:g('t_email'),address:g('t_address'),detailAddress:g('t_detail'),zip:g('t_zip'),resident:g('t_resident'),education:g('t_education'),certs:g('t_certs'),career:g('t_career'),wage:g('t_wage'),startDate:g('t_startdate'),available:g('t_available'),memo:g('t_memo')};if(!obj.name)return toast('강사명을 입력하세요');const idx=state.instructors.findIndex(x=>x.id===id);if(idx>=0){obj.scoreAdjustments=state.instructors[idx].scoreAdjustments||[];state.instructors[idx]=obj}else{const dup=state.instructors.findIndex(x=>x.name===obj.name);if(dup>=0){if(confirm(`이미 "${obj.name}" 강사가 있습니다.\n\n[확인] 기존 강사에 덮어쓰기(수정)\n[취소] 동명이인으로 새로 생성`)){obj.id=state.instructors[dup].id;obj.scoreAdjustments=state.instructors[dup].scoreAdjustments||[];state.instructors[dup]=obj}else{obj.scoreAdjustments=[];state.instructors.push(obj)}}else{obj.scoreAdjustments=[];state.instructors.push(obj)}}closeModal();renderInstructors()}
function instScore(t){return 100+((t.scoreAdjustments||[]).reduce((a,x)=>a+Number(x.delta||0),0))}
function instTotalDispatch(name){return state.teacherHistory.filter(h=>h.teacher===name).length}
function instYearCounts(name){const m={};state.teacherHistory.filter(h=>h.teacher===name).forEach(h=>{const y=(h.date||'').slice(0,4)||'미상';m[y]=(m[y]||0)+1});return m}
function addScoreAdj(id,delta,reason){const t=state.instructors.find(x=>x.id===id);if(!t)return;t.scoreAdjustments=t.scoreAdjustments||[];t.scoreAdjustments.unshift({at:nowStamp(),date:today(),delta:Number(delta),reason:reason||'',memo:''});saveState();openInstructorScore(id)}
function addScoreAdjPrompt(id){const v=prompt('점수 증감치를 입력하세요 (예: -3, +5)');if(v===null)return;const d=Number(v);if(isNaN(d)||d===0)return toast('0이 아닌 숫자를 입력하세요');const reason=prompt('사유/메모를 입력하세요')||'직접 입력';addScoreAdj(id,d,reason)}
function removeScoreAdj(id,i){const t=state.instructors.find(x=>x.id===id);if(!t)return;if(!confirm('이 점수 조정 항목을 삭제할까요?'))return;t.scoreAdjustments.splice(i,1);saveState();openInstructorScore(id)}
function openInstructorScore(id){const t=state.instructors.find(x=>x.id===id);if(!t)return;const sc=instScore(t);const yc=instYearCounts(t.name);const years=Object.keys(yc).sort().reverse();const adj=t.scoreAdjustments||[];openModal(`<h3>📊 ${esc(t.name)} · 점수 / 출강 이력</h3><div class="grid-sub">출강 점수 (기본 100점 · 누적 차감)</div><div style="font-size:22px;font-weight:900;color:${sc<70?'var(--warn)':'var(--navy)'};margin:2px 0 8px">현재 총점 ${sc}점</div><div class="toolbar"><button class="btn btn-ghost mini" onclick="addScoreAdj('${id}',-3,'지각')">-3 지각</button><button class="btn btn-ghost mini" onclick="addScoreAdj('${id}',-5,'출강 미준수')">-5 미준수</button><button class="btn btn-ghost mini" onclick="addScoreAdj('${id}',-10,'무단결근')">-10 무단결근</button><button class="btn btn-navy mini" onclick="addScoreAdjPrompt('${id}')">직접 입력</button></div>${adj.length?table(['일자','증감','사유','삭제'],adj.map((a,i)=>[esc(a.date||a.at||''),(a.delta>0?'+':'')+a.delta,esc(a.reason||''),`<button class="btn btn-ghost mini" onclick="removeScoreAdj('${id}',${i})">✖</button>`]),['l','c','l','c']):'<div class="muted">점수 조정 이력이 없습니다.</div>'}<div class="grid-sub" style="margin-top:12px">연도별 출강 (출강완료 기준) · 누적 ${instTotalDispatch(t.name)}회</div>${years.length?table(['연도','출강 횟수'],years.map(y=>[y,yc[y]+'회']),['l','r']):'<div class="muted">출강완료 이력이 없습니다. (출강 상태를 "출강완료"로 저장하면 집계됩니다)</div>'}<div class="modal-actions"><button class="btn btn-navy" onclick="closeModal()">닫기</button></div>`)}
function openCardPaste(){openModal(`<h3>📋 강사 카드 붙여넣기</h3><p class="muted">한글(HWP) 강사 카드의 표를 복사해 아래에 붙여넣고 "분석"을 누르세요. 성명·주소·연락처·이메일·학력·경력·자격사항·희망시급 등을 자동 인식해 입력창을 채웁니다. 인식 결과는 저장 전 확인·수정할 수 있습니다.</p><textarea id="cardText" style="min-height:280px" placeholder="여기에 강사 카드 내용을 붙여넣기 하세요"></textarea><div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">취소</button><button class="btn btn-navy" onclick="analyzeCard()">분석 → 입력창 채우기</button></div>`)}
function analyzeCard(){const raw=($('cardText')||{}).value||'';if(!raw.trim())return toast('내용을 붙여넣으세요');const t=parseInstructorCard(raw);closeModal();editInstructorModal('',t);toast('인식 결과를 확인하고 저장하세요')}
function parseInstructorCard(raw){const LAB=[[/^(성\s*명|이름)$/,'name'],[/^(주민등록번호|주민번호)$/,'resident'],[/^주\s*소$/,'address'],[/^집$/,'homePhone'],[/^(핸드폰|휴대폰|휴대전화|hp)$/i,'phone'],[/^직위$/,'position'],[/^(e-?mail|이메일|메일)$/i,'email'],[/^학력$/,'education'],[/^(주요\s*경력|경력)\s*\d*$/,'career'],[/^(자격\s*사항|자격증|자격)$/,'certs'],[/^(희망\s*시급|시급)$/,'wage'],[/^(강의\s*가능\s*시작일|시작일)$/,'startDate'],[/^(출강\s*가능\s*여부|출강\s*가능)$/,'available']];const SKIP=/^(사진|구분|주요\s*내용|비\s*고|연\s*락\s*처|강\s*사\s*카\s*드|enk\s*lab|ai\s*career\s*academy)$/i;const cells=raw.split(/[\t\n\r]+/).map(x=>x.trim()).filter(x=>x.length);const out={};let cur=null;const labelOf=c=>{for(const[re,f]of LAB){if(re.test(c))return f}return null};cells.forEach(c=>{const f=labelOf(c);if(f){cur=f;return}if(SKIP.test(c)){cur=null;return}if(cur){out[cur]=out[cur]?out[cur]+' '+c:c}});if(out.position&&/^강사$/.test(out.position)===false&&out.position.length>6)delete out.position;return out}
function renderOrgs(){setTitle('기관관리',`<button class="btn btn-navy" onclick="editOrgModal()">＋ 기관 추가</button><button class="btn btn-ghost" onclick="exportCSV('orgs')">엑셀/CSV</button>`);const rows=state.orgs.map(o=>[esc(o.name),esc(o.manager||''),esc(o.phone||''),esc(o.address||''),esc(o.parking||''),`<button class="btn btn-ghost mini" onclick="editOrgModal('${o.id}')">수정</button>`]);$('app').innerHTML=`<div class="card"><h3>🏫 기관정보</h3>${table(['기관명','담당자','연락처','주소','주차','관리'],rows)}</div><div class="card"><h3>CSV 가져오기</h3><p class="muted">기관명,담당자명,연락처,주소,메모</p><input type="file" accept=".csv" onchange="importCSV(event,'orgs')"></div>`}
function editOrgModal(id){const o=id?state.orgs.find(x=>x.id===id):{id:'',name:'',manager:'',phone:'',address:'',parking:'',entry:'',memo:''};openModal(`<h3>${id?'기관 수정':'기관 추가'}</h3><div class="grid g12"><div class="grid-sub">기관 · 담당자</div>${field('기관명',`<input id="o_name" value="${esc(o.name)}">`,'c4')}${field('담당자명',`<input id="o_manager" value="${esc(o.manager)}">`,'c4')}${field('연락처',`<input id="o_phone" value="${esc(o.phone)}">`,'c4')}<div class="grid-sub">주소 · 현장</div>${field('주소',`<div class="addr-row"><input id="o_address" value="${esc(o.address)}">${mapBtn('o_address')}</div>`,'c12')}${field('주차안내',`<textarea id="o_parking">${esc(o.parking)}</textarea>`,'c6')}${field('출입방법',`<textarea id="o_entry">${esc(o.entry)}</textarea>`,'c6')}</div><div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">취소</button><button class="btn btn-navy" onclick="saveOrgModal('${id||''}')">저장</button></div>`)}
function saveOrgModal(id){const obj={id:id||uid('org'),name:$('o_name').value.trim(),manager:$('o_manager').value.trim(),phone:$('o_phone').value.trim(),address:$('o_address').value.trim(),parking:$('o_parking').value.trim(),entry:$('o_entry').value.trim(),memo:''};if(!obj.name)return toast('기관명을 입력하세요');const idx=state.orgs.findIndex(x=>x.id===id);if(idx>=0)state.orgs[idx]={...state.orgs[idx],...obj};else state.orgs.push(obj);closeModal();renderOrgs()}
function renderGuides(){setTitle('교안 발송관리');syncGuideSends();const rows=state.guideSends.map(g=>[fmtDate(g.date),esc(g.org),esc(g.teacher),selectHtml(`g_status_${g.id}`,['미발송','발송완료'],g.status),selectHtml(`g_method_${g.id}`,['메일','카톡','문자','직접전달','기타'],g.method||''),`<button class="btn btn-navy mini" onclick="saveGuide('${g.id}')">저장</button>`]);$('app').innerHTML=`<div class="card"><h3>📨 강사별 교안 발송관리</h3>${rows.length?table(['출강일','기관','강사','상태','발송방법','관리'],rows):'<div class="muted">발송 대기 중인 교안이 없습니다. (반 구성에서 교안 발송 체크 시 표시되며, 발송완료 건은 아래 저장함으로 이동합니다)</div>'}</div>`+`<div class="card"><h3>🗂 교안발송 저장함 (기관별)</h3>${guideArchiveByOrg()}</div>`}
function syncGuideSends(){state.schedules.forEach(s=>{(s.classes||[]).forEach(c=>{if(c.guide&&c.main&&!state.guideSends.some(g=>g.scheduleId===s.id&&g.teacher===c.main)&&!state.guideArchive.some(g=>g.scheduleId===s.id&&g.teacher===c.main)){state.guideSends.push({id:uid('guide'),scheduleId:s.id,date:s.date,org:s.org,teacher:c.main,status:'미발송',method:'카톡',sentAt:'',memo:''})}})})}
function saveGuide(id){const g=state.guideSends.find(x=>x.id===id);if(!g)return;g.status=$(`g_status_${id}`).value;g.method=$(`g_method_${id}`).value;if(g.status==='발송완료'){if(!g.sentAt)g.sentAt=nowStamp();state.guideArchive.unshift(g);state.guideSends=state.guideSends.filter(x=>x.id!==id);saveState();toast('발송완료 → 저장함(기관별)으로 이동했습니다')}else{saveState();toast('교안 발송상태가 저장되었습니다')}renderGuides()}
function restoreGuide(id){const g=state.guideArchive.find(x=>x.id===id);if(!g)return;if(!confirm('이 건을 발송 목록으로 되돌릴까요?'))return;g.status='미발송';g.sentAt='';state.guideSends.unshift(g);state.guideArchive=state.guideArchive.filter(x=>x.id!==id);saveState();renderGuides()}
function guideArchiveByOrg(){const byOrg={};state.guideArchive.forEach(g=>{const o=g.org||'기관 미상';(byOrg[o]=byOrg[o]||[]).push(g)});const orgs=Object.keys(byOrg).sort();if(!orgs.length)return '<div class="muted">저장된 발송완료 내역이 없습니다.</div>';return orgs.map(o=>{const rows=byOrg[o].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(g=>[fmtDate(g.date),esc(g.teacher),'<span class="pill green">발송완료</span>',esc(g.method||''),esc(g.sentAt||''),`<button class="btn btn-ghost mini" onclick="restoreGuide('${g.id}')">↺ 되돌리기</button>`]);return `<div class="grid-sub">🏫 ${esc(o)} · ${byOrg[o].length}건</div>`+table(['출강일','강사','상태','발송방법','발송일시','관리'],rows)}).join('')}
function renderKakao(){setTitle('카톡 공지관리');const rows=state.schedules.map(s=>[fmtDate(s.date),esc(s.org),noticeStatusBlock(s),`<button class="btn btn-ghost mini" onclick="copyKakaoNotice('${s.id}','first')">최초</button> <button class="btn btn-ghost mini" onclick="copyKakaoNotice('${s.id}','final')">최종</button> <button class="btn btn-ghost mini" onclick="copyKakaoNotice('${s.id}','after')">출강후</button>`]);$('app').innerHTML=`<div class="card"><h3>💬 출강별 카톡공지</h3>${rows.length?table(['출강일','기관','공지상태','복사'],rows):'<div class="muted">출강일정이 없습니다.</div>'}</div><div class="card"><h3>📚 교육일정 공지</h3>${state.eduSchedules.length?table(['기간','기관','최초공지','교육 전 안내','교육 후 안내'],state.eduSchedules.map(e=>[eduPeriodStr(e),esc(e.org||'-'),eduNoticeBtn(e,'eduFirst','최초'),eduNoticeBtn(e,'eduBefore','교육 전'),eduNoticeBtn(e,'eduAfter','교육 후')])):'<div class="muted">등록된 교육일정이 없습니다.</div>'}</div><div class="card"><h3>템플릿 관리</h3><div class="grid g3">${field('강사 단톡방 최초공지',`<textarea id="tpl_first">${esc(state.settings.kakaoTemplates.first)}</textarea>`)}${field('출강 전 최종안내',`<textarea id="tpl_final">${esc(state.settings.kakaoTemplates.final)}</textarea>`)}${field('출강 후 안내',`<textarea id="tpl_after">${esc(state.settings.kakaoTemplates.after)}</textarea>`)}</div><div class="toolbar"><button class="btn btn-navy" onclick="saveTemplates()">템플릿 저장</button><button class="btn btn-ghost" onclick="restoreTemplates()">기본 템플릿으로 복원</button></div><p class="muted">사용 가능 변수: {출강일}, {기관명}, {프로그램명}, {수업시간}, {강사명단}, {반별배정}, {교구목록}, {대기실도착시간}, {대기실장소}, {기관주소}, {주차안내}, {담당자명}, {담당자연락처}, {출입방법}, {교육일지마감}, {강사료청구서마감}</p><p class="muted">※ 공지에는 학생 인원·강사 배정·교구명만 포함되며, 교구 단가·정산 금액 등 재무정보는 포함되지 않습니다.</p></div>`}
function saveTemplates(){state.settings.kakaoTemplates.first=$('tpl_first').value;state.settings.kakaoTemplates.final=$('tpl_final').value;state.settings.kakaoTemplates.after=$('tpl_after').value;saveState();toast('템플릿이 저장되었습니다')}
function restoreTemplates(){if(confirm('기본 템플릿으로 복원할까요?')){state.settings.kakaoTemplates=defaultTemplates();saveState();renderKakao()}}
function copyKakaoNotice(id,type){openNoticePreview(id,type)}
function noticeTypeLabel(type){return {first:'강사 단톡방 최초공지',final:'출강 전 최종안내',after:'출강 후 안내'}[type]||type}
function noticeCurrentText(s,type){return (s.noticeText&&s.noticeText[type])?s.noticeText[type]:applyTemplate(state.settings.kakaoTemplates[type],s)}
function openNoticePreview(id,type){const s=state.schedules.find(x=>x.id===id);if(!s)return;const text=noticeCurrentText(s,type);const saved=!!(s.noticeText&&s.noticeText[type]);openModal(`<h3>💬 ${esc(noticeTypeLabel(type))} · 미리보기 / 수정</h3><p class="muted">${esc(s.org||'기관 미정')} · ${fmtDate(s.date)||'날짜 미정'} · 현재상태 ${s.notice?.[type]||'미발송'} · ${saved?'<b>저장된 수정본</b> 표시 중':'템플릿 자동 생성'}</p><textarea id="noticePreview" style="min-height:340px;font-size:13.5px">${esc(text)}</textarea><div class="toolbar"><button class="btn btn-ghost" onclick="resetNoticeToTemplate('${id}','${type}')">↺ 템플릿에서 새로 생성</button><button class="btn btn-navy" onclick="saveNoticeEdit('${id}','${type}')">💾 수정 저장</button></div><div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">닫기</button><button class="btn btn-blue" onclick="copyNoticeFromModal('${id}','${type}',false)">복사(저장)</button><button class="btn btn-green" onclick="copyNoticeFromModal('${id}','${type}',true)">복사 후 발송완료</button></div>`)}
function resetNoticeToTemplate(id,type){const s=state.schedules.find(x=>x.id===id);if($('noticePreview'))$('noticePreview').value=applyTemplate(state.settings.kakaoTemplates[type],s);toast('템플릿으로 새로 생성했습니다')}
function saveNoticeEdit(id,type){const s=state.schedules.find(x=>x.id===id);s.noticeText=s.noticeText||{first:'',final:'',after:''};s.noticeText[type]=$('noticePreview').value;saveState();toast('수정본이 저장되었습니다')}
function copyNoticeFromModal(id,type,markSent){const s=state.schedules.find(x=>x.id===id);const text=$('noticePreview').value;s.noticeText=s.noticeText||{first:'',final:'',after:''};s.noticeText[type]=text;copyText(text);if(markSent){s.notice=s.notice||{first:'미발송',final:'미발송',after:'미발송'};s.notice[type]='발송완료'}saveState();closeModal();render()}
function applyTemplate(t,s){const classes=(s.classes||[]).map(c=>`${c.label}(${c.grade||''}) - 메인 ${c.main||'미정'}${c.sub?` / 보조 ${c.sub}`:''}${c.equip?` / 교구 ${c.equip}`:''}`).join('\n')||'OOO';const equips=[...new Set((s.classes||[]).map(c=>c.equip).filter(Boolean))].join(', ')||'OOO';const time=[s.period,s.startTime&&s.endTime?`${s.startTime}~${s.endTime}`:''].filter(Boolean).join(' · ')||'OOO';const org=s.orgInfo||{};const journal=s.date?nextWeekday(addDays(s.date,3)):'';const fee=s.date?nextWeekday(monthEnd(s.date)):'';const vars={'{출강일}':fmtDate(s.date)||'O월 O일','{기관명}':s.org||'OOO','{프로그램명}':s.program||'OOO','{수업시간}':time,'{강사명단}':s.roster||'OOO','{반별배정}':classes,'{교구목록}':equips,'{대기실도착시간}':org.arrivalTime||'오전 OO:OO','{대기실장소}':org.waitingRoom||'OOOO / 강사 대기실','{기관주소}':org.address||'OOO','{주차안내}':org.parking||'OOO','{담당자명}':org.manager||'OOO','{담당자연락처}':org.phone||'OOO','{출입방법}':org.entry||'OOO','{교육일지마감}':fmtDate(journal),'{강사료청구서마감}':fmtDate(fee)};let out=t;Object.entries(vars).forEach(([k,v])=>out=out.split(k).join(v));return out}
function copyText(text){if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(text).then(()=>toast('복사되었습니다')).catch(()=>fallbackCopy(text));else fallbackCopy(text)}
function fallbackCopy(text){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('복사되었습니다')}catch(e){prompt('아래 내용을 복사하세요',text)}ta.remove()}
function renderHistory(){setTitle('이력·구글시트 전송',`<button class="btn btn-ghost" onclick="exportCSV('history')">이력 CSV</button>`);$('app').innerHTML=`<div class="card"><h3>강사 출강이력</h3>${table(['강사','출강일','기관','프로그램'],state.teacherHistory.map(h=>[esc(h.teacher),fmtDate(h.date),esc(h.org),esc(h.program)]))}</div><div class="card"><h3>재고변동 로그</h3>${table(['일시','교구','구분','수량','처리후','메모'],state.inventoryLog.slice(0,200).map(l=>[esc(l.at),esc(l.equip),esc(l.type),l.delta,l.after,esc(l.memo)]),['l','l','l','r','r','l'])}</div><div class="card"><h3>구글시트 탭별 전송</h3><div class="checkline">${['출강일정','교육일정','교구발송','재고현황','강사정보','강사출강이력'].map(x=>`<label><input type="checkbox" class="gsTab" value="${x}" checked> ${x}</label>`).join('')}</div><div class="toolbar"><button class="btn btn-navy" onclick="sendSelectedToSheet()">선택 탭 전송</button><button class="btn btn-ghost" onclick="showAppsScript()">Apps Script 코드 보기</button></div><p class="muted">전송 시 날짜_시간_탭명 형식으로 새 시트가 생성됩니다.</p></div>`}
function sendSelectedToSheet(){const url=state.settings.gasUrl;if(!url)return alert('설정에서 Google Apps Script URL을 입력해 주세요.');const tabs=[...document.querySelectorAll('.gsTab:checked')].map(x=>x.value);const payload={pin:state.settings.gasPin||state.settings.pin,createdAt:nowStamp(),tabs:{}};tabs.forEach(t=>payload.tabs[t]=sheetData(t));fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}).then(()=>toast('구글시트 전송 요청이 완료되었습니다')).catch(e=>alert('전송 실패: '+e))}
function eduFlatRows(){const out=[];(state.eduSchedules||[]).forEach(e=>{(e.sessions||[]).forEach(s=>{out.push({기관:e.org||'',프로그램:e.program||'',대상:e.target||'',상태:e.status,회차:s.no,날짜:s.date||'',시작:s.startTime||e.startTime||'',종료:s.endTime||e.endTime||'',메인강사:s.main||'',보조강사:s.subYn==='네'?(s.sub||''):'',인원:s.count||0,사용교구:s.equip||'',추가교구교재:s.extra||'',회차강사료:eduSessFee(e,s),시간당강사료:e.hourlyFee||0,교육장소:(e.orgInfo&&e.orgInfo.place)||'',식사제공:(e.orgInfo&&e.orgInfo.meal)||'',교통비제공:(e.orgInfo&&e.orgInfo.transport)||'',내용발췌:(s.content||'').slice(0,300)})})});return out}
function sheetData(tab){if(tab==='출강일정')return state.schedules;if(tab==='교육일정')return eduFlatRows();if(tab==='교구발송')return state.shipments;if(tab==='재고현황')return state.equipment;if(tab==='강사정보')return state.instructors;if(tab==='강사출강이력')return state.teacherHistory;return []}
function masterEditor(key,label){const items=state.masters[key]||[];return `<div class="field"><label>${esc(label)}</label><div class="mchips" id="mp_${key}">${items.map((v,i)=>`<span class="mchip">${esc(v)}<button onclick="removeMaster('${key}',${i})" title="삭제">✖</button></span>`).join('')||'<span class="muted">없음</span>'}</div><div class="addr-row"><input id="madd_${key}" placeholder="추가할 ${esc(label)}" onkeydown="if(event.key==='Enter')addMaster('${key}')"><button class="btn btn-navy mini" onclick="addMaster('${key}')">＋ 추가</button></div></div>`}
function addMaster(key){const el=$('madd_'+key);const v=(el?el.value:'').trim();if(!v)return toast('값을 입력하세요');state.masters[key]=state.masters[key]||[];if(state.masters[key].includes(v))return toast('이미 있는 항목입니다');state.masters[key].push(v);saveState();renderSettings();toast('추가되었습니다')}
function removeMaster(key,i){if(!confirm(`"${state.masters[key][i]}" 항목을 삭제할까요?`))return;state.masters[key].splice(i,1);saveState();renderSettings()}
function renderSettings(){setTitle('설정',`<button class="btn btn-ghost" onclick="backupAll()">전체 백업</button>`);$('app').innerHTML=`<div class="card"><h3>보안 · 연동 설정</h3><div class="grid g2">${field('관리자 PIN',`<input id="set_pin" value="${esc(state.settings.pin)}">`)}${field('Google Apps Script URL',`<input id="set_gas" value="${esc(state.settings.gasUrl)}">`)}${field('Google 전송 PIN',`<input id="set_gaspin" value="${esc(state.settings.gasPin)}">`)}</div><div class="toolbar"><button class="btn btn-navy" onclick="saveSettings()">설정 저장</button><button class="btn btn-ghost" onclick="showAppsScript()">Apps Script 코드 보기</button></div></div><div class="card"><h3>☁ 클라우드 동기화 (핸드폰 공유)</h3><p class="muted">PC에서 "클라우드 저장" 후 공유 링크를 핸드폰으로 보내면, 폰에서도 전체 데이터를 보고 수정할 수 있습니다(수정 후 폰에서도 ☁ 저장). 최초 1회 Apps Script 배포가 필요합니다 — "동기화 코드 보기"를 참고하세요.</p><div class="grid g12">${field('클라우드 동기화 URL (Apps Script 배포 주소)',`<input id="set_syncurl" value="${esc(state.settings.syncUrl||'')}" placeholder="https://script.google.com/macros/s/.../exec">`,'c12')}</div><div class="toolbar"><button class="btn btn-navy" onclick="state.settings.syncUrl=document.getElementById('set_syncurl').value.trim();saveState();toast('동기화 URL 저장됨')">URL 저장</button><button class="btn btn-gold" onclick="cloudSave()">☁ 클라우드 저장</button><button class="btn btn-ghost" onclick="cloudLoad(true)">☁ 불러오기</button><button class="btn btn-blue" onclick="copySyncLink()">📱 공유 링크 복사</button><button class="btn btn-ghost" onclick="showSyncScript()">동기화 코드 보기</button></div></div><div class="card"><h3>데이터 관리</h3><div class="toolbar"><button class="btn btn-ghost" onclick="backupAll()">전체 백업 다운로드</button><label class="btn btn-ghost">데이터 가져오기<input type="file" accept=".json" style="display:none" onchange="importBackup(event)"></label><button class="btn btn-ghost" onclick="backupLegacyDownload()">기존 데이터 백업 다운로드</button><button class="btn btn-gold" onclick="reMigrate()">기존 데이터 다시 변환</button><button class="btn btn-red" onclick="deleteLegacyKeys()">기존 키 삭제</button><button class="btn btn-red" onclick="resetAllData()">전체 초기화</button></div><p class="muted">※ "기존 데이터 다시 변환"은 재고 수량을 초기화하지 않고, 누락된 기존 항목만 안전하게 추가 병합합니다.</p></div><div class="card"><h3>목록 관리 (직접 추가·삭제)</h3><p class="muted">여기서 추가한 항목은 출강관리·물류 화면의 드롭다운에 바로 나타납니다. 드롭다운의 "＋ 직접 입력…"으로도 추가할 수 있습니다.</p><div class="grid g3">${masterEditor('grades','대상학년')}${masterEditor('themes','주제')}${masterEditor('periods','차시')}${masterEditor('companies','출강 업체')}${masterEditor('programs','프로그램명')}${masterEditor('couriers','택배사')}${masterEditor('accounts','입출금 통장')}${masterEditor('extras','추가교구·교재')}</div></div><div class="card"><h3>기존 체크리스트 보관함</h3>${state.checklist.legacy.length?table(['구분','항목'],state.checklist.legacy.map(x=>[esc(x.type),esc(x.text)])):'<div class="muted">보관된 기존 체크리스트가 없습니다. (활성 체크리스트에 병합됨)</div>'}</div>`}
function reMigrate(){if(!confirm('기존(구버전) 데이터를 다시 병합할까요?\n재고 수량은 유지되며, 누락된 강사·교구·학년·기록만 추가됩니다.'))return;migrateLegacy();toast('기존 데이터 병합 완료');render()}
function saveSettings(){state.settings.pin=$('set_pin').value.trim();state.settings.gasUrl=$('set_gas').value.trim();state.settings.gasPin=$('set_gaspin').value.trim();if($('set_syncurl'))state.settings.syncUrl=$('set_syncurl').value.trim();saveState();toast('설정이 저장되었습니다')}
function backupAll(){downloadJSON(state,'ENK_운영관리_백업_'+nowStamp().replace(/[-: ]/g,'')+'.json')}
function deleteLegacyKeys(){if(!confirm('기존(구버전) 데이터 키를 모두 삭제할까요?\n※ 되돌릴 수 없습니다. 먼저 전체/기존 백업을 권장합니다.'))return;Object.values(LEGACY_KEYS).forEach(k=>localStorage.removeItem(k));localStorage.removeItem(LEGACY_DONE_KEY);toast('기존 데이터 키를 삭제했습니다');render()}
function importBackup(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const obj=JSON.parse(r.result);if(confirm('현재 데이터를 가져온 백업으로 교체할까요?')){state=obj;ensureState();saveState();render()}}catch(err){alert('JSON 파일을 확인해 주세요.')}};r.readAsText(f)}
function resetAllData(){const text=prompt('전체 초기화를 실행하려면 "초기화"를 입력하세요.');if(text==='초기화'){state=defaultState();saveState();render();toast('초기화되었습니다')}}
function showAppsScript(){openModal(`<h3>Google Apps Script 코드</h3><p class="muted">아래 코드를 Apps Script에 붙여넣고 웹앱으로 배포한 뒤 URL을 설정에 입력하세요.</p><textarea style="min-height:360px" id="gasCode">${esc(APPS_SCRIPT_CODE)}</textarea><div class="modal-actions"><button class="btn btn-ghost" onclick="copyText(document.getElementById('gasCode').value)">코드 복사</button><button class="btn btn-navy" onclick="closeModal()">닫기</button></div>`)}
function exportCSV(type){const rows={schedules:state.schedules,shipments:state.shipments,equipment:state.equipment,instructors:state.instructors,orgs:state.orgs,history:state.teacherHistory}[type]||[];const text=jsonToCSV(rows);downloadText('\ufeff'+text,`ENK_${type}_${today()}.csv`,'text/csv;charset=utf-8')}
function jsonToCSV(rows){if(!rows.length)return '';const flat=rows.map(r=>flatten(r));const keys=[...new Set(flat.flatMap(o=>Object.keys(o)))];return keys.join(',')+'\n'+flat.map(o=>keys.map(k=>`"${String(o[k]??'').replace(/"/g,'""')}"`).join(',')).join('\n')}
function flatten(obj,prefix='',out={}){Object.entries(obj||{}).forEach(([k,v])=>{const key=prefix?prefix+'.'+k:k;if(v&&typeof v==='object'&&!Array.isArray(v))flatten(v,key,out);else out[key]=Array.isArray(v)?JSON.stringify(v):v});return out}
function parseCSVLine(line){const out=[];let cur='',q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(q){if(ch==='"'){if(line[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}else{if(ch==='"')q=true;else if(ch===',')  {out.push(cur);cur=''}else cur+=ch}}out.push(cur);return out.map(x=>x.trim())}
function importCSV(event,type){const f=event.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{let content=r.result;if(content.charCodeAt(0)===0xFEFF)content=content.slice(1);const lines=content.split(/\r?\n/).filter(l=>l.trim().length);if(!lines.length)return;const head=parseCSVLine(lines.shift());lines.forEach(line=>{const vals=parseCSVLine(line);const o={};head.forEach((h,i)=>o[h]=vals[i]||'');if(type==='instructors'){const obj={id:uid('t'),name:o['강사명']||'',phone:o['연락처']||'',email:o['메일주소']||'',address:o['주소']||'',detailAddress:o['상세주소']||'',zip:o['우편번호']||'',memo:o['메모']||'',org:o['소속']||''};if(obj.name)handleDuplicate(state.instructors,obj,'name')}if(type==='orgs'){const obj={id:uid('org'),name:o['기관명']||'',manager:o['담당자명']||'',phone:o['연락처']||'',address:o['주소']||'',memo:o['메모']||'',parking:'',entry:'',daily:[]};if(obj.name)handleDuplicate(state.orgs,obj,'name')}});saveState();render();toast('CSV 가져오기가 완료되었습니다')};r.readAsText(f,'utf-8')}
function handleDuplicate(arr,obj,key){const idx=arr.findIndex(x=>x[key]===obj[key]);if(idx<0)arr.push(obj);else{const sel=prompt(`${obj[key]} 중복 항목이 있습니다. 1=덮어쓰기, 2=건너뛰기, 3=새 항목 추가`,'2');if(sel==='1')arr[idx]={...arr[idx],...obj,id:arr[idx].id};if(sel==='3')arr.push(obj)}}
function doPrint(html){$('printArea').innerHTML=html;document.body.classList.add('printing');const done=()=>{document.body.classList.remove('printing');$('printArea').innerHTML=''};window.onafterprint=done;setTimeout(()=>{window.print();setTimeout(done,800)},60)}
function pkv(pairs){return `<table class="p-kv">${pairs.map(([k,v])=>`<tr><td class="k">${esc(k)}</td><td>${esc(v||'-')}</td></tr>`).join('')}</table>`}

<div class="p-sec">기본 정보</div>${pkv([['지역',s.region],['차시',s.period],['수업시간',time],['대상학년',s.grade],['출강 업체',s.company],['투입 강사',s.roster]])}
<div class="p-sec">기관 상세</div>${pkv([['기관 주소',o.address],['담당자',`${o.manager||''} ${o.phone||''}`],['대기실',o.waitingRoom],['도착시간',o.arrivalTime],['출입 방법',o.entry],['주차 안내',o.parking]])}
<div class="p-sec">반 구성 · 강사 · 교구 배정</div><table class="p-tbl"><thead><tr><th>반</th><th>학년</th><th>메인</th><th>보조</th><th>교구</th><th>주제</th><th>연구용발송</th><th>현수막</th><th>교안</th><th>교육일지</th><th>인원</th></tr></thead><tbody>${clsRows}</tbody></table>
<div class="p-sec">출강 체크리스트</div><div class="p-chk">${chk}</div>
<div class="p-foot">출력: ${nowStamp()} · ENK LAB 운영관리 시스템</div></div>`;doPrint(html)}
function printShipment(id){collectShipmentBasic(id);const sh=state.shipments.find(x=>x.id===id);if(!sh)return;const itemRows=(sh.items||[]).map(it=>`<tr><td>${esc(it.classLabel)}</td><td>${esc(it.teacher)}</td><td>${esc(it.equip)}</td><td>1</td><td>${it.history&&!it.reapproved?'지급이력 있음':(it.infoMissing?'강사정보 미완성':'발송 필요')}</td></tr>`).join('')||'<tr><td colspan="5">항목 없음</td></tr>';const sum=shipmentSummary(sh);const sumRows=sum.length?sum.map(x=>`<tr><td>${esc(x.teacher)}</td><td>${esc(x.equip)}</td><td>${x.qty}</td><td>${getStock(x.equip,x.stockType)}</td></tr>`).join(''):'<tr><td colspan="4">실제 발송 대상 없음</td></tr>';const direct=['직접전달','현장전달'].includes(sh.courier);const basic=[['신청서명',sh.name],['택배사',sh.courier],['송장번호',sh.invoice],['발송일',fmtDate(sh.shipDate)]];if(direct)basic.push(['전달자/장소',`${sh.direct?.person||''} / ${sh.direct?.place||''}`],['전달일',fmtDate(sh.direct?.date||'')]);const html=`<div class="p-doc"><div class="p-head"><div class="p-title">[ENK LAB] 교구 발송 신청서</div><div class="p-meta">${esc(sh.org||'')} · ${fmtDate(sh.date)||'날짜 미정'} · 상태 ${esc(sh.status||'')}</div></div>
<div class="p-sec">발송 기본정보</div>${pkv(basic)}

<div class="p-foot">출력: ${nowStamp()} · ENK LAB 운영관리 시스템</div></div>`;doPrint(html)}

const APPS_SCRIPT_CODE = `function doPost(e){\n  var payload = JSON.parse(e.postData.contents || '{}');\n  var ss = SpreadsheetApp.getActiveSpreadsheet();\n  var now = new Date();\n  var stamp = Utilities.formatDate(now, Session.getScriptTimeZone(), 'yyyy-MM-dd_HHmm');\n  Object.keys(payload.tabs || {}).forEach(function(tab){\n    var sheetName = stamp + '_' + tab;\n    var sheet = ss.insertSheet(sheetName);\n    var rows = payload.tabs[tab] || [];\n    if(!rows.length){ sheet.getRange(1,1).setValue('데이터 없음'); return; }\n    var flat = rows.map(flatten);\n    var keys = [];\n    flat.forEach(function(o){ Object.keys(o).forEach(function(k){ if(keys.indexOf(k)<0) keys.push(k); }); });\n    sheet.getRange(1,1,1,keys.length).setValues([keys]);\n    sheet.getRange(2,1,flat.length,keys.length).setValues(flat.map(function(o){ return keys.map(function(k){ return o[k] || ''; }); }));\n  });\n  return ContentService.createTextOutput(JSON.stringify({ok:true})).setMimeType(ContentService.MimeType.JSON);\n}\nfunction flatten(obj,prefix,out){\n  out = out || {}; prefix = prefix || '';\n  Object.keys(obj || {}).forEach(function(k){\n    var v = obj[k]; var key = prefix ? prefix + '.' + k : k;\n    if(v && typeof v === 'object' && !Array.isArray(v)){ flatten(v,key,out); }\n    else { out[key] = Array.isArray(v) ? JSON.stringify(v) : v; }\n  });\n  return out;\n}`;

function completeFirstSetup(){const p=$('first_pin').value.trim();if(!p)return toast('비밀번호를 입력하세요');state.settings.pin=p;saveState();closeModal();if(detectLegacy()&&!localStorage.getItem(LEGACY_DONE_KEY)){openModal(`<h3>기존 데이터가 발견되었습니다</h3><p class="muted">업데이트 전 자동 백업 후 새 시스템으로 변환합니다. 기존 localStorage 키는 삭제하지 않고 그대로 보존됩니다.</p><div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal();render()">나중에 하기</button><button class="btn btn-navy" onclick="backupLegacyDownload();migrateLegacy();closeModal();render()">백업 후 변환 시작</button></div>`)}else render()}
const SYNC_SCRIPT_CODE = `function doPost(e){\n  var p = JSON.parse(e.postData.contents || '{}');\n  if(p.action === 'save'){ getFile(p.key).setContent(p.data || '{}'); return out({ok:true}); }\n  if(p.action === 'load'){ return out({ok:true, data:getFile(p.key).getBlob().getDataAsString()}); }\n  return out({ok:false});\n}\nfunction doGet(e){\n  return out({ok:true, data:getFile(e.parameter.key).getBlob().getDataAsString()});\n}\nfunction getFile(key){\n  key = String(key || 'default').replace(/[^\\w-]/g, '');\n  var name = 'ENK_SYNC_' + key + '.json';\n  var it = DriveApp.getFilesByName(name);\n  if(it.hasNext()) return it.next();\n  return DriveApp.createFile(name, '{}');\n}\nfunction out(o){\n  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);\n}`;
function ensureSyncKey(){if(!state.settings.syncKey){state.settings.syncKey=uid('s').replace(/[^A-Za-z0-9_-]/g,'');saveState()}return state.settings.syncKey}
function cloudSave(){const url=(state.settings.syncUrl||'').trim();if(!url){toast('설정에서 클라우드 동기화 URL을 먼저 입력하세요');go('settings');return}const key=ensureSyncKey();toast('☁ 저장 중…');fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'save',key:key,data:JSON.stringify(state)})}).then(r=>r.json()).then(j=>{if(j&&j.ok)toast('☁ 클라우드에 저장되었습니다');else alert('클라우드 저장 실패: 스크립트 응답을 확인하세요')}).catch(e=>alert('클라우드 저장 실패: '+e+'\n(설정의 동기화 URL과 배포 상태를 확인하세요)'))}
function cloudLoad(notify){const url=(state.settings.syncUrl||'').trim();if(!url){if(notify){toast('설정에서 클라우드 동기화 URL을 먼저 입력하세요');go('settings')}return Promise.reject('no-url')}const key=ensureSyncKey();if(notify)toast('☁ 불러오는 중…');return fetch(url+(url.indexOf('?')<0?'?':'&')+'action=load&key='+encodeURIComponent(key)).then(r=>r.json()).then(j=>{if(j&&j.ok&&j.data){let obj=null;try{obj=JSON.parse(j.data)}catch(e){}if(obj&&typeof obj==='object'&&obj.schedules!==undefined){state=obj;ensureState();saveState();try{autoCompleteSweep();peAlertCheck()}catch(e){}render();if(notify)toast('☁ 클라우드 데이터를 불러왔습니다')}else if(notify)toast('클라우드에 저장된 데이터가 아직 없습니다')}else if(notify)toast('클라우드에 저장된 데이터가 아직 없습니다')}).catch(e=>{if(notify)alert('불러오기 실패: '+e);throw e})}
function copySyncLink(){const url=(state.settings.syncUrl||'').trim();if(!url)return toast('클라우드 동기화 URL을 먼저 입력·저장하세요');const key=ensureSyncKey();const base=window.location.origin&&window.location.origin!=='null'?window.location.origin+window.location.pathname:'';if(!base)return alert('공유 링크는 깃허브 페이지 주소로 열었을 때 만들 수 있습니다.');const link=base+'#sync='+encodeURIComponent(url)+'&k='+encodeURIComponent(key);copyText(link);toast('📱 핸드폰 공유 링크가 복사되었습니다')}

function shareSchedule(id){collectScheduleForm(id);const s=state.schedules.find(x=>x.id===id);if(!s)return;const base=window.location.origin&&window.location.origin!=='null'?window.location.origin+window.location.pathname:'';if(!base)return alert('공유 링크는 깃허브 페이지 주소로 열었을 때 만들 수 있습니다.');const o={org:s.org,date:s.date,program:s.program,period:s.period,startTime:s.startTime,endTime:s.endTime,grade:s.grade,roster:s.roster,orgInfo:s.orgInfo||{},classes:(s.classes||[]).map(c=>({label:c.label,grade:c.grade,main:c.main,sub:c.sub,equip:c.equip,count:c.count,theme:c.theme,equipSend:c.equipSend}))};const b64=btoa(unescape(encodeURIComponent(JSON.stringify(o))));copyText(base+'#view='+b64);toast('🔗 출강 공유 링크가 복사되었습니다 (읽기전용)')}

/* ===== 센터 일정 ===== */
function csHours(cs){const tm=t=>{const[a,b]=String(t||'').split(':').map(Number);return isNaN(a)?0:a*60+(b||0)};const m=tm(cs.endTime)-tm(cs.startTime);return m>0?m/60:0}
function occursOn(cs,ds){if(!cs.startDate||ds<cs.startDate)return false;if(cs.endDate&&ds>cs.endDate)return false;if((cs.skips||[]).some(x=>(typeof x==='string'?x:x.d)===ds))return false;const d=new Date(ds+'T00:00:00');if(cs.pattern==='매월'){return Number(ds.slice(8,10))===Number(cs.startDate.slice(8,10))}const wd=d.getDay();if(!(cs.weekdays||[]).includes(wd))return false;if(cs.pattern==='격주'){const monday=x=>{const t=new Date(x+'T00:00:00');const off=(t.getDay()+6)%7;t.setDate(t.getDate()-off);return t};const w=Math.round((monday(ds)-monday(cs.startDate))/(7*86400000));return w%2===0}return true}
function centerOn(ds){return (state.centerSchedules||[]).filter(c=>occursOn(c,ds))}
function monthDaysOf(ym){const[y,m]=ym.split('-').map(Number);const n=new Date(y,m,0).getDate();const out=[];for(let d=1;d<=n;d++)out.push(ym+'-'+String(d).padStart(2,'0'));return out}
function instRates(name){const t=(state.instructors||[]).find(x=>x.name===name)||{};return {first:Number(t.centerFirst||0),extra:Number(t.centerExtra||0)}}
function centerDayPay(name,ds){const list=(state.centerSchedules||[]).filter(c=>c.teacher===name&&occursOn(c,ds));const H=list.reduce((a,c)=>a+csHours(c),0);if(H<=0)return {H:0,pay:0,list};const r=instRates(name);return {H,pay:Math.round(r.first+Math.max(0,H-1.5)*r.extra),list}}
function centerMonthRows(ym){const names=[...new Set((state.centerSchedules||[]).map(c=>c.teacher).filter(Boolean))];const out=[];names.forEach(n=>{let tot=0;const rows=[];monthDaysOf(ym).forEach(ds=>{const d=centerDayPay(n,ds);if(d.H>0){rows.push({date:ds,names:d.list.map(c=>c.name).join(', '),H:d.H,pay:d.pay});tot+=d.pay}});if(rows.length)out.push({teacher:n,rows,tot})});return out}
function centerFeeExists(ym,name){return (state.fees||[]).some(f=>f.centerMonth===ym&&f.teacher===name)}

function renderCenter(){setTitle('출강관리 · 센터일정',`<button class="btn btn-navy" onclick="openCenterModal()">＋ 센터 수업 등록</button>`);const rows=(state.centerSchedules||[]).map(c=>[esc(c.name),esc(c.teacher),esc(c.pattern||'매주'),c.pattern==='매월'?('매월 '+Number((c.startDate||'').slice(8,10))+'일'):(c.weekdays||[]).map(w=>'일월화수목금토'[w]).join(','),esc((c.startTime||'')+'~'+(c.endTime||''))+` (${csHours(c)}h)`,String(c.count||0),fmtDate(c.startDate)+' ~ '+(c.endDate?fmtDate(c.endDate):'계속'),`<button class="btn btn-ghost mini" onclick="openCenterModal('${c.id}')">수정</button> <button class="btn btn-ghost mini" style="color:var(--warn)" onclick="delCenter('${c.id}')">삭제</button>`]);$('app').innerHTML=schedTabs()+`<div class="card"><h3>🏫 센터 수업 (반복 일정)</h3>${rows.length?table(['수업명','강사','패턴','요일/일자','시간','인원','기간','관리'],rows):'<div class="muted">＋ 센터 수업 등록으로 반복 수업을 추가하세요.</div>'}<p class="muted">강사료: 강사별 <b>첫 타임(1.5T) 단가 + 추가 시간당 단가</b>는 강사관리에서 입력합니다. 같은 날 여러 수업이면 시간을 합산해 하루 단위로 계산됩니다. 정산은 강사료 정산 → 📅 월별 내역에서 월 일괄 등록하세요.</p></div>`}
function openCenterModal(id){csEditId=id||null;const c=id?(state.centerSchedules||[]).find(x=>x.id===id):{name:'',teacher:'',pattern:'매주',weekdays:[],startTime:'16:00',endTime:'17:30',count:0,startDate:today(),endDate:'',skips:[]};if(!c)return;openModal(`<h3>${id?'센터 수업 수정':'＋ 센터 수업 등록'}</h3><div class="grid g12">${field('수업명(반명)',`<input id="cs_name" value="${esc(c.name)}">`,'c4')}${field('담당 강사',`<input id="cs_teacher" value="${esc(c.teacher)}" list="teacherList">`,'c4')}${field('수강 인원',`<input type="number" id="cs_cnt" value="${c.count||0}">`,'c4')}${field('반복 패턴',`<select id="cs_pattern"><option${c.pattern==='매주'?' selected':''}>매주</option><option${c.pattern==='격주'?' selected':''}>격주</option><option${c.pattern==='매월'?' selected':''}>매월</option></select>`,'c4')}${field('요일(매주·격주)',`<div style="display:flex;gap:7px;padding-top:8px">${'일월화수목금토'.split('').map((n,i)=>`<label style="font-weight:700"><input type="checkbox" id="cs_wd_${i}"${(c.weekdays||[]).includes(i)?' checked':''}> ${n}</label>`).join('')}</div>`,'c8')}${field('시작 시간',`<input type="time" id="cs_st" value="${esc(c.startTime)}">`,'c3')}${field('종료 시간',`<input type="time" id="cs_en" value="${esc(c.endTime)}">`,'c3')}${field('시작일',`<input type="date" id="cs_sd" value="${esc(c.startDate)}">`,'c3')}${field('종료일(비우면 계속)',`<input type="date" id="cs_ed" value="${esc(c.endDate||'')}">`,'c3')}${field('휴강일 관리 (사유 입력)',`<div style="display:flex;gap:6px;align-items:center"><input type="date" id="cs_skip" style="max-width:170px"><input id="cs_skipwhy" placeholder="휴강 사유 (예: 학교 행사)" style="max-width:220px"><button class="btn btn-ghost mini" onclick="addCsSkip()">＋ 휴강 추가</button></div><div id="cs_skiplist" style="margin-top:6px">${(c.skips||[]).map(x=>{const o=typeof x==='string'?{d:x,why:''}:x;return `<span class="pill yellow">${fmtDate(o.d)}${o.why?' · '+esc(o.why):''} <b style="cursor:pointer" onclick="delCsSkip('${o.d}')">✕</b></span> `}).join('')}</div>`,'c12')}</div><div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">취소</button><button class="btn btn-navy" onclick="saveCenter()">저장</button></div>`,true);window._csSkips=(c.skips||[]).map(x=>typeof x==='string'?{d:x,why:''}:x)}
function addCsSkip(){const v=($('cs_skip')||{}).value;if(!v)return;const why=(($('cs_skipwhy')||{}).value||'').trim();if(!window._csSkips.some(x=>x.d===v))window._csSkips.push({d:v,why});$('cs_skiplist').innerHTML=window._csSkips.map(x=>`<span class="pill yellow">${fmtDate(x.d)}${x.why?' · '+esc(x.why):''} <b style="cursor:pointer" onclick="delCsSkip('${x.d}')">✕</b></span> `).join('')}

function saveCenter(){const g=x=>{const el=$(x);return el?el.value:''};const wd=[];for(let i=0;i<7;i++){const el=$('cs_wd_'+i);if(el&&el.checked)wd.push(i)}const c={id:csEditId||uid('cs'),name:g('cs_name').trim(),teacher:g('cs_teacher').trim(),count:Number(g('cs_cnt')||0),pattern:g('cs_pattern')||'매주',weekdays:wd,startTime:g('cs_st'),endTime:g('cs_en'),startDate:g('cs_sd'),endDate:g('cs_ed'),skips:(window._csSkips||[]).slice()};if(!c.name)return toast('수업명을 입력하세요');if(!c.teacher)return toast('담당 강사를 입력하세요');if(!c.startDate)return toast('시작일을 입력하세요');if(c.pattern!=='매월'&&!wd.length)return toast('요일을 선택하세요');const i=(state.centerSchedules||[]).findIndex(x=>x.id===c.id);if(i>=0)state.centerSchedules[i]=c;else state.centerSchedules.unshift(c);saveState();closeModal();toast('센터 수업이 저장되었습니다');render()}

function renderFeeMonth(){if(!feeMonth)feeMonth=curMonth();setTitle('강사료 정산 · 월별 내역',`<button class="btn btn-ghost" onclick="exportMonthExcel()">📊 엑셀 내보내기</button>`);const ym=feeMonth;const regs=(state.fees||[]).filter(f=>(f.centerMonth||f.date||'').slice(0,7)===ym).sort((a,b)=>(a.teacher||'').localeCompare(b.teacher||''));const regRows=regs.map(f=>[esc(f.teacher),f.centerMonth?'<span class="pill" style="background:#0E7490;color:#fff;border:0">센터</span>':f.eduId?'<span class="pill" style="background:#7C3AED;color:#fff;border:0">교육</span>':'<span class="pill" style="background:#0F2A44;color:#fff;border:0">출강</span>',fmtDate(f.date),esc(f.org),won(f.gross),won(feeNetF(f)),feeDocsOk(f)?'<span class="pill green">지급가능</span>':'<span class="pill yellow">서류대기</span>']);const regTot=regs.reduce((a,f)=>a+feeNetF(f),0);const cm=centerMonthRows(ym);const cBlocks=cm.map(t=>{const r=instRates(t.teacher);const done=centerFeeExists(ym,t.teacher);return `<div style="border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px"><b>${esc(t.teacher)}</b> <span class="muted">첫타임 ${won(r.first)} · 추가 시간당 ${won(r.extra)}${(!r.first&&!r.extra)?' — ⚠ 강사관리에서 센터 단가를 입력하세요':''}</span> ${done?'<span class="pill green">이번 달 등록됨</span>':''}${table(['날짜','수업','시간(h)','일일 금액'],t.rows.map(x=>[fmtDate(x.date),esc(x.names),String(x.H),won(x.pay)]))}<div style="text-align:right;font-weight:900;color:var(--navy)">월 합계(세전) ${won(t.tot)} · 실지급 ${won(feeNet(t.tot))}</div></div>`}).join('');$('app').innerHTML=feeTabs()+`<div class="toolbar"><label style="font-weight:800">조회 월 <input type="month" value="${ym}" onchange="feeMonth=this.value;render()"></label></div><div class="card"><h3>💵 ${Number(ym.slice(5))}월 등록된 강사료 (출강·교육·센터)</h3>${regRows.length?table(['강사','구분','날짜','기관/수업','총액(세전)','실지급','상태'],regRows)+`<div style="text-align:right;font-weight:900;color:var(--navy)">월 실지급 합계 ${won(regTot)}</div>`:'<div class="muted">이 달에 등록된 강사료가 없습니다.</div>'}</div><div class="card"><h3>🏫 센터 수업 계산 내역 (${Number(ym.slice(5))}월)</h3>${cBlocks||'<div class="muted">이 달 발생한 센터 수업이 없습니다.</div>'}${cm.length?`<div class="toolbar"><button class="btn btn-navy" onclick="saveCenterMonthFees()">＋ ${Number(ym.slice(5))}월 센터 강사료 일괄 등록</button></div><p class="muted">강사별 월 합계가 강사료 발생 내역에 [센터] 건으로 등록됩니다(3.3% 공제 동일 적용 · 이미 등록된 강사는 건너뜀).</p>`:''}</div><div class="card"><h3>💳 강사별 잔액 (전월분 미지급 · 당월분은 지급예정)</h3>${(function(){const names=[...new Set([...(state.fees||[]).map(f=>f.teacher),...(state.feePayments||[]).map(p=>p.teacher)])].filter(Boolean).sort((a,b)=>a.localeCompare(b,'ko'));if(!names.length)return '<div class="muted">내역이 없습니다.</div>';return table(['강사','누적 발생(실지급)','누적 지급','미지급 잔액(전월분까지)','당월 발생(지급예정·클릭=세부)'],names.map(n=>{const sp=feeSplit(n);const g=sp.g,p=sp.p,b=sp.dueNow;return [esc(n)+(isTax10(n)?' <span style="color:var(--warn);font-weight:900;font-size:11px">10%</span>':''),won(g),won(p),`<b style="color:${b>0?'var(--warn)':'var(--ok)'};cursor:pointer;text-decoration:underline" onclick="openTeacherFeeDetail('${escAttr(n)}')">${won(b)}</b>`,`<b style="color:#1D4ED8;cursor:pointer" onclick="openTeacherFeeDetail('${escAttr(n)}')">${won(sp.curPend)}</b><div class="muted" style="font-size:10.5px">다음달 20일 지급 예정</div>`]}))})()}</div>`}
function openTeacherFeeDetail(name){const fees=(state.fees||[]).filter(f=>f.teacher===name).sort((a,b)=>(b.date||'').localeCompare(a.date||''));const pays=(state.feePayments||[]).filter(p=>p.teacher===name).sort((a,b)=>(b.date||'').localeCompare(a.date||''));const g=teacherFeeNet(name),p=teacherFeePaid(name);const mset=[...new Set([...fees.map(f=>(f.date||'').slice(0,7)),...pays.map(x=>x.forMonth||'')])].filter(Boolean).sort().reverse();const pastPay=pays.filter(x=>!x.forMonth).reduce((a,x)=>a+Number(x.amount||0),0);const mRows=mset.map(ym=>{const fg=fees.filter(f=>(f.date||'').slice(0,7)===ym).reduce((a,f)=>a+feeNetF(f),0);const pp=pays.filter(x=>x.forMonth===ym).reduce((a,x)=>a+Number(x.amount||0),0);const isCur=ym===curMonth();return [`<b>${Number(ym.slice(5,7))}월</b> <span class="muted" style="font-size:10.5px">${ym.slice(0,4)}</span>${isCur?' <span class="pill" style="background:#1D4ED8;color:#fff;border:0;font-size:10px">지급예정</span>':''}`,won(fg),won(pp),`<b style="color:${isCur?'#1D4ED8':(fg-pp>0?'var(--warn)':'var(--ok)')}">${won(fg-pp)}</b>${isCur?'<div class="muted" style="font-size:10px">다음달 20일 지급</div>':''}`]});openModal(`<h3>💳 ${esc(name)} 세부내역${isTax10(name)?' <span style="color:var(--warn);font-size:13px">⚠ 10% 차감 대상</span>':''}</h3><div class="grid-sub">📅 월별 요약</div>${mRows.length?table(['월','발생(실지급)','지급(귀속)','월 잔액'],mRows):'<div class="muted">없음</div>'}${pastPay?`<div class="muted" style="margin-top:4px">※ 이전 방식 지급(귀속월 없음) ${won(pastPay)} — 누적 잔액에만 반영됩니다.</div>`:''}<div class="grid-sub">발생 (실지급 기준 누적 ${won(g)})</div>${fees.length?(function(){let pm='';return table(['월','날짜','구분','기관/수업','총액','실지급','상태'],fees.map(f=>{const ym=(f.date||'').slice(0,7);const mc=ym&&ym!==pm?(pm=ym,`<b>${Number(ym.slice(5,7))}월</b>`):'';return [mc,fmtDate(f.date),f.centerMonth?'센터':f.eduId?'교육':'출강',esc(f.org||''),won(f.gross),won(feeNetF(f)),feeDocsOk(f)?'지급가능':'서류대기']}))})():'<div class="muted">없음</div>'}<div class="grid-sub">지급 (누적 ${won(p)})</div>${pays.length?table function saveCenterMonthFees(){const ym=feeMonth||curMonth();const cm=centerMonthRows(ym);let n=0,skip=0;cm.forEach(t=>{if(centerFeeExists(ym,t.teacher)){skip++;return}if(t.tot<=0)return;const last=t.rows[t.rows.length-1];state.fees.unshift({id:uid('fee'),date:last?last.date:ym+'-01',org:'센터 수업 ('+Number(ym.slice(5))+'월)',teacher:t.teacher,base:t.tot,km:0,transport:0,incentive:0,gross:t.tot,centerMonth:ym,journal:false,invoice:false,createdAt:nowStamp()});n++});saveState();toast(`센터 강사료 ${n}건 등록${skip?` · ${skip}건은 이미 등록되어 건너뜀`:''}`);render()}

function ttTargetList(){const a=state.schedules.filter(s=>s.date||s.org).map(s=>({v:'s:'+s.id,t:(fmtDate(s.date)||'날짜미정')+' · '+(s.org||'기관미정')+' [출강]'}));const b=[];(state.eduSchedules||[]).forEach(e=>(e.sessions||[]).forEach(x=>{if(x.date||e.org)b.push({v:'e:'+e.id+':'+x.sid,t:(fmtDate(x.date)||'날짜미정')+' · '+(e.org||'기관미정')+' '+x.no+'회차 [교육]'})}));return a.concat(b).sort((x,y)=>y.t.localeCompare(x.t))}

function ttForm(tt){return `<div class="grid g12" style="margin-top:8px">${field('제목',`<input id="tt_title" value="${esc(tt.title)}">`,'c6')}${field('학교',`<input id="tt_school" value="${esc(tt.school)}">`,'c3')}${field('날짜',`<input type="date" id="tt_date" value="${esc(tt.date)}">`,'c3')}${field('대상',`<input id="tt_target" value="${esc(tt.target||'')}">`,'c4')}${field('반별 강사 배정 (강사관리에서 선택 · 보조 직접 입력)',`<div>${(tt.assign||[]).map((a,i)=>`<div style="display:flex;gap:6px;margin-bottom:4px;align-items:center"><input id="tt_cls_${i}" value="${esc(a.cls)}" style="max-width:110px">${selectHtml('tt_main_'+i,state.instructors.map(t=>t.name),a.main)}<input id="tt_sub_${i}" value="${esc(a.sub||'')}" placeholder="보조(선택)" style="max-width:130px"></div>`).join('')||'<span class="muted">일정 선택 시 반 구성이 자동 생성됩니다</span>'}</div>`,'c8')}${field('비고 (기본 문구 수정 가능)',`<textarea id="tt_note" style="min-height:110px">${esc(tt.note??TT_NOTE)}</textarea>`,'c12')}</div><div class="grid-sub">교시 구성</div>${tt.periods.map((p,i)=>`<div class="grid g12" style="margin-bottom:5px"><div class="field c2"><label>${i+1}교시 시간</label><input id="tt_time_${i}" value="${esc(p.time||'')}" placeholder="09:00~09:45"></div><div class="field c3"><label>주제</label><input id="tt_t_${i}" value="${esc(p.title||'')}"></div><div class="field c4"><label>세부내용</label><input id="tt_d_${i}" value="${esc(p.detail||'')}"></div><div class="field c2"><label>결과물</label><input id="tt_r_${i}" value="${esc(p.result||'')}"></div><div class="field c1" style="grid-column:span 1"><label>&nbsp;</label><button class="btn btn-ghost mini" onclick="ttDelRow(${i})">✖</button></div></div>`).join('')}<div class="toolbar"><button class="btn btn-ghost mini" onclick="ttAddRow()">＋ 교시 추가</button></div>`}
function ttCollect(){const g=ttGet(ttSel);if(!g)return null;const n=(id,d)=>{const el=$(id);return el?el.value:d};const tt={title:n('tt_title','ENK LAB 교육 시간표'),school:n('tt_school',''),date:n('tt_date',''),target:n('tt_target',''),roster:'',note:n('tt_note',TT_NOTE),assign:[],periods:[]};let ai=0;while($('tt_cls_'+ai)){tt.assign.push({cls:$('tt_cls_'+ai).value,main:($('tt_main_'+ai)||{}).value||'',sub:($('tt_sub_'+ai)||{}).value||''});ai++}tt.roster=tt.assign.map(a=>a.cls+' : '+a.main+(a.sub?'('+a.sub+')':'')).join('  ');let i=0;while($('tt_time_'+i)){tt.periods.push({time:$('tt_time_'+i).value,title:$('tt_t_'+i).value,detail:$('tt_d_'+i).value,result:$('tt_r_'+i).value});i++}return tt}
function ttSave(){const g=ttGet(ttSel);if(!g)return;const tt=ttCollect();g.mk(tt);saveState();toast('시간표가 저장되었습니다');render()}
function ttAddRow(){const g=ttGet(ttSel);if(!g)return;const tt=ttCollect();tt.periods.push({time:'',title:'',detail:'',result:''});g.mk(tt);render()}
function ttDelRow(i){const g=ttGet(ttSel);if(!g)return;const tt=ttCollect();tt.periods.splice(i,1);g.mk(tt);render()}
function ttApplyTpl(){const g=ttGet(ttSel);if(!g)return;const t=state.ttTemplates[Number(($('tt_tpl')||{}).value||0)];if(!t)return;const tt=ttCollect();tt.periods=JSON.parse(JSON.stringify(t.periods));g.mk(tt);saveState();render()}
function ttSaveTpl(){const tt=ttCollect();if(!tt)return;const name=prompt('템플릿 이름',tt.title||'새 템플릿');if(!name)return;state.ttTemplates.push({name,periods:tt.periods});saveState();toast('템플릿으로 저장되었습니다');render()}
function ttPreviewHtml(tt){const rows=(tt.periods||[]).map((p,i)=>`<tr><td style="text-align:center;font-weight:800">${i+1}교시</td><td style="text-align:center">${esc(p.time||'')}</td><td style="font-weight:800">${esc(p.title||'')}</td><td>${esc(p.detail||'')}</td><td>${esc(p.result||'')}</td></tr>`).join('');return `<div id="ttDoc" contenteditable="true" style="max-width:760px;border:1px solid var(--line);border-radius:8px;padding:18px;background:#fff"><div style="text-align:center;font-size:20px;font-weight:900;color:var(--navy);border-bottom:3px solid var(--navy);padding-bottom:8px">${esc(tt.title)}</div><div style="display:flex;gap:16px;flex-wrap:wrap;margin:10px 0;font-weight:700">🏫 ${esc(tt.school)} &nbsp; 📅 ${fmtDate(tt.date)||''} &nbsp; 🎯 ${esc(tt.target||'')}</div><div style="margin-bottom:10px;font-weight:700">👩‍🏫 ${esc(tt.roster||'')}</div>${tt.note?`<div style="background:#FFF9DB;border:1px solid #EBDf9E;border-radius:7px;padding:9px 11px;margin-bottom:10px;font-size:12.5px;line-height:1.65;white-space:pre-wrap"><b>📌 비고</b>\n${esc(tt.note)}</div>`:''}<table style="width:100%;border-collapse:collapse" border="1"><thead><tr style="background:#0F2A44;color:#fff"><th style="padding:7px">교시</th><th>시간</th><th>주제</th><th>세부내용</th><th>결과물</th></tr></thead><tbody>${rows}</tbody></table><div style="margin-top:10px;color:#5B6B7B;font-size:12.5px">ENK LAB AI Career Academy</div></div>`}
function ttPrint(){const el=$('ttDoc');if(!el)return;doPrint(`<div class="p-doc">${el.innerHTML}</div>`)}
function ttPng(){const el=$('ttDoc');if(!el)return;const go=()=>{window.html2canvas(el,{scale:2}).then(cv=>{const a=document.createElement('a');a.download=`시간표_${($('tt_school')||{}).value||''}_${($('tt_date')||{}).value||''}.png`;a.href=cv.toDataURL('image/png');a.click()})};if(window.html2canvas)return go();const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';sc.onload=go;sc.onerror=()=>alert('PNG 저장은 인터넷 연결이 필요합니다. 대신 [인쇄/PDF]를 사용하세요.');document.head.appendChild(sc)}

let rpSel='';const _rp={},_sv={},_fb={};
function rpGet(){return state.schedules.find(x=>x.id===rpSel)}
function rpEnsure(s){if(!s.report)s.report={purpose:'',summary:'',classes:(s.classes||[]).map((c,i)=>({name:c.label||(i+1)+'반',teacher:c.main||'',count:c.count||0,content:'',activity:'',feel:''}))};return s.report}
function rpAddClass(){const s=rpGet();if(!s)return;rpCollect();s.report.classes.push({name:(s.report.classes.length+1)+'반',teacher:'',count:0,content:'',activity:'',feel:''});saveState();render()}
function rpDelClass(i){const s=rpGet();if(!s)return;if(!confirm('이 반 섹션을 삭제할까요?'))return;rpCollect();s.report.classes.splice(i,1);delete _rp[i];delete _sv[i];delete _fb[i];saveState();render()}
function dedupMerge(oldT,addT){const split=t=>String(t||'').replace(/\r/g,'').split(/(?<=다\.)\s+|\n+/).map(x=>x.trim()).filter(Boolean);const seen=new Set(),out=[];split(oldT).concat(split(addT)).forEach(x=>{const k=x.replace(/\s+/g,'');if(!seen.has(k)){seen.add(k);out.push(x)}});return out.join('\n')}
function rpPaste(i,kind){const v=prompt('교육일지에서 복사한 내용을 붙여넣으세요 (기존 내용과 합치며 중복 문장은 자동 제거됩니다)');if(v===null)return;const el=$(`rp_${kind}_${i}`);if(el)el.value=dedupMerge(el.value,v)}
function rpPhotoAdd(ev,i,kind){const box=kind==='p'?(_rp[i]=_rp[i]||[]):kind==='f'?(_fb[i]=_fb[i]||[]):(_sv[i]=_sv[i]||[]);const files=[...ev.target.files];let left=files.length;files.forEach(f=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const M=1200,sc=Math.min(1,M/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);box.push(cv.toDataURL('image/jpeg',0.82));if(--left===0)render()};img.src=r.result};r.readAsDataURL(f)})}
function rpPhotoDel(i,kind,j){(kind==='p'?_rp[i]:kind==='f'?_fb[i]:_sv[i]).splice(j,1);render()}
function genSummary(){const s=rpGet();if(!s)return;rpCollect();const r=s.report;const tot=r.classes.reduce((a,c)=>a+Number(c.count||0),0);const quotes=r.classes.filter(c=>c.feel).map(c=>{const sen=String(c.feel).split(/(?<=다\.)\s+/).slice(0,5).join(' ');return `○ ${c.name}(${c.teacher||'담당강사'}): "${sen}"`}).join('\n');$('rp_summary').value=`본 교육은 ${s.org||'기관'} 학생 ${tot}명(${r.classes.length}개 반)을 대상으로 ${fmtDate(s.date)||''} 「${s.program||''}」 프로그램으로 진행되었습니다. 학생들은 각 반별 활동에 적극적으로 참여하였으며, 교육 목표에 부합하는 유의미한 학습 성과를 확인할 수 있었습니다.\n\n[반별 담당강사 총평]\n${quotes||'○ (반별 소감을 입력하면 자동 인용됩니다)'}\n\nENK LAB AI Career Academy는 본 교육 결과를 바탕으로 더욱 내실 있는 교육 프로그램을 제공하도록 하겠습니다. 감사합니다.`}
function rpCollect(){const s=rpGet();if(!s||!s.report)return;const r=s.report;if($('rp_purpose'))r.purpose=$('rp_purpose').value;if($('rp_summary'))r.summary=$('rp_summary').value;r.classes.forEach((c,i)=>{if($('rp_name_'+i)){c.name=$('rp_name_'+i).value;c.teacher=$('rp_teacher_'+i).value;c.count=Number($('rp_count_'+i).value||0);c.content=$('rp_content_'+i).value;c.activity=$('rp_activity_'+i).value;c.feel=$('rp_feel_'+i).value}})}
function rpSave(){const s=rpGet();if(!s)return;rpCollect();saveState();toast('결과보고서가 저장되었습니다 (사진은 저장되지 않으며 출력 시에만 포함됩니다)')}
function renderReport(){setTitle('출강관리 · 결과보고서');const opts=state.schedules.filter(s=>s.date||s.org).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));$('app').innerHTML=schedTabs()+`<div class="card"><h3>📑 교육 결과보고서 (기관 제출용)</h3>${field('출강일정 선택',`<select onchange="rpSel=this.value;render()"><option value="">선택하세요</option>${opts.map(s=>`<option value="${s.id}"${s.id===rpSel?' selected':''}>${fmtDate(s.date)||'날짜미정'} · ${esc(s.org||'기관미정')} · ${esc(s.program||'')}</option>`).join('')}</select>`)}${rpSel?rpBody():'<p class="muted">출강일정을 선택하면 반 목록이 자동 생성됩니다. 사진은 저장되지 않으므로 출력 직전에 첨부하세요.</p>'}</div>`}
function rpBody(){const s=rpGet();const r=rpEnsure(s);return `<div class="grid g12" style="margin-top:8px">${field('교육 목적',`<textarea id="rp_purpose">${esc(r.purpose||'')}</textarea>`,'c12')}</div><div class="grid-sub">반별 교육 결과 (${r.classes.length}개 반)</div>${r.classes.map((c,i)=>{const ph=_rp[i]||[],sv=_sv[i]||[];return `<div style="border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px"><div class="grid g12">${field('반',`<input id="rp_name_${i}" value="${esc(c.name)}">`,'c2')}${field('담당강사',`<input id="rp_teacher_${i}" value="${esc(c.teacher)}">`,'c3')}${field('인원',`<input type="number" id="rp_count_${i}" value="${c.count||0}">`,'c2')}<div class="field c5"><label>&nbsp;</label><div><button class="btn btn-ghost mini" onclick="rpPaste(${i},'content')">📋 교육내용 붙여넣기(중복제거)</button> <button class="btn btn-ghost mini" onclick="rpPaste(${i},'activity')">📋 교육활동 붙여넣기</button> <button class="btn btn-red mini" onclick="rpDelClass(${i})">반 삭제</button></div></div>${field('교육내용(차시별)',`<textarea id="rp_content_${i}">${esc(c.content||'')}</textarea>`,'c6')}${field('교육활동',`<textarea id="rp_activity_${i}">${esc(c.activity||'')}</textarea>`,'c6')}${field('강사 교육소감 (1명)',`<textarea id="rp_feel_${i}">${esc(c.feel||'')}</textarea>`,'c12')}${field(`활동사진 ${ph.length}장 (기본 8장 권장)`,`<input type="file" accept="image/*" multiple onchange="rpPhotoAdd(event,${i},'p')"><div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:5px">${ph.map((p,j)=>`<span style="position:relative"><img src="${p}" style="height:52px;border-radius:5px"><button onclick="rpPhotoDel(${i},'p',${j})" style="position:absolute;top:-6px;right:-6px;border:0;background:var(--warn);color:#fff;border-radius:50%;width:17px;height:17px;font-size:10px;cursor:pointer">✕</button></span>`).join('')}</div>`,'c6')}${field(`설문지 사진 ${sv.length}장 (2~4장)`,`<input type="file" accept="image/*" multiple onchange="rpPhotoAdd(event,${i},'s')"><div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:5px">${sv.map((p,j)=>`<span style="position:relative"><img src="${p}" style="height:52px;border-radius:5px"><button onclick="rpPhotoDel(${i},'s',${j})" style="position:absolute;top:-6px;right:-6px;border:0;background:var(--warn);color:#fff;border-radius:50%;width:17px;height:17px;font-size:10px;cursor:pointer">✕</button></span>`).join('')}</div>`,'c6')}${field(`소감문 사진 ${(typeof fb!=='undefined'?fb.length:(_fb[i]||[]).length)}장 (반별 4장 · 보고서 맨 뒤에 배치)`,`<input type="file" accept="image/*" multiple onchange="rpPhotoAdd(event,${i},'f')"><div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:5px">${(_fb[i]||[]).map((p,j)=>`<span style="position:relative"><img src="${p}" style="height:52px;border-radius:5px"><button onclick="rpPhotoDel(${i},'f',${j})" style="position:absolute;top:-6px;right:-6px;border:0;background:var(--warn);color:#fff;border-radius:50%;width:17px;height:17px;font-size:10px;cursor:pointer">✕</button></span>`).join('')}</div>`,'c12')}</div></div>`}).join('')}<div class="toolbar"><button class="btn btn-ghost mini" onclick="rpAddClass()">＋ 반 추가</button></div><div class="grid-sub">Ⅳ. 종합 의견 (총평)</div><div class="grid g12">${field('총평',`<textarea id="rp_summary" style="min-height:170px">${esc(r.summary||'')}</textarea>`,'c12')}</div><div class="toolbar"><button class="btn btn-ghost" onclick="genSummary()">🪄 총평 자동 생성 (표준 문안+반별 강사평 인용)</button></div><div class="toolbar"><button class="btn btn-navy" onclick="rpSave()">저장</button><button class="btn btn-gold" onclick="rpPrint()">🖨 인쇄/PDF</button><button class="btn btn-blue" onclick="exportReportWord()">📄 Word(.doc)</button><button class="btn btn-blue" onclick="exportReportExcel()">📊 엑셀(.xls)</button></div>`}
function rpPages(withImgSrc){const s=rpGet();rpCollect();const r=s.report;const tot=r.classes.reduce((a,c)=>a+Number(c.count||0),0);const F=(n)=>`<div style="text-align:center;color:#5B6B7B;font-size:11px;margin-top:14px;border-top:1px solid #D7DEE6;padding-top:5px">ENK LAB AI Career Academy · 010-2507-5874 &nbsp;&nbsp; - ${n} -</div>`;const P=(inner,n)=>`<div class="rp-page" style="page-break-after:always">${inner}${n?F(n):''}</div>`;let pg=0;const pages=[];
pages.push(P(`<div style="text-align:center;padding-top:70px"><div style="font-size:13px;letter-spacing:.3em;color:#B8860B;font-weight:800">EDUCATION RESULT REPORT</div><div style="font-size:30px;font-weight:900;color:#0F2A44;margin:22px 0;border-top:3px solid #0F2A44;border-bottom:3px solid #0F2A44;padding:26px 0">${new Date().getFullYear()}년 ${esc(s.program||'교육 프로그램')}<br>교육 결과보고서</div><table style="margin:34px auto;border-collapse:collapse;font-size:14px">${[['기관명',s.org],['교육일',fmtDate(s.date)],['대상',s.grade],['총 인원',tot+'명 ('+r.classes.length+'개 반)'],['주관','ENK LAB AI Career Academy']].map(x=>`<tr><td style="border:1px solid #0F2A44;background:#EEF3F8;padding:7px 20px;font-weight:800">${x[0]}</td><td style="border:1px solid #0F2A44;padding:7px 30px">${esc(x[1]||'')}</td></tr>`).join('')}</table>${withImgSrc!=='none'?`<img src="${REPORT_LOGO}" style="width:150px;margin-top:46px">`:''}</div>`,0));
pages.push(P(`<h2 style="color:#0F2A44">목 차</h2><div style="font-size:15px;line-height:2.4;margin-top:20px">Ⅰ. 교육 개요<br>Ⅱ. 프로그램 구성 (반별 편성)<br>Ⅲ. 반별 교육 결과<br>Ⅳ. 종합 의견</div>`,++pg));
pages.push(P(`<h2 style="color:#0F2A44;border-left:6px solid #B8860B;padding-left:9px">Ⅰ. 교육 개요</h2><table style="width:100%;border-collapse:collapse;font-size:13px">${[['교육명',s.program],['기관',s.org],['교육일',fmtDate(s.date)],['시간',(s.startTime||'')+(s.endTime?'~'+s.endTime:'')],['대상',s.grade],['반 수 / 총 인원',r.classes.length+'개 반 / '+tot+'명'],['강사진',[...new Set(r.classes.map(c=>c.teacher).filter(Boolean))].join(', ')],['교육 목적',r.purpose]].map(x=>`<tr><td style="border:1px solid #9FB0C0;background:#EEF3F8;padding:6px 10px;width:130px;font-weight:800">${x[0]}</td><td style="border:1px solid #9FB0C0;padding:6px 10px;white-space:pre-wrap">${esc(x[1]||'')}</td></tr>`).join('')}</table><h2 style="color:#0F2A44;border-left:6px solid #B8860B;padding-left:9px;margin-top:24px">Ⅱ. 프로그램 구성 (반별 편성)</h2><table style="width:100%;border-collapse:collapse;font-size:13px"><tr style="background:#0F2A44;color:#fff">${['반','학년','담당강사','사용교구','주제','인원'].map(h=>`<th style="border:1px solid #0F2A44;padding:6px">${h}</th>`).join('')}</tr>${(s.classes||[]).map((c,i)=>`<tr>${[c.label||(i+1)+'반',c.grade,c.main,c.equip,c.theme,c.count].map(v=>`<td style="border:1px solid #9FB0C0;padding:6px;text-align:center">${esc(v??'')}</td>`).join('')}</tr>`).join('')}</table>`,++pg));
r.classes.forEach((c,i)=>{pages.push(P(`<h2 style="color:#0F2A44;border-left:6px solid #B8860B;padding-left:9px">Ⅲ. 반별 교육 결과 — ${esc(c.name)} <span style="font-size:14px;color:#5B6B7B">(담당 ${esc(c.teacher||'-')} · ${c.count||0}명)</span></h2><h3 style="color:#0F2A44">1. 교육내용</h3><div style="white-space:pre-wrap;font-size:13px;line-height:1.7">${esc(c.content||'')}</div><h3 style="color:#0F2A44">2. 교육활동</h3><div style="white-space:pre-wrap;font-size:13px;line-height:1.7">${esc(c.activity||'')}</div><h3 style="color:#0F2A44">3. 강사 교육소감</h3><div style="white-space:pre-wrap;font-size:13px;line-height:1.7;background:#F5F8FB;border:1px solid #D7DEE6;border-radius:6px;padding:10px">${esc(c.feel||'')}</div>`,++pg));
const ph=_rp[i]||[];for(let k=0;k<ph.length;k+=8){pages.push(P(`<h3 style="background:#0F2A44;color:#fff;text-align:center;padding:8px;border-radius:5px">[ ${esc(c.name)} 활동 사진 ]</h3><table style="width:100%"><tr>${ph.slice(k,k+8).map((p,j)=>(j%2===0?'</tr><tr>':'')+`<td style="width:50%;padding:6px;text-align:center"><img src="${p}" style="width:100%;max-height:220px;object-fit:cover;border:1px solid #9FB0C0"></td>`).join('')}</tr></table>`,++pg))}
const sv=_sv[i]||[];for(let k=0;k<sv.length;k+=2){pages.push(P(`<h3 style="background:#0F2A44;color:#fff;text-align:center;padding:8px;border-radius:5px">[ ${esc(c.name)} 설문지 ]</h3>${sv.slice(k,k+2).map(p=>`<div style="text-align:center;margin:8px 0"><img src="${p}" style="max-width:88%;max-height:420px;border:1px solid #9FB0C0"></div>`).join('')}`,++pg))}});
pages.push(P(`<h2 style="color:#0F2A44;border-left:6px solid #B8860B;padding-left:9px">Ⅳ. 종합 의견</h2><div style="white-space:pre-wrap;font-size:13.5px;line-height:1.9">${esc(r.summary||'')}</div><div style="text-align:center;margin-top:60px;font-weight:900;font-size:16px;color:#0F2A44">ENK LAB AI Career Academy</div>`,++pg));
r.classes.forEach((c,i)=>{const fb=_fb[i]||[];for(let k=0;k<fb.length;k+=4){pages.push(P(`<h3 style="background:#0F2A44;color:#fff;text-align:center;padding:8px;border-radius:5px">[ ${esc(c.name)} 학생 소감문 ]</h3><table style="width:100%"><tr>${fb.slice(k,k+4).map((p,j)=>(j%2===0&&j>0?'</tr><tr>':'')+`<td style="width:50%;padding:6px;text-align:center"><img src="${p}" style="width:100%;max-height:330px;object-fit:contain;border:1px solid #9FB0C0"></td>`).join('')}</tr></table>`,++pg))}});
return pages.join('')}
function rpPrint(){const s=rpGet();if(!s)return;doPrint(`<div class="p-doc">${rpPages('inline')}</div>`)}
function exportReportWord(){const s=rpGet();if(!s)return;const body=rpPages('inline');const html=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><xml><w:WordDocument><w:View>Print</w:View></w:WordDocument></xml><style>@page WordSection1{size:210mm 297mm;margin:18mm 16mm 18mm 16mm}div.WordSection1{page:WordSection1}.rp-page{page-break-after:always}body{font-family:'맑은 고딕',sans-serif}</style></head><body><div class="WordSection1">${body}</div></body></html>`;downloadText('\ufeff'+html,`[ENK LAB] ${s.org||''}_${s.program||''}_결과보고서_${s.date||today()}.doc`,'application/msword;charset=utf-8')}
function exportReportExcel(){const s=rpGet();if(!s)return;rpCollect();const r=s.report;const X=t=>String(t??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/\n/g,'&#10;');const C=(v,st)=>`<Cell${st?` ss:StyleID="${st}"`:''}><Data ss:Type="${typeof v==='number'?'Number':'String'}">${typeof v==='number'?v:X(v)}</Data></Cell>`;const ROW=(cells)=>`<Row>${cells}</Row>`;const tot=r.classes.reduce((a,c)=>a+Number(c.count||0),0);
const opts=`<WorksheetOptions xmlns="urn:schemas-microsoft-com:office:excel"><PageSetup><Layout x:Orientation="Portrait"/></PageSetup><Print><ValidPrinterInfo/><PaperSizeIndex>9</PaperSizeIndex></Print></WorksheetOptions>`;
const sheet1=`<Worksheet ss:Name="결과보고서"><Table><Column ss:Width="80"/><Column ss:Width="70"/><Column ss:Width="45"/><Column ss:Width="240"/><Column ss:Width="240"/><Column ss:Width="60"/><Column ss:Width="60"/><Column ss:Width="60"/>`+
 [['교육명',s.program],['기관',s.org],['교육일',fmtDate(s.date)],['대상',s.grade],['반 수/총 인원',r.classes.length+'개 반 / '+tot+'명'],['교육 목적',r.purpose]].map(x=>ROW(C(x[0],'k')+C(x[1]||'','w'))).join('')+
 ROW('')+ROW(['반','담당강사','인원','교육내용','교육활동','사진 장수','설문 장수','소감문 장수'].map(h=>C(h,'h')).join(''))+
 r.classes.map((c,i)=>ROW(C(c.name,'w')+C(c.teacher,'w')+C(Number(c.count||0),'w')+C(c.content,'w')+C(c.activity,'w')+C((_rp[i]||[]).length,'w')+C((_sv[i]||[]).length,'w')+C((_fb[i]||[]).length,'w'))).join('')+
 ROW('')+ROW(C('종합 의견','k')+C(r.summary||'','w'))+`</Table>${opts}</Worksheet>`;
const sheet2=`<Worksheet ss:Name="소감문"><Table><Column ss:Width="70"/><Column ss:Width="80"/><Column ss:Width="430"/><Column ss:Width="70"/>`+
 ROW(['반','담당강사','강사 교육소감','소감문 사진 장수'].map(h=>C(h,'h')).join(''))+
 r.classes.map((c,i)=>ROW(C(c.name,'w')+C(c.teacher,'w')+C(c.feel,'w')+C((_fb[i]||[]).length,'w'))).join('')+`</Table>${opts}</Worksheet>`;
const xml=`<?xml version="1.0"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Styles><Style ss:ID="h"><Interior ss:Color="#0F2A44" ss:Pattern="Solid"/><Font ss:Color="#FFFFFF" ss:Bold="1"/><Alignment ss:Horizontal="Center" ss:Vertical="Center"/><Borders><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Top" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Left" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Right" ss:LineStyle="Continuous" ss:Weight="1"/></Borders></Style><Style ss:ID="k"><Interior ss:Color="#EEF3F8" ss:Pattern="Solid"/><Font ss:Bold="1"/><Borders><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Top" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Left" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Right" ss:LineStyle="Continuous" ss:Weight="1"/></Borders></Style><Style ss:ID="w"><Alignment ss:Vertical="Top" ss:WrapText="1"/><Borders><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Top" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Left" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Right" ss:LineStyle="Continuous" ss:Weight="1"/></Borders></Style></Styles>${sheet1}${sheet2}</Workbook>`;
downloadText('\ufeff'+xml,`[ENK LAB] ${s.org||''}_${s.program||''}_결과보고서_${s.date||today()}.xls`,'application/vnd.ms-excel;charset=utf-8')}

function init(){const h=(window.location&&window.location.hash)||'';
if(h.indexOf('#view=')===0){try{renderSharedSchedule(JSON.parse(decodeURIComponent(escape(atob(h.slice(6))))));return}catch(e){alert('공유 링크를 해석할 수 없습니다.')}}
loadState();
if(h.indexOf('#sync=')===0){try{const q={};h.slice(1).split('&').forEach(kv=>{const i=kv.indexOf('=');if(i>0)q[kv.slice(0,i)]=decodeURIComponent(kv.slice(i+1))});if(q.sync){state.settings.syncUrl=q.sync;if(q.k)state.settings.syncKey=q.k;saveState();cloudLoad(true).then(()=>finishInit()).catch(()=>finishInit());return}}catch(e){}}
finishInit()}
function finishInit(){loadState();if(!state.settings.pin){const lp=ls(LEGACY_KEYS.pin);if(lp){state.settings.pin=lp;saveState()}}if(initSetup())return;if(detectLegacy()&&!localStorage.getItem(LEGACY_DONE_KEY)){openModal(`<h3>기존 데이터가 발견되었습니다</h3><p class="muted">업데이트 전 자동 백업 후 새 시스템으로 변환합니다. 기존 데이터는 삭제하지 않습니다.</p><div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal();render()">나중에 하기</button><button class="btn btn-navy" onclick="backupLegacyDownload();migrateLegacy();closeModal();render()">백업 후 변환 시작</button></div>`)}try{autoCompleteSweep();peAlertCheck()}catch(e){}render()}
init();
</script>
